/* ================= Actions ================= */
const ACT = {
  pause(){ S.paused = !S.paused; renderControls(); },
  speed(d){ S.speed = +d.v; renderControls(); },
  lang(d){ const wasOpen = modalOpen && $('#modal .setlist'); setLang(d.v); if(wasOpen) openSettings(true); },
  settings(){ openSettings(false); },
  custom(){ openCustom(false); },
  skin(d){ if(skinLocked(d.v)) return; SET.skin = d.v; saveSet(); applySettings(); if(d.v === 'gold'){ sfx.fame(); burst(['#ffd000','#ffffff','#ffb300','#fff3a0'], 50); } openSettings(true); },
  legal(d){ R.legal = +d.v; saveRules(); dirty = true; openCustom(true); },
  resetrules(){ R = Object.assign({}, RULES_DEF); saveRules(); dirty = true; sfx.pop(); openCustom(true); },
  resetach(d, b){ if(!arm(b, t('confirm'))) return; ACH = {}; store.del(ACH_KEY); applySettings(); sfx.breakup(); openSettings(true); },
  soulmate(){ openSoulmate(false); },
  seek(d){ S.seek = d.sex; cands = genCands(); sfx.pop(); openSoulmate(true); },
  refresh(){ cands = genCands(); sfx.pop(); openSoulmate(true); },
  choose(d){
    const c = cands[+d.i], me = active(); if(!c || currentUnion(me.id)) return;
    const day = today(), p = addPerson(Object.assign({}, c, {blood:false, city: me.city}));
    p.lastAge = ageAt(p, day); scheduleYear(p, p.lastAge, day);
    S.unions.push({id:S.nextId++, a:me.id, b:p.id, start:day, married:false, marriedAt:null, end:null, endReason:null, preg:null});
    log('love','couple',[me.id, p.id]);
    sfx.sparkle(); burst(['#ff2f9c','#ffffff','#ff9ad2']);
    checkConq(me.id);
    closeModal(); render(); save();
  },
  fiche(d){ openFiche(+d.id); },
  name(d){ giveName(d.n); },
  leave(d, b){
    const me = active(), u = currentUnion(me.id), p = P(+d.id); if(!u || u.b !== p.id) return;
    if(!arm(b, t('confirm_leave', p.first))) return;
    endUnion(u, today(), true);
    sfx.breakup(); closeModal(); render(); save();
  },
  baby(d){
    const me = active(), u = currentUnion(me.id); if(!u || u.preg) return;
    const pa = P(u.a), pb = P(u.b), mother = pa.sex !== pb.sex ? [pa,pb].find(q => q.sex==='F') : null;
    if(mother && !fertile(mother, today())) return;
    startPregnancy(u, today(), true);
    sfx.sparkle(); dirty = true; save(); openFiche(+d.id);
  },
  famauto(d, b){ S.familyAuto = !!b.checked; dirty = true; save(); },
  achs(){ openAchievements(); },
  anyage(){ S.seekAge = null; cands = genCands(); sfx.pop(); openSoulmate(true); },
  relocate(){
    const me = active(), custom = ($('#relocNew').value || '').trim().replace(/\s+/g, ' ');
    const city = custom ? cap(custom) : $('#relocSel').value;
    if(!city || city === me.city) return;
    if(!CITIES.includes(city)){                                         // ville créée : placée quelque part en France sur la carte
      S.customCities = S.customCities || []; if(!S.customCities.includes(city)) S.customCities.push(city);
    }
    move(me, today(), city); sfx.move(); closeModal(); render(); save();
  },
  view(d){ setView(d.v); },
  mtab(d){ setMobileTab(d.v); },
  mapzoom(d){ const v = +d.v; if(v === 0){ mz = {z:1, x:0, y:0}; applyMapZoom(); } else setMapZoom(mz.z * (v > 0 ? 1.5 : 1/1.5)); },
  auto(){ S.auto = !S.auto; dirty = true; log('info', S.auto ? 'auto_on' : 'auto_off', [], undefined, true); renderControls(); save(); },
  zoom(d){ const v = +d.v; if(v === 0) fitZoom(); else setZoom(zoom * (v > 0 ? 1.25 : 0.8)); },
  marry(d){
    const me = active(), u = currentUnion(me.id), p = P(+d.id); if(!u || u.married) return;
    if(Math.random() < .05){ log('sad','refuse',[p.id, me.id]); sfx.refuse(); }                     // 5 % de refus
    else { u.married = true; u.marriedAt = today(); log('wed','wed',[me.id, p.id]); sfx.wedding(); burst(['#ffcc00','#ffffff','#ff8a00','#ff2f9c']); }
    dirty = true; save(); openFiche(p.id);
  },
  incarnate(d){
    const p = P(+d.id); if(!p || p.death!=null || !p.blood) return;
    S.activeId = p.id; log('info','incarnate',[p.id]);
    sfx.start(); closeModal(); render(); centerOn(p.id, true); save();
  },
  heir(d){
    const p = P(+d.id); if(!p || p.death!=null || !needHeir()) return;
    const old = active();
    S.activeId = p.id; log('info','heir',[p.id, old.id]);
    sfx.start(); closeModal(true); render(); centerOn(p.id, true); save();
  },
  keep(){ if(S.end2100 !== 1) return; S.end2100 = 2; closeModal(true); save(); },
  close(){ closeModal(); },
  center(){ centerOn(S.activeId, true); },
  restart(d, b){ if(!arm(b, t('confirm'))) return; newGame(); },
  newgame(){ newGame(); },
  resume(){ try{ S = JSON.parse(store.get(SAVE_KEY)); }catch(e){ S = null; } if(S) enterGame(); },
  random(){ randomFounder(); }
};

(() => {   // glisser pour se déplacer dans l'arbre (souris)
  const sc = $('#treeScroll'); let drag = null;
  sc.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.node')) return;
    drag = {x:e.clientX, y:e.clientY, l:sc.scrollLeft, t:sc.scrollTop}; sc.setPointerCapture(e.pointerId); sc.classList.add('grabbing');
  });
  sc.addEventListener('pointermove', e => { if(!drag) return; sc.scrollLeft = drag.l - (e.clientX-drag.x); sc.scrollTop = drag.t - (e.clientY-drag.y); });
  let pinch = null;                                // pincer à deux doigts pour zoomer
  sc.addEventListener('touchstart', e => {
    if(e.touches.length === 2){ const [a,b] = e.touches; pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: zoom}; }
  }, {passive:true});
  sc.addEventListener('touchmove', e => {
    if(!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const [a,b] = e.touches, d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), r = sc.getBoundingClientRect();
    setZoom(pinch.z * d / pinch.d, (a.clientX+b.clientX)/2 - r.left, (a.clientY+b.clientY)/2 - r.top);
  }, {passive:false});
  sc.addEventListener('touchend', e => { if(e.touches.length < 2) pinch = null; });
  sc.addEventListener('wheel', e => {
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = sc.getBoundingClientRect();
    setZoom(zoom * Math.exp(-e.deltaY * .0018), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});
  const end = () => { drag = null; sc.classList.remove('grabbing'); };
  sc.addEventListener('pointerup', end); sc.addEventListener('pointercancel', end);
})();

function applyStatic(){
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-ta]').forEach(el => el.setAttribute('aria-label', t(el.dataset.ta)));
  $$('[data-tt]').forEach(el => el.setAttribute('title', t(el.dataset.tt)));
  $$('[data-act="lang"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === LANG)));
  const sel = fMonth.value; fMonth.innerHTML = ''; t('months').forEach((m,i) => fMonth.add(new Option(m, i))); fMonth.value = sel;
  [...fDay.options].forEach((o,i) => { o.text = (LANG==='fr' && i===0) ? '1er' : String(i+1); });
  refreshAge();
}
function setLang(l){
  LANG = l === 'en' ? 'en' : 'fr'; store.set(LANG_KEY, LANG);
  $('#mapView').innerHTML = ''; dotEls = new Map();                    // la carte se redessine dans la nouvelle langue
  applyStatic();

/* ================= Écran de départ ================= */
const fDay = $('#fDay'), fMonth = $('#fMonth'), fYear = $('#fYear'), fRange = $('#fAgeRange'), fStart = $('#fStart'), fCity = $('#fCity');
for(let i=1;i<=31;i++) fDay.add(new Option(String(i), i));
CITIES.forEach(c => fCity.add(new Option(c, c)));
const fSex = () => document.querySelector('input[name=sex]:checked').value;
const startYear = () => { const v = Math.round(+fStart.value); return v >= 1500 && v <= 2050 ? v : null; };
function setupAge(){
  const s = startYear(), y = +fYear.value, m = +fMonth.value, d = +fDay.value;
  if(!s || !y || y < s-120 || y > s) return null;
  const birth = fromYMD(y, m, Math.min(d, daysIn(y,m))), st = fromYMD(s,0,1);
  return birth > st ? -1 : ageAt({birth}, st);
}
function refreshAge(){
  const s = startYear() || 1900, a = setupAge();
  $('#fAgeLab').textContent = t('age_on', fmt(fromYMD(s,0,1)));
  $('#fAge').textContent = a == null ? '—' : a < 0 ? t('not_born') : tA(a);
  if(a != null && a >= 0) fRange.value = Math.min(100, a);
  $('#fStartBtn').textContent = t('start_btn', s);
  fYear.min = s - 120; fYear.max = s;
}
function setAge(a){
  const s = startYear() || 1900, d = +fDay.value, m = +fMonth.value;
  fYear.value = (m===0 && d===1) ? s - a : s - 1 - a;
  refreshAge();
}
[fDay, fMonth, fYear].forEach(el => el.addEventListener('input', refreshAge));
fStart.addEventListener('input', () => { const a = +fRange.value; if(startYear()) setAge(a); else refreshAge(); });
fRange.addEventListener('input', () => setAge(+fRange.value));
function randomFounder(){
  const sex = fSex(), s = startYear() || 1900, a = rnd(18, 32);
  fDay.value = rnd(1, 28); fMonth.value = rnd(0, 11);
  setAge(a);
  $('#fFirst').value = wpick(namePool(+fYear.value, sex)); $('#fLast').value = pickSurname(s);
  fCity.value = pick(CITIES); sfx.pop();
}
$('#setupForm').addEventListener('submit', e => {
  e.preventDefault(); sfx.init(); music.ensure();
  const err = $('#fErr'), first = $('#fFirst').value.trim(), last = $('#fLast').value.trim(), s = startYear();
  const y = +fYear.value, m = +fMonth.value, d = +fDay.value;
  let msg = '';
  if(!first || !last) msg = t('err_name');
  else if(!s) msg = t('err_start');
  else if(!y || y < s-120 || y > s) msg = t('err_year', s-120, s);
  else if(d > daysIn(y,m)) msg = t('err_days', t('months')[m], y, daysIn(y,m));
  else if(fromYMD(y,m,d) > fromYMD(s,0,1)) msg = t('err_after', fmt(fromYMD(s,0,1)));
  if(msg){ err.textContent = msg; err.hidden = false; sfx.refuse(); return; }
  err.hidden = true;
  S = newState(s);
  const day = today(), city = fCity.value;
  const p = addPerson({first: cap(first), last: cap(last), sex:fSex(), birth:fromYMD(y,m,d), blood:true, city, birthCity:city});
  p.lastAge = ageAt(p, day);
  p.conds = rollConds([]);
  if(p.lastAge >= R.legal) rollAddictions(p, day);
  planInterests(p, day);
  setupWork(p, day);
  S.activeId = S.founderId = p.id;
  S.familyAuto = $('#fFam').checked;
  log('info','start',[p.id, p.lastAge], day);
  scheduleYear(p, p.lastAge, day);
  sfx.start(); store.del(SAVE_KEY); enterGame(); save();
});

function showSetup(){
  $('#game').hidden = true; $('#setup').hidden = false;
  if(modalOpen) closeModal(true);
  let saved = null; try{ saved = JSON.parse(store.get(SAVE_KEY)); }catch(e){}
  const box = $('#resumeBox');
  if(saved && saved.v===2 && !saved.over && saved.people && saved.people[saved.activeId]){
    const a = saved.people[saved.activeId], f = saved.people[saved.founderId];
    box.innerHTML = `<p>${t('resume_txt', esc(f.last), fmt(saved.t), esc(a.first+' '+a.last))}</p><button class="gel lime" data-act="resume"><span>${t('resume')}</span></button>`;
    box.hidden = false;
  } else box.hidden = true;
}
function enterGame(){

function boot(data){
  if(data && data.save){ try{ S = JSON.parse(data.save); }catch(e){ S = null; } }
