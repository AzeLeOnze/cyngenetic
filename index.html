<script>
(() => {
'use strict';
/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lc = s => (!s || (s.length>1 && /[A-ZÉ]/.test(s[1]))) ? s : s.charAt(0).toLowerCase() + s.slice(1);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const APP_VERSION = '0.1.7a';
/* Notes de mise à jour (la plus récente en premier) */
const PATCHNOTES = [
  {v:'0.1.7a', date:{fr:'13 novembre 2026', en:'November 13, 2026'},
   fr:['Nouveau mode Versus : affronte une IA ! Au départ, choisis le mode (Normal, Royal ou Zombie), la difficulté (Promenade de santé, Standard, Périple ou Extrême) et l\'objectif de victoire, puis crée ton personnage. La partie commence toujours en 1780.',
       'Objectifs du Versus : Partie de vitesse (le plus de générations), de lenteur (le moins de générations), de Star (le plus de stars) ou de Crime (le plus de meurtres). En mode Royal : vitesse, lenteur ou Partie de Noble (le plus de Nobles). En mode Zombie : Partie Classique (le plus de vivants en 2100).',
       'Sur ordinateur, l\'écran est partagé : ta famille à gauche, celle de l\'IA à droite, avec ses Cyn, son arbre et le score en direct. Sur téléphone, l\'IA a son propre onglet. Si plus personne n\'est en vie dans une famille, elle a perdu.',
       'Le nouveau logo devient l\'icône du jeu : onglet du navigateur et application installée.',
       'Correction : les succès de meurtres (Double peine, etc.) se débloquent de nouveau, avec l\'effet du meurtre sur l\'arbre.',
       'Mode Zombie : plus de sifflement aigu dans la musique, et un grognement de zombie retentit à chaque nouvelle infection.'],
   en:['New Versus mode: face an AI! At the start, pick the mode (Normal, Royal or Zombie), the difficulty (Walk in the park, Standard, Odyssey or Extreme) and the victory goal, then create your character. The game always starts in 1780.',
       'Versus goals: Speed game (most generations), Slow game (fewest generations), Star game (most stars) or Crime game (most murders). In Royal mode: speed, slow or Noble game (most Nobles). In Zombie mode: Classic game (most family members alive in 2100).',
       'On computers the screen is split: your family on the left, the AI\'s on the right, with its Cyn, its tree and the live score. On phones the AI has its own tab. When nobody is left alive in a family, it loses.',
       'The new logo is now the game\'s icon: browser tab and installed app.',
       'Fix: the murder achievements (Double trouble, etc.) unlock again, with the murder effect on the tree.',
       'Zombie mode: no more high-pitched whistle in the music, and a zombie growl sounds with every new infection.']},
  {v:'0.1.6a', date:{fr:'13 novembre 2026', en:'November 13, 2026'},
   fr:['Mode Zombie : l\'Antidote ne s\'achète qu\'à partir de la 120e année de jeu (1900 pour une partie commencée en 1780).',
       'Nouveau logo, beaucoup plus épuré : un « C » blanc sur fond bleu, avec trois points verts comme trois générations.',
       'Boutique : nouveau thème Windows XP (2 000 Cyn), avec sa colline verte, son ciel bleu et ses fenêtres d\'époque.',
       'Nouveau diplôme marrant : le CAP Flemme (rare). Ses diplômés passent quelques années sur le canapé avant de chercher du travail.',
       '8 nouveaux métiers : garde-chasse, éclusier, criminologue (depuis 1890), organiste liturgique, souffleur de verre, maître verrier, taxidermiste (depuis 1750) et professeur de kung-fu (depuis 1970).',
       '5 nouveaux centres d\'intérêt : urbex (depuis 1990), langues mortes, radioamateur (depuis 1910), paintball (depuis 1985) et airsoft (depuis 1990).',
       '6 nouvelles particularités : trouble délirant, oniomanie (depuis 1900), TDI (depuis 1880), syndrome d\'Alice au pays des merveilles (depuis 1955), syndrome de Cotard (depuis 1880) et syndrome de Capgras (depuis 1923).',
       'Correction : un conjoint sur mesure « fan d\'une célébrité de la famille » affiche maintenant le nom de la star, vivante ou morte. Ce choix n\'apparaît plus s\'il n\'y a aucune star dans la famille.',
       'Ordinateur : la bulle des Cyn est à la même distance du bord du haut que du bord de gauche.'],
   en:['Zombie mode: the Antidote can only be bought from the 120th year of the game (1900 for a game started in 1780).',
       'New, much cleaner logo: a white "C" on a blue background, with three green dots like three generations.',
       'Shop: new Windows XP theme (2,000 Cyn), with its green hill, blue sky and old-school windows.',
       'New funny diploma: the Slacking CAP (rare). Its graduates spend a few years on the sofa before looking for work.',
       '8 new jobs: gamekeeper, lock keeper, criminologist (from 1890), church organist, glassblower, master glazier, taxidermist (from 1750) and kung fu teacher (from 1970).',
       '5 new interests: urban exploring (from 1990), dead languages, radio ham (from 1910), paintball (from 1985) and airsoft (from 1990).',
       '6 new traits: delusional disorder, compulsive buying (from 1900), DID (from 1880), Alice in Wonderland syndrome (from 1955), Cotard syndrome (from 1880) and Capgras syndrome (from 1923).',
       'Fix: a custom spouse who is a "fan of a family celebrity" now shows the star\'s name, alive or dead. The option no longer appears when the family has no star.',
       'Computer: the Cyn bubble now sits as far from the top edge as from the left edge.']},
  {v:'0.1.5b', date:{fr:'12 novembre 2026', en:'November 12, 2026'},
   fr:['Mode Zombie : dès le premier zombie, l\'ambiance change. L\'écran verdit et s\'assombrit peu à peu, et des fissures apparaissent dans le décor et sur l\'arbre, de plus en plus nombreuses jusqu\'en 2100.',
       'Mode Zombie : contamination réduite à 2 % par an. En devenant zombie, une star ou un criminel perd ce statut.',
       'Boutique refaite, plus lisible (une liste claire avec le prix à droite), avec une section Survie en mode Zombie : le Vaccin protège maintenant 20 ans, et le nouvel Antidote (500 Cyn) guérit un zombie, qui redevient humain et reste protégé 20 ans. Ni l\'un ni l\'autre ne s\'achète après 2050.',
       'Nouveau succès « Survivant » : terminer le mode Zombie de 1780 à 2100.'],
   en:['Zombie mode: from the first zombie on, the mood changes. The screen slowly turns greener and darker, and cracks spread across the scenery and the tree, more and more until 2100.',
       'Zombie mode: infection lowered to 2% per year. A star or a criminal loses that status on turning into a zombie.',
       'Shop redesigned and easier to read (a clear list with the price on the right), with a Survival section in Zombie mode: the Vaccine now protects for 20 years, and the new Antidote (500 Cyn) cures a zombie, who becomes human again and stays protected for 20 years. Neither can be bought after 2050.',
       'New achievement "Survivor": finish Zombie mode from 1780 to 2100.']},
  {v:'0.1.5a', date:{fr:'12 novembre 2026', en:'November 12, 2026'},
   fr:['Nouveau mode de jeu : le Mode Zombie, à cocher au départ (comme le mode Royal, mais pas les deux à la fois). Pendant 60 ans, rien d\'anormal, avec un compte à rebours à côté des Cyn (« 59,4 ans avant le premier zombie ») et sa barre qui se vide.',
       'Puis un membre de la famille, au hasard, devient zombie : bulle verdâtre et pourrie, âge figé, date de mort « ? ». Un zombie ne peut plus se marier ni avoir d\'enfant, mais reste jouable. Chaque année, il contamine 3 % de ses voisins généalogiques (parents, enfants, conjoints), morts compris : les morts se relèvent !',
       'Quand plus aucun membre de la famille n\'est humain, la partie est perdue. Tenir jusqu\'en 2100, c\'est la victoire. Dès le premier zombie, la musique devient angoissante.',

  {v:'0.1.4i', date:{fr:'12 novembre 2026', en:'November 12, 2026'},

const letters = n => Array.from({length:n}, () => BOT_L[rnd(0, BOT_L.length-1)]).join('');
function neoName(sex){
  if(Math.random() < .2) return `X-${letters(rnd(1,2))}-${letters(1)}`;
  return pick(NEO_PRE) + cap(pick(NEO_MID) + pick(NEO_END[sex]));
}
function botName(){
  const r = Math.random();
  if(r < .25) return `${letters(1)}${rnd(0,9)} ${letters(2)} ${pick(BOT_SYL)}`;
  if(r < .5) return `BOT -${letters(1)}- ${pick(BOT_SYL)}`;
  if(r < .75) return `${letters(1)}${rnd(10,99)}${pick(BOT_SYL)}`;
  return `${pick(BOT_SYL)}-${rnd(100,999)}`;
}

  const pool = ok.length ? ok : list, other = pool.filter(r => r[0] !== cur);
  return pick(other.length ? other : pool)[0];
}

const royalOn = () => !!(S && S.royal && !S.royal.lost);
function findHeir(k){                                // 1) descendants du roi (aîné d'abord), 2) sinon un de ses frères, 3) sinon personne
  if(!k) return null;
  const kids = new Map();
  for(const c of Object.values(S.people)) if(c.parents && c.blood && !c.adopted) for(const pid of c.parents){ if(!kids.has(pid)) kids.set(pid, []); kids.get(pid).push(c); }
  const ok = c => S.royal.rule === 'both' || c.sex === (S.royal.rule === 'matri' ? 'F' : 'M');
  const can = c => c.death == null && !jailed(c) && c.noble !== 'dechu';      // un déchu a renoncé à la couronne      // un déchu a renoncé à la couronne
  // génération par génération : d'abord les enfants, puis les petits-enfants (par n'importe quel enfant), etc. — l'aîné du bon sexe
  let gen = kids.get(k.id) || [];
  while(gen.length){
    const c = gen.filter(x => ok(x) && can(x)).sort((x, y) => x.birth - y.birth)[0];
    if(c) return c.id;
    gen = gen.flatMap(x => kids.get(x.id) || []);
  }
  const bro = k.parents ? Object.values(S.people).filter(x => x.id !== k.id && x.blood && !x.adopted && can(x) && ok(x) && x.parents && x.parents.some(i => k.parents.includes(i))).sort((x, y) => x.birth - y.birth) : [];
  return bro.length ? bro[0].id : null;
}
function heirId(){
  if(!royalOn()) return null;
  if(RH === undefined) RH = findHeir(P(S.royal.king));
  return RH;
}
function nobleRank(p){                               // enfant d'un monarque : duc ; enfant d'un duc : comte ; « déchu » s'il a renoncé
  if(!p || !p.blood || !p.parents) return '';
  if(p.noble === 'dechu') return 'dechu';
  if(p.noble === 'noble') return 'noble';                      // titre définitif
  const par = p.parents.map(P).filter(Boolean);
  if(par.some(q => q.wasKing)) return 'duc';                   // enfant d'un monarque
  if(par.some(q => q.blood && !q.noble && !q.wasKing && q.parents && q.parents.some(i => { const g2 = P(i); return g2 && g2.wasKing; }))) return 'comte';   // enfant d'un duc ou du prince héritier
  return '';
}
function nobleYear(p, A, day){                        // ducs et comtes : 3 % de chances dans leur vie de renoncer à la vie royale
  if(!royalOn() || p.death != null || p.id === S.royal.king || p.id === heirId()) return;
  const r = nobleRank(p);
  if(r === 'noble' && A >= 18 && !p.nobilityJob && !(p.work && ['royal','star','prison','retired','uni','noble'].includes(p.work.s))){ p.nobilityJob = true; p.work = {s:'noble', act: actPick(NOBILITY_ACTS, day)}; }
  if(r === 'noble'){ p.nobleYears = (p.nobleYears || 0) + 1; if(p.nobleYears % 2 === 0) cyn(5 * (hasAtout(p,'richesse') ? 2 : 1), p.id); return; }   // un noble rapporte 5 Cyn tous les 2 ans
  if(r !== 'duc' && r !== 'comte') return;
  const w = p.work;
  if(A >= 18 && !p.nobleJobRoll && !(w && ['royal','star','prison','retired','uni'].includes(w.s))){       // 60 % prennent un métier réservé à la noblesse
    p.nobleJobRoll = true; if(Math.random() < .6){ p.work = {s:'noble', act: actPick(NOBLE_ACTS, day)}; dirty = true; }
  }
  if(r === 'comte' && A >= 16 && !p.nobleRoll){ p.nobleRoll = true; if(Math.random() < .22) p.nobleAt = day + rnd(0, 40*365); }   // 22 % des comtes deviennent nobles
  if(p.nobleAt != null && day >= p.nobleAt){ ennoble(p, day); return; }
  if(!p.dechuRoll && A >= 18){ p.dechuRoll = true; if(Math.random() < .03) p.dechuAt = day + rnd(0, 40*365); }

}

function royalTitle(p){
  if(!royalOn() || !p || p.id == null || p.death != null) return '';
  const fr = LANG === 'fr', F = p.sex === 'F';
  if(p.id === S.royal.king) return fr ? (F ? 'Reine' : 'Roi') : (F ? 'Queen' : 'King');
  if(p.id === heirId()) return fr ? (F ? 'Princesse' : 'Prince') : (F ? 'Princess' : 'Prince');
  const u = S.unions.find(x => x.end == null && ((x.a === S.royal.king && x.b === p.id) || (x.b === S.royal.king && x.a === p.id)));
  if(u) return F ? (fr ? 'Reine' : 'Queen') : (fr ? 'Prince consort' : 'Prince consort');
  const rank = nobleRank(p);
  if(rank === 'dechu') return fr ? (F ? 'Déchue' : 'Déchu') : 'Fallen';
  if(rank === 'duc') return fr ? (F ? 'Duchesse' : 'Duc') : (F ? 'Duchess' : 'Duke');
  if(rank === 'comte') return fr ? (F ? 'Comtesse' : 'Comte') : (F ? 'Countess' : 'Count');
  if(rank === 'noble') return 'Noble';
  return '';
}
function crown(p, day, silent){
  const prev = P(S.royal.king);
  if(p.noble === 'noble') unlock('r_nobleking');
  if(prev && prev.id !== p.id && (p.parents || []).some(i => { const q = P(i); return q && (q.parents || []).includes(prev.id); })) unlock('r_grandheir');
  S.royal.king = p.id; p.wasKing = true; p.reignStart = day; RH = undefined;
  if(p.crim && !p.crim.declared) delete p.crim; if(p.star && !p.star.famous) delete p.star; p.fameAt = null;   // un monarque n'a pas d'autre destin
  p.work = {s:'royal', act: actPick(ROYAL_ACTS, day)};
  log('star','crowned',[p.id], day, !silent);
  if(!silent){ sfx.fame(); burst(['#ffd000','#ffffff','#7a2bd6','#ffb300'], 60); cyn(100 * (hasAtout(p,'richesse') ? 2 : 1), p.id); }

function mildYear(p, A, day){                         // une fois par an : peut-être une maladie bénigne (cumulable)

  const era = yearOf(day) < 1900 ? 1.17 : yearOf(day) > 2010 ? .9 : 1;           // 0.1.4j : plus fréquentes avant 1900, moins après 2010

  }
}

  const w = r => (r[fIdx] && r[fIdx].w) || 1;
  let s = rows.reduce((a,r) => a + w(r), 0) * Math.random();
  for(const r of rows){ s -= w(r); if(s <= 0) return r; }
  return rows[rows.length-1];
}
function pickWarCause(p, day){
  const y = yearOf(day), A = ageAt(p, day);
  const r = wPickRow(WARCAUSES.filter(c => y >= c[5] && y <= c[6] && fits(c[7], p, A)), 7);
  return r ? r[0] : null;
}

function pickDisease(p, day){
  const y = dataYear(yearOf(day)), A = ageAt(p, day);
  const safe = hasAtout(p,'intel') ? ['domestique','charrette','route','route2','spatial'] : [];      // atout Intelligence
  const ok = DISEASES.filter(d => y >= d[4] && y <= d[5] && !(d[9] && (d[9].addict || d[9].special)) && !safe.includes(d[0]) && fits(d[9] || {}, p, A));
  return wPickRow(ok, 9) || DZ.pneumonie;
}

/* Probabilités de décès (sur toute la tranche d'âge), converties en risque annuel */
const BRACKETS = [[0,16,.004],[17,30,.015],[31,50,.043],[51,65,.071],[66,75,.18],[76,80,.29],
                  [81,85,.35],[86,90,.49],[91,96,.65],[97,104,.84],[105,120,.95]];
function yearlyRisk(a, p){
  if(a>=121) return 1;
  const b = BRACKETS.find(b => a>=b[0] && a<=b[1]);
  const r = 1 - Math.pow(1-b[2], 1/(b[1]-b[0]+1));
  return p && p.star ? r/2 : r;   // une star a une belle vie
}

const goldUnlocked = () => ACH_CATS.some(c => ACHS.filter(a => a[1]===c[0]).every(a => ACH[a[0]]));
const ACH_KEY = 'lignee.ach.v1';
let ACH = {}; try{ ACH = JSON.parse(store.get(ACH_KEY)) || {}; }catch(e){ ACH = {}; }
const achTitle = id => LANG==='fr' ? ACHV[id][3] : ACHV[id][5];
const achDesc = id => LANG==='fr' ? ACHV[id][4] : ACHV[id][6];
const medal = (id, cls='') => `<span class="medal t-${ACHV[id][2]} ${cls}">${icon(ACH_CATS.find(c => c[0]===ACHV[id][1])[1])}</span>`;
function unlock(id){
  if(VSH || !R.ach || rulesTweaked() || (S && (S.noAch || S.over || S.end2100 >= 1)) || ACH[id] || !ACHV[id]) return;
  const hadGold = goldUnlocked();
  ACH[id] = {y: S ? yearOf(S.t) : null, f: S ? familyName(P(S.founderId)) : ''};
  if(!hadGold && goldUnlocked()) setTimeout(() => { toast({d: S ? today() : 0, kind:'star', k:'gold', a:[]}); sfx.fame(); }, 3600);
  store.set(ACH_KEY, JSON.stringify(ACH));
  if(S) log('ach','ach',[id], undefined, false);
  achQueue.push(id); if(!achBusy) nextAch();
  if(id !== 'leg_all' && ACHS.every(a => a[0] === 'leg_all' || ACH[a[0]])) unlock('leg_all');   // Légende vivante : tous les autres succès
}
const checkTiers = (prefix, value, steps) => steps.forEach(s => { if(value >= s) unlock(prefix + s); });
const achQueue = []; let achBusy = false;
function nextAch(){
  const id = achQueue.shift();
  if(!id){ achBusy = false; return; }
  achBusy = true;
  if(typeof id === 'object'){                      // annonce au centre (naissances multiples sans fenêtre de prénom)
    const el = $('#achPop');
    el.className = 'achpop glass t-special'; el.innerHTML = id.html; el.hidden = false;
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.hidden = true; nextAch(); }, 420); }, 3600);
    return;
  }
  const el = $('#achPop'), tier = ACHV[id][2];
  el.className = 'achpop glass t-' + tier;

  const e = {d: d ?? today(), kind, k, a: a || []};
  S.log.push(e); if(S.log.length > 500) S.log.splice(0, S.log.length-500);
  if(!VSH && ((TOAST_KINDS.has(kind) && forceToast !== false) || forceToast === true)) toast(e);
  dirty = true;
}
const logText = e => { try{ return t('log_'+e.k, ...e.a); }catch(err){ return ''; } };

/* ================= Travail, école ================= */
function setupWork(p, day){             // pour un adulte qui arrive dans la partie (fondateur, conjoint)
  const A = ageAt(p, day), y = yearOf(day);
  if(A < 18) return;
  if(A >= p.retireAge){ p.work = {s:'retired'}; return; }
  if(A < p.firstJobAge){
    if(A <= 22 && Math.random() < p.uniP){ p.work = {s:'uni', field:pickField(y)[0], until: day + rnd(1,3)*365}; return; }
    p.work = {s:'odd', until: day + (p.firstJobAge - A)*365 + rnd(0,200)}; return;
  }
  p.work = {s:'job', job: pickJob(y, p)};
}
/* Après le CM2 (11 ans, dès que l'école existe), 5 % des enfants sont déscolarisés jusqu'à leur premier travail */
function dropout(p){
  if(yearOf(p.birth) + 11 < 1881) return false;
  p.school = p.school || {};
  if(p.school.drop == null) p.school.drop = Math.random() < .05;
  return p.school.drop;
}
function onAdult(p, day){               // 18 ans
  if(p.work && (p.work.s==='star' || p.work.s==='royal')) return;
  const y = yearOf(day);
  if(p.school && p.school.track === 'capflemme'){                  // CAP Flemme : quelques années sur le canapé avant de chercher du travail
    log('work','capflemme',[p.id],day); p.work = {s:'odd', until: day + Math.max(0, p.firstJobAge-18)*365 + rnd(365, 4*365)}; return;
  }
  if(!dropout(p) && Math.random() < p.uniP){ const f = pickField(y)[0]; p.work = {s:'uni', field:f, until: day + rnd(3,7)*365}; log('work','uni',[p.id,f],day); return; }
  if(p.firstJobAge <= 18){ const j = pickJob(y, p); p.work = {s:'job', job:j}; log('work','first_job',[p.id,j],day); return; }
  p.work = {s:'odd', until: day + (p.firstJobAge-18)*365 + rnd(0,300)};
}
function workTick(p, day){
  const w = p.work; if(!w || !w.until || day < w.until) return;
  const y = yearOf(day);
  if(w.s==='uni'){
    const f = FIELD[w.field], j = (f && JOB[f[4]] && inRange(JOB[f[4]], dataYear(y))) ? f[4] : pickJob(y, p);
    p.work = {s:'job', job:j}; log('work','graduate',[p.id,w.field,j],day);
  } else if(w.s==='odd'){ const j = pickJob(y, p); p.work = {s:'job', job:j}; log('work','first_job',[p.id,j],day); }
  else if(w.s==='unemp'){ const j = pickJob(y, p); p.work = {s:'job', job:j}; log('work','back_to_work',[p.id,j],day); }
}
function workYear(p, A, day){
  nobleYear(p, A, day);
  if(royalOn() && A >= 16 && heirId() === p.id && (!p.princeAct || Math.random() < .4)){       // le prince héritier change d'occupation
    const a = actPick(PRINCE_ACTS, day, p.princeAct); p.princeAct = a; log('star','royal_act',[p.id, a], day, false);
  }
  const w = p.work; if(w && w.s === 'royal'){ royalYear(p, A, day); return; }
  if(w && w.s === 'noble'){                            // métier de duc ou de comte
    if(A >= p.retireAge) p.work = {s:'retired'};
    else if(Math.random() < .1){ w.act = actPick(nobleJobs(p), day, w.act); dirty = true; }
    return;
  }
  if(!w || w.s==='star' || w.s==='retired' || w.s==='prison') return;
  if(A >= p.retireAge){ const was = w.s; p.work = {s:'retired'}; if(was==='job' || was==='unemp') log('work','retired',[p.id],day); return; }
  if(w.s==='job' && w.job !== 'president'){
    const r = Math.random();
    if(r < .04){ const j = pickJob(yearOf(day), p); if(j !== w.job){ p.work = {s:'job', job:j}; log('work','job_change',[p.id,j],day); } }   // 0.1.2a : changements de métier 20 % plus rares
    else if(r < .08 && !p.star){ p.work = {s:'unemp', until: day + rnd(60,730)}; log('work','unemployed',[p.id],day); }   // 2 ans de chômage maximum
  }
}
function schoolLabel(p, A, y){
  if(A < 3) return t('baby');
  p.school = p.school || {};
  if(A >= 11 && y >= 1881 && dropout(p)) return t('dropout', p);
  if(y >= 1960){
    if(A < 6) return t('mat')[A-3];
    if(A < 11) return t('prim')[A-6];
    if(A < 15) return t('col')[A-11];
    if(!p.school.track){ const ok = TRACKS.filter(r => dataYear(y) >= r[3] && dataYear(y) <= r[4] && r[0] !== 'capflemme'); p.school.track = Math.random() < .04 ? 'capflemme' : pick(ok)[0]; }   // 4 % : CAP Flemme
    const r = TRACK[p.school.track], i = Math.min(2, A-15);
    if(r[0] === 'capflemme') return `${trackName(r[0])} · ${t('capfl')[i]}`;
    return r[5]==='bac' ? `${t('lyc')[i]} · ${trackName(r[0])}` : `${trackName(r[0])} · ${t('capy')[i]}`;
  }
  if(y >= 1881){
    if(A < 6) return t('mat')[A-3];
    if(A < 11) return t('prim')[A-6];
    if(A === 11) return t('cours_sup');
    if(A === 12) return t('certif');
    if(!p.school.k) p.school.k = Math.random() < .2 ? 'lycee' : 'appr';
    if(p.school.k === 'lycee') return `${t('lycee')} · ${t('old_lyc')[Math.min(4, A-13)]}`;
    if(!p.school.job) p.school.job = pickJob(y, null, true);
    return t('apprentice', p, jobName(p.school.job, p));
  }
  if(A < 7) return t('child');
  if(A < 12){ if(!p.school.k0) p.school.k0 = Math.random() < .4 ? 'ecole' : 'betes'; return t(p.school.k0==='ecole' ? 'petite_ecole' : 'betes'); }
  if(!p.school.job) p.school.job = pickJob(y, null, true);
  return t('apprentice', p, jobName(p.school.job, p));
}
function activity(p, skipIll){
  if(p.zombie) return t('zombie_act', p);
  const d = p.death!=null ? p.death : S.t, A = ageAt(p, d), y = yearOf(d);
  if(p.death==null && p.ill && !skipIll) return dzName(p.ill.dz, p);
  if(p.star && p.star.famous) return jobName(p.star.job, p);
  const w = p.work;
  if(royalOn() && A >= 16 && p.death == null && heirId() === p.id && !(w && (w.s === 'royal' || w.s === 'prison'))) return royalActName(p.princeAct || 'p_attente');   // prince héritier
  if(!w) return A < 18 ? schoolLabel(p, A, y) : t('odd');
  if(w.s === 'prison') return t('prison');
  if(w.s === 'royal') return A < 16 ? t('regency') : royalActName(w.act);
  if(w.s === 'noble') return royalActName(w.act);
  switch(w.s){
    case 'job': return jobName(w.job, p);
    case 'odd': return p.school && p.school.drop ? t('dropout', p) : t('odd');
    case 'uni': return t('student', p, fieldName(w.field));
    case 'unemp': return t('unemployed', p);
    case 'retired': return t('retired', p);
    case 'star': return jobName(w.job, p);
  }
  return '';
}

/* ================= Mécanique ================= */
function scheduleYear(p, A, day){
  if(A >= (R.oldAge ? 121 : 150)){ die(p, day, {old:true}); return; }      // sans mort de vieillesse : maximum 150 ans
  mildYear(p, A, day);
  if(p.ill || p.onset!=null || p.deathAt!=null) return;
  const war = warAt(day), r = baseRisk(p, A, day) * (war ? 1.35 : 1);           // guerre : +35 % de mortalité
  if(Math.random() < r){
    const when = day + rnd(1,360);
    if(war && Math.random() < .65){ p.deathAt = Math.min(when, war.b); p.warDeath = true; return; }   // surtout des morts de guerre
    if(A > 80 && R.oldAge){ p.deathAt = when; return; }                   // au-delà de 80 ans : vieillesse
    if(R.diseases && !immune(p, day)){ p.onset = when; return; }                             // sinon : maladie ou accident
  }
  if(A >= R.legal && !immune(p, day)) for(const id of addictsOf(p)){                          // addictions : risque annuel en plus
    if(Math.random() < addRisk(id, A)){ p.onset = day + rnd(1,360); p.onsetAddict = id; return; }
  }
}
function baseRisk(p, A, day = S.t){
  if(A > 80 && R.oldAge){                    // vieillesse : ×2 avant 1900, ×½ après 2000 ; atout Espérance de vie : ÷10 de 80 à 105 ans
    const y = yearOf(day), era = y < 1900 ? 2 : y < 2000 ? 1 : .5;
    return Math.min(1, yearlyRisk(A, p) * era / (hasAtout(p,'longevite') && A < 105 ? 10 : 1));   // après 105 ans : risque normal
  }
  if(!R.diseases) return 0;
  return yearlyRisk(A > 80 ? 78 : A, p) * R.illness/100 * 1.15 * (sporty(p) ? .5 : 1) * (mildOn(p, day).length ? 2 : 1);   // maladie bénigne : ×2   // ×1,15 depuis la 0.1.1a   // curseur « maladies » ; sportifs : risque ÷ 2
}
const riskOf = p => { const A = age(p); return Math.min(1, baseRisk(p, A) + (A >= R.legal ? addictsOf(p).reduce((s,id) => s + addRisk(id, A), 0) : 0)); };
function contract(p, day){
  p.onset = null;
  if(immune(p, day)){ p.onsetAddict = false; return; }
  const aid = p.onsetAddict === true ? addictsOf(p)[0] : p.onsetAddict;
  const own = aid ? DISEASES.filter(x => x[9] && x[9].addict === aid) : [];
  const d = own.length ? pick(own) : pickDisease(p, day);
  p.onsetAddict = false;
  if(hasAtout(p,'sante') && ageAt(p, day) < 60 && !EVENTS.has(d[0])) return;     // atout Santé : jamais malade avant 60 ans
  p.ill = {dz:d[0], start:day, end: day + rnd(d[6], d[7]), cure: Math.random() < d[8]};
  log('ill','ill',[p.id, d[0]], day); sfx.ill();
}
function die(p, day, cause){
  if(p.death != null) return;
  const wasHeir = royalOn() && p.id === heirId();
  const A = ageAt(p, day);
  p.death = day; p.deathAt = null; p.onset = null; p.warDeath = false; p.murderAt = null; p.deathCity = p.city;
  RH = undefined; if(royalOn() && p.id === S.royal.king){ p.reignEnd = day; log('star','reign_end',[p.id], day, false); crownNext(day); }
  p.cause = Object.assign({}, cause);
  if(inFamily(p)){ if(A >= 121) unlock('maxage'); if(A < 10) unlock('young'); }
  if(cause.murder){
    if(wasHeir) unlock('r_heirkill');                   // succès : un héritier assassiné
    const k = P(cause.murder); k.kills = (k.kills || 0) + 1; cyn(50 * (hasAtout(k,'richesse') ? 2 : 1), p.id);
    S.nKills = (S.nKills || 0) + 1;                     // Versus : nombre de meurtres
    if(!VSH){ UNL.kills = (UNL.kills || 0) + 1; store.set(UNL_KEY, JSON.stringify(UNL)); if(UNL.kills >= 10) unlockSkin('goth'); pendingFx.push(p.id); }   // thème Dark : 10 meurtres
    [[4,'kill2'],[8,'kill4'],[12,'kill6'],[16,'kill8']].forEach(([n, id]) => { if(k.kills >= n) unlock(id); }); dirty = true;
    if(k.kills === 1 && k.crim && !k.crim.fate && k.crim.jailAt == null && Math.random() < .4) k.crim.jailAt = day + rnd(30, 3600);   // premier crime : 40 % de prison dans les 10 ans
    if(!UNL.night && !VSH){ UNL.night = true; store.set(UNL_KEY, JSON.stringify(UNL)); setTimeout(() => { toast({d: today(), kind:'crime', k:'night', a:[]}); sfx.crime(); }, 1200); }   // thème Nuit débloqué
  }
  p.ill = null;
  for(const u of S.unions){
    if(u.a!==p.id && u.b!==p.id) continue;
    if(u.end == null && u.b === p.id) P(u.a).plan = {will: Math.random() < PAIR_P, at: day + rnd(1,8)*365};   // veuvage : peut retrouver quelqu'un
    if(u.preg){
      const pa = P(u.a), pb = P(u.b);
      if(!u.preg.adopt){
        const mother = [pa,pb].find(x => x.sex==='F');
        if(mother && mother.id===p.id){ u.preg = null; log('sad','lost_baby',[p.id], day); }
      } else if(pa.death!=null && pb.death!=null){ u.preg = null; }
    }
    if(u.end == null){ u.end = day; u.endReason = 'décès'; }
  }
  if(cause.old) log('death','death_old',[p.id, A], day);
  else if(cause.war) log('death','death_war',[p.id, cause.war, A], day);
  else if(cause.murder) log('death','death_murder',[p.id, cause.murder, A], day);
  else if(cause.vanished) log('crime','vanished',[p.id], day);
  else if(cause.suicide) log('death','death_suicide',[p.id, A], day);
  else if(cause.legend) log('death','death_legend',[p.id], day);
  else log('death','death_dz',[p.id, cause.dz, A], day);
  sfx.death();
}

/* ================= Mode auto ================= */
const PAIR_P = .72, LEAVE_P = .08, KIDS_P = [.80,.62,.30,.16,.05,.03,.01];   // 80 % ≥ 1 enfant, 62 % ≥ 2, …, 1 % = 7
function newUnionPlan(day){
  const r = Math.random(); let target = 0;
  for(const th of KIDS_P) if(r < th) target++;
  const ag = aiSmart() ? S.aiGoal : null;                        // Versus : l'IA adapte ses familles à l'objectif
  if(ag === 'speed') target = Math.max(target, 2);
  if(ag === 'slow') target = Math.min(Math.max(target, 1), 2);
  return {target, next: day + (ag === 'speed' ? rnd(30, 200) : ag === 'slow' ? rnd(500, 3*365) : rnd(120, 3*365)),
    leaveAt: Math.random() < LEAVE_P ? day + rnd(1,25)*365 + rnd(0,364) : null,
    marryAt: Math.random() < .6 ? day + rnd(1,6)*365 + rnd(0,364) : null};
}
function startPregnancy(u, day, toastIt){
  const pa = P(u.a), pb = P(u.b), hetero = pa.sex !== pb.sex;
  const x = toDate(day), due = fromYMD(x.getUTCFullYear(), x.getUTCMonth()+9, x.getUTCDate());
  const mother = hetero ? [pa,pb].find(q => q.sex==='F') : null;
  const miss = hetero && Math.random() < .05 ? day + rnd(30, Math.max(31, due-day-20)) : null;   // 5 % de fausse couche
  u.preg = {start:day, due, miss, adopt:!hetero};
  if(hetero) log('love','preg',[mother.id, due], day, toastIt); else log('love','adopt_start',[pa.id, pb.id, due], day, toastIt);
  return u.preg;
}
function endUnion(u, day, toastIt){
  u.end = day; u.endReason = u.married ? 'divorce' : 'rupture';
  log('break', u.married ? 'divorce' : 'leave', [u.a, u.b], day, toastIt);
  P(u.a).plan = {will: Math.random() < PAIR_P, at: day + rnd(1,8)*365};      // peut retrouver quelqu'un après une rupture
}
function autoPair(p, day){
  const sex = (!R.sameSex || Math.random() < .96) ? (p.sex==='M' ? 'F' : 'M') : p.sex;
  const c = genCandidate(p, sex, day);
  const q = addPerson(Object.assign({}, c, {blood:false, city:p.city}));
  q.lastAge = ageAt(q, day); scheduleYear(q, q.lastAge, day);
  S.unions.push({id:S.nextId++, a:p.id, b:q.id, start:day, married:false, marriedAt:null, end:null, endReason:null, preg:null, plan:newUnionPlan(day)});
  log('love','couple',[p.id, q.id], day, p.id===S.activeId);
  checkConq(p.id);
}
function autoDay(day){
  const crowd = living().length;                                  // plus de 20 vivants : les probabilités chutent
  const skip = S.auto ? null : S.activeId;                        // « famille autonome » : tout le monde sauf vous
  // 0.1.4k : le personnage joué en mode auto, le monarque et l'héritier cherchent toujours l'âme sœur et veulent au moins 2 enfants
  const aiN = S.headless ? VS_DIFF[S.aiDiff].keep : 0, aiLow = aiN > 0 && living().filter(p => p.blood && !p.zombie).length < aiN;   // Versus : l'IA protège sa lignée tant qu'elle est petite
  const must = p => (S.auto && p.id === S.activeId) || (royalOn() && (p.id === S.royal.king || p.id === heirId())) || (aiLow && p.blood);
  for(const p of living()){
    if(!p.blood || p.zombie || p.id === skip || ageAt(p, day) < R.legal || currentUnion(p.id) || (p.work && p.work.s === 'prison')) continue;
    if(!p.plan) p.plan = {will: Math.random() < PAIR_P, at: Math.max(day, p.birth + Math.round(rnd(...(aiPairAge() || [18,35]))*365.25) + rnd(0,364))};
    const mp = must(p);
    const ap = mp && aiPairAge();
    if(ap){ p.plan.will = true; if(!p.plan.ai){ p.plan.ai = 1; p.plan.at = Math.max(day, p.birth + Math.round(rnd(ap[0], ap[1])*365.25)); } }
    else if(mp){ p.plan.will = true; p.plan.at = Math.min(p.plan.at, Math.max(day, p.birth + Math.round(rnd(20,28)*365.25))); }
    if(!p.plan.will || day < p.plan.at) continue;
    if(ageAt(p, day) > 75){ p.plan.will = false; continue; }
    if(!mp && (crowd > 35 || (crowd > 20 && Math.random() > .2))){ p.plan.at = day + rnd(1,3)*365; continue; }
    autoPair(p, day);
  }
  for(const u of S.unions){
    if(u.end != null || u.a === skip) continue;
    const a = P(u.a), b = P(u.b), mine = u.a === S.activeId;
    if(a.zombie || b.zombie) continue;
    if(!u.plan) u.plan = newUnionPlan(day);
    const pl = u.plan, mu = must(a);
    if(mu && pl.target < 2) pl.target = 2;
    if(pl.marryAt != null && !u.married && day >= pl.marryAt){
      pl.marryAt = null;
      if(hasAtout(a,'charisme') || Math.random() < .95){ u.married = true; u.marriedAt = day; takeHusbandName(u); log('wed','wed',[a.id, b.id], day, mine); if(mine) sfx.wedding(); }
      else { u.noMarry = true; log('sad','refuse',[b.id, a.id], day, mine); }
    }
    if(pl.leaveAt != null && day >= pl.leaveAt){ endUnion(u, day, mine); continue; }
    if(u.preg || day < pl.next) continue;
    if(kidsOf(u).length >= pl.target){ pl.next = 9e9; continue; }
    const hetero = a.sex !== b.sex, mother = hetero ? (a.sex==='F' ? a : b) : null;
    if((mother && !fertile(mother, day)) || (!hetero && Math.max(ageAt(a,day), ageAt(b,day)) > 55)){ pl.next = 9e9; continue; }
    if(!mu && (crowd > 35 || (crowd > 20 && Math.random() > .15))){ pl.next = day + 365; continue; }
    const pr = startPregnancy(u, day, mine);
    pl.next = pr.due + rnd(270, 3*365);
  }
}
function heirList(d){
  const k = royalOn() ? S.royal.king : null;            // mode Royal : le nouveau monarque est proposé en premier
  return living().filter(p => p.blood).map(p => ({p, r: relation(p,d)})).sort((a,b) => (b.p.id === k) - (a.p.id === k) || a.r[0]-b.r[0] || a.p.birth-b.p.birth);
}
function autoHeir(){
  const d = active(), h = heirList(d);
  if(!h.length){ render(); gameOver(d); return; }
  S.activeId = h[0].p.id; log('info','heir',[h[0].p.id, d.id]); followActive = true; lastFocusKey = '';
  render(); centerOn(S.activeId, true); save();
}
const isSib = (x, c) => x.id !== c.id && x.parents && c.parents && x.parents.some(i => c.parents.includes(i));
const sibBases = c => new Set(Object.values(S.people).filter(x => isSib(x, c) && x.first).map(x => (x.base || x.first).toLowerCase()));
function nameFor(c){
  if((SET.regnal || royalOn()) && Math.random() < (royalOn() ? .7 : .15)){                 // dynasties : parfois, on reprend le prénom d'un parent ou grand-parent
    const sb = sibBases(c), fam = familyNames(c).filter(n => !sb.has(n.toLowerCase())); if(fam.length) return pick(fam);
  }
  const sibs = new Set(Object.values(S.people).filter(x => isSib(x, c) && x.first).map(x => x.base || x.first).concat(c.parents.map(i => P(i).first)));
  return wpick(namePool(yearOf(c.birth), c.sex), sibs);
}
/* ================= Numéros de dynastie : Jean, Jean II, Jean III… ================= */
function roman(n){
  let s = '';
  for(const [v, r] of [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]) while(n >= v){ s += r; n -= v; }
  return s;
}
const baseFirst = p => p.base || p.first;
function ancestorsOf(c){                                // tous les ascendants en ligne directe (parents, grands-parents…)
  const out = [], seen = new Set(), stack = [...(c.parents || [])];
  while(stack.length){
    const id = stack.pop(); if(seen.has(id)) continue; seen.add(id);
    const a = P(id); if(!a) continue;
    out.push(a); (a.parents || []).forEach(i => stack.push(i));
  }
  return out;
}
function regnalNum(c, base){                            // numéro que prendrait l'enfant s'il s'appelait « base »
  let best = 0;
  for(const a of ancestorsOf(c)) if(baseFirst(a) === base && a.last === c.last) best = Math.max(best, a.num || 1);
  return best ? best + 1 : 0;
}
function regnalize(c){
  if(!(SET.regnal || royalOn()) || !c.first) return;
  const n = regnalNum(c, c.first);
  if(n){ c.base = c.first; c.num = n; c.first = c.first + ' ' + roman(n); }
}
function familyNames(c){                                // prénoms des ascendants du même sexe qui portent le même nom de famille
  return [...new Set(ancestorsOf(c).filter(a => a.sex === c.sex && a.last === c.last && a.first).map(baseFirst))];

function crackSvg(n, w, h, seed){                   // fissures dessinées au hasard (mais toujours les mêmes)

  let out = '';

    const side = i % 4; let x = side === 0 ? rand()*w : side === 1 ? w : side === 2 ? rand()*w : 0, y = side === 0 ? 0 : side === 1 ? rand()*h : side === 2 ? h : rand()*h;
    let d = `M${x.toFixed(0)} ${y.toFixed(0)}`; const ang0 = Math.atan2(h/2 - y, w/2 - x);
    const segs = 7 + Math.floor(rand()*6), len = Math.min(w, h) * (.05 + rand()*.05);
    for(let k=0;k<segs;k++){ const a = ang0 + (rand() - .5) * 1.4; x += Math.cos(a)*len; y += Math.sin(a)*len; d += ` L${x.toFixed(0)} ${y.toFixed(0)}`;
      if(rand() < .3){ const b = a + (rand() < .5 ? 1 : -1) * (.6 + rand()*.6); d += ` M${x.toFixed(0)} ${y.toFixed(0)} l${(Math.cos(b)*len*.8).toFixed(0)} ${(Math.sin(b)*len*.8).toFixed(0)} M${x.toFixed(0)} ${y.toFixed(0)}`; } }
    out += `<g class="ck" data-i="${i}"><path class="ck-l" d="${d}"/><path class="ck-d" d="${d}"/></g>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${out}</svg>`;
}

function buildTree(){
  const memo = {}, pos = {}, unionsD = [], links = [];
  const fd = getComputedStyle(document.documentElement).getPropertyValue('--font-display') || 'sans-serif';
  nodeWidths = {};
  const NWo = id => nodeWidths[id] ?? (nodeWidths[id] = nodeWidthOf(P(id), fd));
  const KC = new Map(), UA = new Map();               // 0.1.4a : index calculés une fois (avant : recherche dans toute la famille à chaque bulle)
  for(const c of Object.values(S.people)) if(c.parents){ const k = c.parents[0] + '-' + c.parents[1]; if(!KC.has(k)) KC.set(k, []); KC.get(k).push(c); }
  KC.forEach(a => a.sort((x, y) => x.birth - y.birth));
  for(const u of S.unions){ if(!UA.has(u.a)) UA.set(u.a, []); UA.get(u.a).push(u); }
  const kidsL = u => KC.get(u.a + '-' + u.b) || [];
  const unionsL = pid => (UA.get(pid) || []).filter(u => u.end == null || u.married || kidsL(u).length);
  let maxDepth = 0;
  function measure(pid){
    const us = unionsL(pid), selfW = NWo(pid) + us.reduce((a, u) => a + NWo(u.b) + PG, 0), kids = us.flatMap(kidsL);
    const kidsW = kids.length ? kids.reduce((s,k) => s + measure(k.id), 0) + (kids.length-1)*GX : 0;
    return memo[pid] = Math.max(selfW, kidsW);
  }
  function place(pid, x, depth){
    maxDepth = Math.max(maxDepth, depth);
    const us = unionsL(pid), w = memo[pid];
    const selfW = NWo(pid) + us.reduce((a, u) => a + NWo(u.b) + PG, 0), y = PAD + depth*(NH+GY), sx = PAD + x + (w-selfW)/2;
    pos[pid] = {x:sx, y};
    let ux = sx + NWo(pid) + PG;
    us.forEach(u => { pos[u.b] = {x: ux, y}; ux += NWo(u.b) + PG; });
    const groups = us.map(kidsL), kids = groups.flat();
    const kidsW = kids.length ? kids.reduce((s,k) => s + memo[k.id], 0) + (kids.length-1)*GX : 0;
    let kx = x + (w-kidsW)/2;
    us.forEach((u,i) => {
      const x1 = sx + NWo(pid)/2, x2 = pos[u.b].x + NWo(u.b)/2, by = y + NH + 12 + i*9;
      const st = u.end==null ? (u.married ? 'married' : 'dating') : 'ended';

      groups[i].forEach(k => {
        place(k.id, kx, depth+1);

        kx += memo[k.id] + GX;

    });
  }
  measure(S.founderId); place(S.founderId, 0, 0);
  const W = memo[S.founderId] + PAD*2, H = PAD*2 + (maxDepth+1)*NH + maxDepth*GY;
  let svg = '';
  for(const l of links){ const d = `M${l.mx} ${l.y1}V${l.bus}H${l.kx}V${l.ky}`; svg += `<path class="ln-wire-under" d="${d}"/><path class="ln-wire" d="${d}"/>`; }
  for(const u of unionsD){
    svg += `<path class="ln-u ${u.st}" d="M${u.x1} ${u.y0}V${u.by}H${u.x2}V${u.y0}"/>`;
    if(u.st==='married') svg += `<g transform="translate(${u.mx} ${u.by})"><circle cx="-4" r="5.5" fill="none" stroke="#ffb300" stroke-width="2.6"/><circle cx="4" r="5.5" fill="none" stroke="#ff8a00" stroke-width="2.6"/></g>`;
    else if(u.st==='dating') svg += `<path transform="translate(${u.mx-7} ${u.by-7}) scale(.6)" d="M12 21s-7-4.4-9.3-8.6C1 9.3 2.7 5.5 6.3 5.5c2.1 0 3.4 1.2 4.2 2.4h3c.8-1.2 2.1-2.4 4.2-2.4 3.6 0 5.3 3.8 3.6 6.9C19 16.6 12 21 12 21z" fill="#ff2f9c" stroke="#fff" stroke-width="2"/>`;
  }
  let nodes = '';
  for(const id in pos) nodes += nodeHTML(P(id), pos[id].x, pos[id].y);

  svg.querySelectorAll('#mapTowns circle').forEach(c => c.setAttribute('r', String(2/Math.sqrt(mz.z))));
}
function mapBox(svg){                                // zone réellement occupée par le dessin (la carte garde ses proportions)
  const r = svg.getBoundingClientRect(), k = Math.min(r.width/540, r.height/530), w = 540*k, h = 530*k;
  return {left: r.left + (r.width - w)/2, top: r.top + (r.height - h)/2, width: w, height: h};

function setMapZoom(z, sx, sy, fx, fy){

/* Meurtre : un couteau frappe la bulle de la victime */
const pendingFx = [];
const pendingAst = [];
function asteroidFx(){                                 // un astéroïde enflammé tombe sur la bulle, puis explose
  while(pendingAst.length){
    const id = pendingAst.shift(); sfx.war();
    const node = document.querySelector(`.node[data-id="${id}"]`);
    if(!node || curView !== 'tree' || reduced || !SET.deco){ burst(['#ff7a00','#ffd000','#5a3a2a','#ffffff'], 40); continue; }
    const r = node.getBoundingClientRect(), tx = r.left + r.width/2, ty = r.top + r.height/2;
    const sx = Math.min(innerWidth + 40, tx + 320), sy = Math.max(-60, ty - 460), ang = Math.atan2(sy - ty, sx - tx) * 180 / Math.PI;
    const a = document.createElement('div'); a.className = 'astfx'; a.style.setProperty('--a', ang + 'deg');
    a.innerHTML = '<i class="trail"></i><i class="rock"></i>'; document.body.appendChild(a);
    a.animate([{transform:`translate(${sx}px,${sy}px) scale(.55)`},{transform:`translate(${tx}px,${ty}px) scale(1.1)`}], {duration:950, easing:'cubic-bezier(.55,0,1,.6)'}).onfinish = () => {
      a.remove(); node.classList.remove('stabbed'); void node.offsetWidth; node.classList.add('stabbed');
      const ring = document.createElement('div'); ring.className = 'astboom'; ring.style.left = tx + 'px'; ring.style.top = ty + 'px'; document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 800);
      for(let i=0;i<22;i++){
        const sp = document.createElement('i'), c = pick(['#ff7a00','#ffd000','#ff3b1f','#5a3a2a','#ffffff']), sz = rnd(6,16);
        sp.className = 'spark'; sp.style.cssText = `left:${tx}px;top:${ty}px;width:${sz}px;height:${sz}px;background:radial-gradient(circle at 35% 30%,#fff 0 18%,${c} 60%);box-shadow:0 0 8px ${c}`;
        document.body.appendChild(sp);

        sp.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(an)*d}px),calc(-50% + ${Math.sin(an)*d}px)) scale(.3)`,opacity:0}], {duration:rnd(500,900),easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => sp.remove();
      }

  }
}
function runFx(){
  asteroidFx();
  while(pendingFx.length){
    const id = pendingFx.shift();
    sfx.stab();
    const node = document.querySelector(`.node[data-id="${id}"]`);
    if(!node || curView !== 'tree') continue;
    const r = node.getBoundingClientRect();
    if(r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) continue;
    node.classList.add('stabbed');
    if(reduced || !SET.deco) continue;
    const fx = document.createElement('div');
    fx.className = 'knifefx';
    fx.style.left = (r.left + r.width/2) + 'px'; fx.style.top = (r.top + r.height/2) + 'px';
    fx.innerHTML = `<span class="slash"></span><span class="slash s2"></span><span class="knife">${icon('knife')}</span>` +
      Array.from({length:9}, (_,i) => `<i class="drop" style="--a:${i*40 + rnd(-12,12)}deg;--r:${rnd(30,70)}px"></i>`).join('');
    document.body.appendChild(fx);
    const t0 = performance.now();
    const follow = () => {                                // le couteau suit la bulle si l'arbre bouge (défilement, zoom, nouveau rendu)
      if(!fx.isConnected) return;
      const n = document.querySelector(`.node[data-id="${id}"]`);
      if(n){ const q = n.getBoundingClientRect(); fx.style.left = (q.left + q.width/2) + 'px'; fx.style.top = (q.top + q.height/2) + 'px'; }
      if(performance.now() - t0 < 1500) requestAnimationFrame(follow);
    };
    requestAnimationFrame(follow);
    setTimeout(() => fx.remove(), 1500);
  }
}

function causeText(p){
  const c = p.cause || {};
  if(c.old) return t('cause_old');
  if(c.war) return t('cause_war', c.war, p);
  if(c.murder) return t('cause_murder', p, c.murder);
  if(c.vanished) return t('cause_vanished', p);
  if(c.suicide) return t('cause_suicide');
  if(c.legend) return t('cause_legend', p);
  return t('cause_dz', c.dz);
}
function relation(x, d){
  if(x.parents && x.parents.includes(d.id)) return [0, t('rel_child', x)];
  const par = x.parents ? x.parents.map(P) : [];
  if(par.some(pp => pp.parents && pp.parents.includes(d.id))) return [1, t('rel_grand', x)];
  if(par.some(pp => pp.parents && pp.parents.some(gi => { const q = P(gi); return q.parents && q.parents.includes(d.id); }))) return [2, t('rel_ggrand', x)];
  if(d.parents && x.parents && x.parents.some(i => d.parents.includes(i))) return [3, t('rel_sib', x)];
  if(d.parents && d.parents.includes(x.id)) return [4, t('rel_parent', x)];
  return [5, t('rel_family')];
}

function burst(colors, n=26){
  if(reduced || !SET.deco || VSH) return;
  for(let i=0;i<n;i++){
    const s = document.createElement('i'), size = rnd(8,22), c = pick(colors);
    s.className = 'spark';
    s.style.cssText = `left:50%;top:38%;width:${size}px;height:${size}px;background:radial-gradient(circle at 35% 30%,#fff 0 18%,${c} 60%);box-shadow:0 0 8px ${c}`;
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2, dist = rnd(120,340);
    s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist - 60}px)) scale(1)`,opacity:0}],
      {duration:rnd(800,1500),easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => s.remove();
  }
}
function toast(e){

  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 4500);
}

/* ================= Album : tout ce qui a déjà été vu dans une partie (gardé d'une partie à l'autre) ================= */
const ALB_KEY = 'lignee.album.v1';
const ALB = loadJSON(ALB_KEY); ['i','c','j','e','m','d','a','r'].forEach(k => { ALB[k] = ALB[k] || {}; });
const deathKey = p => { const c = p.cause || {}; return c.old ? 'old' : c.war ? 'w_' + c.war : c.murder ? 'murder' : c.vanished ? 'vanished' : c.suicide ? 'suicide' : c.legend ? 'legend' : c.dz || null; };
function albumScan(force){
  if(!S) return;
  let ch = false;
  const mark = (k, id) => { if(id != null && !ALB[k][id]){ ALB.n = (ALB.n || 1) + 1; ALB[k][id] = ALB.n; ch = true; } };   // numéro d'ordre de découverte
  for(const p of Object.values(S.people)){
    interestsOf(p).forEach(id => mark('i', id));
    (p.mild || []).forEach(m => mark('m', m.dz));
    if(p.work && p.work.s === 'royal' && p.death == null && ageAt(p, S.t) >= 16) mark('r', p.work.act);
    else if(p.princeAct && p.death == null && royalOn() && heirId() === p.id && ageAt(p, S.t) >= 16) mark('r', p.princeAct);
    else if(p.work && p.work.s === 'noble' && p.death == null) mark('r', p.work.act);
    (p.conds || []).forEach(id => mark('c', id));
    if(p.work && (p.work.s === 'job' || p.work.s === 'star')) mark('j', p.work.job);
    addictsOf(p).forEach(id => mark('a', id));
    if(p.death != null) mark('d', deathKey(p)); else schoolKeys(p).forEach(id => mark('e', id));
  }
  if(ch) store.set(ALB_KEY, JSON.stringify(ALB));
  if(ch || force) albumCheck();
}
function albumCheck(){                              // succès Album : une catégorie entière découverte ; Album complet : toutes
  let all = true;
  for(const [k] of ALB_CATS){ const done = albItems(k).every(x => ALB[k][x.id]); if(done) unlock('alb_' + k); else all = false; }
  if(all) unlock('leg_album');
}
const albYears = (a, b) => b >= 2100 ? (a <= 1500 ? t('alb_always') : t('alb_from', a)) : a <= 1500 ? t('alb_until', b) : t('alb_range', a, b);
const ALB_CATS = [['i','alb_int'],['c','alb_cond'],['j','alb_job'],['e','alb_school'],['m','alb_mild'],['d','alb_death'],['a','alb_addict'],['r','alb_royal']];
function schoolKeys(p){                               // où en est la scolarité de quelqu'un (pour l'album)
  const A = ageAt(p, S.t), y = yearOf(S.t), sc = p.school || {}, w = p.work;
  if(w && w.s === 'uni') return ['f_' + w.field];
  if(w && w.s === 'odd' && sc.drop) return ['dropout'];
  if(w || A < 3 || A >= 18) return [];
  if(A >= 11 && y >= 1881 && sc.drop) return ['dropout'];
  if(y >= 1960){ if(A < 6) return ['mat' + (A-3)]; if(A < 11) return ['prim' + (A-6)]; if(A < 15) return ['col' + (A-11)]; return sc.track ? ['tr_' + sc.track] : []; }
  if(y >= 1881){ if(A < 6) return ['mat' + (A-3)]; if(A < 11) return ['prim' + (A-6)]; if(A === 11) return ['cours_sup']; if(A === 12) return ['certif'];
    return sc.k === 'lycee' ? ['lyc_old'] : sc.k === 'appr' ? ['appr'] : []; }
  if(A < 7) return [];
  if(A < 12) return sc.k0 ? [sc.k0 === 'ecole' ? 'petite_ecole' : 'betes'] : [];
  return ['appr'];

function schoolItems(){

function endTuto(){
  const box = $('#tuto'); if(box) box.remove();
  tutoI = -1; store.set(TUTO_KEY, 'done');
  const ctr = $('.topbar .ctrls'); if(ctr) ctr.scrollLeft = 0;          // la barre du haut revient au début
  if(S){ S.paused = tutoWasPaused; renderControls(); }
}
addEventListener('resize', () => { if(tutoI >= 0) tutoPlace(); });
document.addEventListener('keydown', e => {
  if(tutoI < 0) return;
  if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); endTuto(); }
  else if(e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); ACT.tnext(); }
  else if(e.key === 'ArrowLeft' && tutoI > 0){ e.preventDefault(); tutoShow(tutoI - 1); }
}, true);
function newGame(){ document.body.classList.remove('zmode', 'vsmode'); S = null; store.del(SAVE_KEY); cands = []; showSetup(); window.scrollTo(0,0); }

/* ================= Démarrage ================= */
(() => {
  const box = $('#bubbles');
  if(!reduced) for(let i=0;i<14;i++){
    const b = document.createElement('span'), s = rnd(14,70);
    b.className = 'bubble';
    b.style.cssText = `left:${rnd(0,96)}%;width:${s}px;height:${s}px;animation-duration:${rnd(16,34)}s;animation-delay:-${rnd(0,30)}s`;
    box.appendChild(b);
  }
  const gfx = $('#goldfx');                         // paillettes du thème Or
  for(let i=0;i<34;i++){
    const s = document.createElement('i');
    s.className = 'gp';
    s.style.cssText = `left:${rnd(0,98)}%;top:${rnd(0,92)}%;--s:${rnd(6,16)}px;--d:${rnd(5,11)}s;--dl:-${rnd(0,30)/10}s`;
    gfx.appendChild(s);
  }
  const nfx = $('#nightfx');                        // étoiles du thème Nuit
  for(let i=0;i<70;i++){
    const s = document.createElement('i');
    s.style.cssText = `left:${rnd(0,99)}%;top:${rnd(0,62)}%;--s:${rnd(1,3)}px;--d:${rnd(2,6)}s;--dl:-${rnd(0,50)/10}s`;
    nfx.appendChild(s);
  }
  const kfx = $('#kidfx'), KC = ['#ff4f6d','#ff9a2e','#ffd21f','#3fd46b','#3fa9ff','#8f6bff','#ff6fae'];   // nuages, étoiles et cœurs du thème Enfantin
  for(let i=0;i<4;i++){ const c = document.createElement('i'); c.className = 'cloud';
    c.style.cssText = `--y:${rnd(4,40)}%;--w:${rnd(110,200)}px;--d:${rnd(70,130)}s;--dl:-${rnd(0,120)}s`; kfx.appendChild(c); }
  for(let i=0;i<26;i++){ const b = document.createElement('b'); if(i % 3 === 0) b.className = 'h';
    b.style.cssText = `left:${rnd(0,97)}%;top:${rnd(0,70)}%;--s:${rnd(12,24)}px;--c:${pick(KC)};--d:${rnd(30,60)/10}s;--dl:-${rnd(0,40)/10}s`; kfx.appendChild(b); }
  const gfx2 = $('#gothfx');                         // chauves-souris du thème Dark
  for(let i=0;i<6;i++){ const b = document.createElement('i'); b.className = 'bat';
    b.style.cssText = `--y:${rnd(6,48)}%;--w:${rnd(26,54)}px;--d:${rnd(18,34)}s;--dl:-${rnd(0,34)}s`;
    b.innerHTML = '<svg viewBox="0 0 64 30"><path d="M32 9c1.6-3 3.4-5 3.4-5s.9 2.6.2 5.2C41 6 49 3.6 60 6c-4.6 2-7 6-7 11-3.4-3.4-8-3.6-11.4-.4-.4-2.6-2-4-4.2-4.2C35 12.6 33.4 14 32 16c-1.4-2-3-3.4-5.4-3.6-2.2.2-3.8 1.6-4.2 4.2-3.4-3.2-8-3-11.4.4 0-5-2.4-9-7-11C15 3.6 23 6 28.4 9.2c-.7-2.6.2-5.2.2-5.2S30.4 6 32 9z"/></svg>';
    gfx2.appendChild(b); }
  $$('.brand-slot').forEach((el,i) => { el.innerHTML = emblem('emb' + i); });
  $$('#mnav [data-icon]').forEach(b => b.insertAdjacentHTML('afterbegin', icon(b.dataset.icon)));   // icônes de la barre du bas
  try{ if(sessionStorage.getItem('lignee.wiped')){                     // après une remise à zéro : on revient du noir
    sessionStorage.removeItem('lignee.wiped');
    const fade = document.createElement('div'); fade.className = 'wipefade on'; document.body.appendChild(fade);
    requestAnimationFrame(() => requestAnimationFrame(() => fade.classList.remove('on'))); setTimeout(() => fade.remove(), 1700);
  } }catch(e){}
  if(!store.get(TUTO_KEY) && (store.get(SAVE_KEY) || store.get(ACH_KEY) || store.get(CYN_KEY))) store.set(TUTO_KEY, 'old');
  // nouvelle version : les notes s'ouvrent une fois pour les joueurs qui avaient déjà joué
  const SEEN_KEY = 'lignee.seenVersion', seen = store.get(SEEN_KEY);
  if(seen !== APP_VERSION){
    const returning = seen || store.get(SAVE_KEY) || store.get(SET_KEY) || store.get(ACH_KEY);
    store.set(SEEN_KEY, APP_VERSION);
    if(returning) setTimeout(() => { if(!modalOpen) openPatchnotes(); }, 700);
  }
  applySettings();
  applyStatic();
  $('#fFirst').value = 'Maryline'; $('#fLast').value = 'Prunier';
  fDay.value = 7; fMonth.value = 9; fYear.value = 1759; fCity.value = 'Paris';
  refreshAge();
})();
function boot(data){
  if(data && data.save){ try{ S = JSON.parse(data.save); }catch(e){ S = null; } }
  if(S && S.v===2 && !S.over) enterGame(); else { S = null; showSetup(); }
}
const hot = window.claude && window.claude.hot;
if(hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({save: S && !$('#game').hidden ? JSON.stringify(S) : null}));
if(hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
