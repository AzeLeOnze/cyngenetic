<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cyngenetic : fondez une lignée en 1780 et suivez-la sur des siècles.">
<meta name="theme-color" content="#14a6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyngenetic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Cyngenetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=UnifrakturMaguntia&family=Fredoka:wght@500;600;700&family=Istok+Web:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout : ciel saturé + collines vertes en fond ; barre de verre en haut avec l'horloge « LCD » et la décennie ;
   arbre à gauche, panneau latéral de verre à droite (empilés sur téléphone). Un seul look lumineux, assumé. */
:root{
  --sky-top:#0062ec; --sky-mid:#14a6ff; --sky-low:#7fe3ff; --sky-haze:#e4fff4;
  --aqua:#00b4ff; --aqua-deep:#0059c9;
  --lime:#74e600; --lime-deep:#2c9200;
  --magenta:#ff2f9c; --magenta-deep:#c10067;
  --sun:#ffcc00; --sun-deep:#ff8a00; --gold-ink:#7a4600;
  --red:#ff2d3d; --red-deep:#b5001a;
  --violet:#8a5cff;
  --ink:#05305a; --ink-soft:#3d6c96; --ink-faint:#7f9fbd;
  --glass-hi:rgba(255,255,255,.86); --glass-lo:rgba(236,250,255,.56); --glass-edge:rgba(255,255,255,.96);
  --male-1:#3fd0ff; --male-2:#0070e0;
  --female-1:#ff6cc0; --female-2:#cc0070;
  --shadow:0 14px 34px rgba(0,64,160,.28);
  --g1:#9af4ff; --g2:#00b8ff; --g3:#0074dc; --gedge:#005bbd;
  --lcd-a:#3ea0ff; --lcd-b:#0058d0; --lcd-c:#00399a; --lcd-d:#0b6be8; --lcd-edge:#00307e; --lcd-glow:rgba(120,235,255,.95);
  --hill-a1:#b4ff40; --hill-a2:#5ed400; --hill-a3:#1f8a00; --hill-b1:#8af01e; --hill-b2:#1d7a00;
  --font-display:"M PLUS Rounded 1c","Segoe UI","Frutiger","Myriad Pro",system-ui,sans-serif;
  --font-body:"Istok Web","Segoe UI","Frutiger","Myriad Pro",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-body); font-size:15px; color:var(--ink);
  background:var(--sky-mid) linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 30%,var(--sky-low) 58%,var(--sky-haze) 82%) fixed;
  overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- Décor ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky-sun{position:absolute;top:-170px;right:-120px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1) 0 7%,rgba(255,252,200,.85) 13%,rgba(255,236,110,.32) 30%,rgba(255,255,255,0) 60%)}
.flare{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0) 55%,rgba(255,255,255,.35) 70%,rgba(255,255,255,0) 72%)}
.swoosh{position:absolute;left:-5%;width:110%;top:14%;height:48%}
.hills{position:absolute;left:0;bottom:0;width:100%;height:36vh;min-height:190px}
.bubble{position:absolute;bottom:-90px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.28) 20%,rgba(140,230,255,.14) 58%,rgba(255,255,255,.6) 100%);
  box-shadow:inset 0 0 12px rgba(255,255,255,.55);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(34px,-58vh)}100%{transform:translate(-12px,-118vh)}}

/* ---------- Verre & gel ---------- */
.glass{position:relative;background:linear-gradient(180deg,var(--glass-hi) 0%,rgba(255,255,255,.62) 46%,var(--glass-lo) 100%);
  border:1px solid var(--glass-edge);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 #fff,inset 0 -10px 24px rgba(0,170,255,.10);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
.gel{--c1:var(--g1);--c2:var(--g2);--c3:var(--g3);--edge:var(--gedge);--txt:#fff;--ts:rgba(0,40,110,.55);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;
  border-radius:999px;border:1px solid var(--edge);color:var(--txt);cursor:pointer;overflow:hidden;
  font:700 15px/1.1 var(--font-display);letter-spacing:.01em;text-shadow:0 1px 2px var(--ts);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 49%,var(--c3) 51%,var(--c2) 100%);
  box-shadow:0 5px 14px rgba(0,80,190,.32),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.14);
  transition:transform .12s ease,filter .15s ease;user-select:none}
.gel::before{content:"";position:absolute;left:7%;right:7%;top:2px;height:46%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.12));pointer-events:none}
.gel>*{position:relative;z-index:1}
.gel svg{width:18px;height:18px;fill:currentColor;filter:drop-shadow(0 1px 1px var(--ts))}
.gel:hover:not(:disabled){filter:brightness(1.08) saturate(1.2);transform:translateY(-1px)}
.gel:active:not(:disabled){transform:translateY(1px) scale(.98)}
.gel:disabled{filter:grayscale(.9) opacity(.55);cursor:not-allowed}
.gel.lime{--c1:#eaff9c;--c2:#78e400;--c3:#3aa600;--edge:#2b8700;--ts:rgba(20,70,0,.55)}
.gel.pink{--c1:#ffc0e2;--c2:#ff3aa2;--c3:#d4006f;--edge:#a80058;--ts:rgba(110,0,50,.5)}
.gel.gold{--c1:#fff6a8;--c2:#ffc800;--c3:#ff9500;--edge:#d97300;--ts:rgba(120,60,0,.5)}
.gel.ghost{--c1:#ffffff;--c2:#eef9ff;--c3:#d4ecff;--edge:#9cc8ec;--txt:var(--ink);--ts:rgba(255,255,255,.9)}
.gel.round{width:42px;min-height:42px;padding:0}
.gel.wide{width:100%}
.gel.big{min-height:50px;font-size:17px;padding:12px 28px}
.gel.shopb{--c1:#c8fff0;--c2:#16cfa4;--c3:#009a78;--edge:#007a5f;--ts:rgba(0,70,55,.55)}
.cyn{cursor:pointer;transition:filter .15s}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zbox{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 5px;border-radius:999px;background:linear-gradient(180deg,#f3ffe6,#d6efb8);border:1px solid #fff;
  box-shadow:0 2px 8px rgba(60,90,20,.25);color:#3d5a14}
.zbox .zic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 30%,#d8ffb0 0 10%,#6aa82e 55%,#2f5410)}
.zbox .zic svg{width:20px;height:20px;fill:currentColor}
.zbox .ztxt{display:flex;flex-direction:column;gap:3px;min-width:150px}
.zbox b{font:800 12.5px/1.1 var(--font-display);white-space:nowrap}
.zbar{display:block;height:6px;border-radius:99px;background:rgba(60,90,20,.18);overflow:hidden}
.zbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9be05a,#4f8a1e);transition:width .5s}
.zbox.out{background:linear-gradient(180deg,#ffe9e6,#ffc7bd);color:#7a1a0a}
.zbox.out .zic{background:radial-gradient(circle at 35% 30%,#ffd0c0 0 10%,#c0392b 55%,#5a0d05)}
.zbox.out .zbar i{background:linear-gradient(90deg,#ff7a5a,#a3150a)}
:root:is([data-skin="dark"],[data-skin="goth"]) .zbox{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.18);color:#b9f07e}
@media (min-width:901px){
  .tree-head{position:relative}
  .tree-head .hud{position:absolute;left:16px;top:calc(100% + 17px);z-index:6;display:flex;align-items:center;gap:10px}
  .tree-head .zbox{padding:8px 14px 8px 8px}
  .tree-head .cyn{gap:10px;padding:7px 18px 7px 7px;font-size:24px;
    background:linear-gradient(180deg,#ffffff,#d9fbef);border:2px solid #fff;box-shadow:0 6px 18px rgba(0,110,90,.28),inset 0 -3px 6px rgba(0,140,110,.12)}
  .tree-head .cyn svg{width:38px;height:38px;padding:7px}
  .tree-head .cyn::after{content:"Cyn";font:800 13px var(--font-display);color:#00876a;opacity:.75;align-self:center}
  :root:is([data-skin="dark"],[data-skin="goth"]) .tree-head .cyn{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.18)}
}
.cyn:hover{filter:brightness(1.05) saturate(1.2)}
.gel.danger{--c1:#ffb8b8;--c2:#ff2d3d;--c3:#c4001a;--edge:#8f0012;--ts:rgba(90,0,0,.55);transition:transform .45s cubic-bezier(.2,1.5,.4,1),filter .2s}
.gel.danger.wob{animation:wob .35s}
.gel.danger.flee:disabled{filter:none;cursor:default}
@keyframes wob{25%{rotate:-5deg}75%{rotate:5deg}}
#tuto{position:fixed;inset:0;z-index:95}
.tuto-hole{position:fixed;border-radius:18px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,25,70,.6),0 0 0 3px #fff,0 0 26px 8px rgba(120,220,255,.85);
  transition:left .35s cubic-bezier(.3,1.2,.4,1),top .35s cubic-bezier(.3,1.2,.4,1),width .35s cubic-bezier(.3,1.2,.4,1),height .35s cubic-bezier(.3,1.2,.4,1)}
.tuto-hole.center{left:50%;top:50%;width:0;height:0;box-shadow:0 0 0 9999px rgba(0,25,70,.6)}
.tuto-card{position:fixed;width:min(340px,calc(100vw - 24px));padding:16px 18px 14px;border-radius:22px;transition:left .35s ease,top .35s ease}
.tuto-card.pop{animation:tutoin .35s cubic-bezier(.2,1.3,.4,1)}
.tuto-card h3{margin:2px 0 6px;font:800 19px/1.2 var(--font-display)}
.tuto-card p{margin:0 0 14px;font-size:14px;line-height:1.45;color:var(--ink-soft)}
.tuto-btns{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tuto-btns>span{display:flex;gap:6px}
.tuto-btns .gel{min-height:38px;padding:6px 16px;font-size:14px}
@keyframes tutoin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.tuto-offer{text-align:center;padding:6px 4px 2px}
.tuto-offer h2{margin:4px 0 8px;font:800 26px var(--font-display)}
.tuto-offer p{margin:0 auto 18px;max-width:380px;color:var(--ink-soft);line-height:1.45}
.tuto-ic{display:inline-grid;place-items:center;width:64px;height:64px;margin-bottom:8px;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffd23a 50%,#ff9500);box-shadow:0 6px 16px rgba(255,150,0,.35)}
.tuto-ic svg{width:32px;height:32px;fill:currentColor}
.tuto-choice{display:flex;flex-direction:column;align-items:center;gap:10px}
.wipefade{position:fixed;inset:0;z-index:9999;background:#000;opacity:0;transition:opacity 1.5s ease;pointer-events:all}
.wipefade.on{opacity:1}
.shopbal{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:12px 16px;border-radius:20px;background:linear-gradient(180deg,#effffa,#cdf6ea);border:1px solid #fff;
  box-shadow:0 3px 10px rgba(0,110,90,.15);font:800 28px var(--font-display);color:#00876a;font-variant-numeric:tabular-nums;cursor:pointer;text-align:left;transition:filter .15s}
.shopbal:hover{filter:brightness(1.04) saturate(1.15)}
.shopbal small{margin-left:auto;font:700 12px var(--font-display);color:#00876a;opacity:.8;text-decoration:underline dotted;text-underline-offset:3px}
.cyninfo{margin:0 0 14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 3px 10px rgba(0,110,90,.12);animation:slidein .3s ease}
.cyninfo>b{display:block;margin-bottom:6px;font:800 14px var(--font-display)}
.cyninfo ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.cyninfo li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.cyninfo li>svg{width:18px;height:18px;fill:var(--aqua-deep)}
.cyninfo em{display:inline-flex;align-items:center;gap:3px;font:800 13px var(--font-display);font-style:normal;color:#00876a}
.cyninfo em svg{width:14px;height:14px;fill:#00a37f}
:root:is([data-skin="dark"],[data-skin="goth"]) .cyninfo{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.shopbal svg{width:40px;height:40px;padding:7px;border-radius:50%;fill:#fff;background:radial-gradient(circle at 35% 30%,#c4fff0 0 10%,#14c9a0 55%,#00806a)}
.shopbal span{font-size:15px;color:var(--ink-soft)}
.shoplist{display:grid;gap:10px}
.shopit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 3px 10px rgba(0,70,160,.1)}
.shopit>i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15)}
.shopit>i svg{width:22px;height:22px;fill:currentColor}
.si-star{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffd000 55%,#e09a00)}
.si-crim{background:radial-gradient(circle at 35% 30%,#fff 0 8%,#ff3b3b 50%,#7a0010)}
.shopsec+.shopsec{margin-top:14px}
.shopsec>.eyebrow{margin-bottom:8px}
.shopgrid{display:grid;grid-template-columns:1fr;gap:8px}
.shopgrid .shopit{grid-template-columns:52px 1fr auto;gap:14px;padding:12px 14px 12px 12px}
.shopgrid .shopit>i{width:52px;height:52px;border-radius:16px}
.shopgrid .shopit>i svg{width:26px;height:26px}
.shopgrid .shopit b{font-size:16px}
.shopgrid .shopit small{font-size:13px;line-height:1.4;margin-top:2px}
.shopgrid .shopit .gel{min-width:104px;min-height:42px;padding:6px 14px;gap:6px;font-size:15px}
.shopgrid .shopit .gel svg{width:16px;height:16px}
.shopgrid .shopit .gel.gold:not(:disabled){color:#5a2c00;text-shadow:0 1px 0 rgba(255,255,255,.55);font-weight:900}
.shopgrid .shopit .gel.gold:not(:disabled) svg{fill:#5a2c00}
.shopgrid .shopit em{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;background:rgba(255,47,156,.1)}
.shopsec>.eyebrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:12.5px}
.shopsec>.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(0,90,200,.25),transparent)}
@media (max-width:520px){ .shopgrid .shopit{grid-template-columns:44px 1fr} .shopgrid .shopit>i{width:44px;height:44px} .shopgrid .shopit .gel{grid-column:1/-1;width:100%} }
.shopit.owned{opacity:.75}
.si-fertile{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ff6cc0 55%,#cc0070)}
.si-immune{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#8cff1a 55%,#2c9200)}
.si-midlife{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#c3a2ff 55%,#5a2ee0)}
.si-spouse{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ff6cc0 50%,#c4006a)}
.spform{display:grid;gap:10px}
.spform .m-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fieldhint{display:block;margin-top:4px;font:700 11.5px var(--font-display);color:var(--aqua-deep)}
.endnote{margin:8px 0 0;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.55);font-size:13px;color:var(--ink-soft)}
.si-antidote{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#b6ff6a 50%,#2f7a10)}
.si-vaccin{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#7fe3ff 50%,#0a7a8a)}
.si-lueur{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#c9a8ff 50%,#5a17b0)}
.autowarn{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 6px 2px;max-width:420px;margin:0 auto}
.aw-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;color:#fff;background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3));
  box-shadow:0 8px 18px rgba(0,80,190,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.aw-ic svg{width:34px;height:34px;fill:currentColor;filter:drop-shadow(0 1px 1px rgba(0,40,110,.4))}
.autowarn h2{margin:12px 0 4px;font:800 24px var(--font-display)}
.aw-lead{margin:0 0 14px;color:var(--ink-soft);font-size:14.5px}
.aw-box{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;text-align:left;
  background:linear-gradient(180deg,#effffa,#cdf6ea);border:1px solid #fff;box-shadow:0 3px 10px rgba(0,110,90,.15)}
.aw-cyn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 30%,#c4fff0 0 10%,#14c9a0 55%,#00806a)}
.aw-cyn svg{width:22px;height:22px;fill:currentColor}
.aw-box b{display:block;font:800 17px var(--font-display);color:#00876a}
.aw-box small{display:block;font-size:13px;line-height:1.4;color:var(--ink-soft)}
.aw-check{display:inline-flex;align-items:center;gap:8px;margin:14px 0 16px;font-size:14px;color:var(--ink-soft);cursor:pointer}
.aw-check input{width:18px;height:18px;accent-color:var(--aqua-deep)}
.aw-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;width:100%}
.aw-actions .gel{min-height:46px}
:root:is([data-skin="dark"],[data-skin="goth"]) .aw-box{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.reigns{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reigns li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 2px 8px rgba(0,70,160,.1)}
.reigns li.now{background:linear-gradient(180deg,#fffbe6,#ffe9a6);border-color:#ffd24a;box-shadow:0 0 0 2px rgba(122,43,214,.25)}
.reigns li .orb{width:40px;height:40px}
.reigns b{display:block;font:800 15px var(--font-display)}
.reigns small{display:block;font-size:12px;color:var(--ink-soft)}
.reigns em{font:800 14px var(--font-display);font-style:normal;color:#7a2bd6;text-align:right;white-space:nowrap}
.reigns em i{display:block;font:700 12px var(--font-display);font-style:normal;color:var(--ink-soft)}
:root:is([data-skin="dark"],[data-skin="goth"]) .reigns li{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.14)}
.optcard{display:grid;gap:8px;padding:12px;border-radius:20px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.9)}
.optcard>.lab{margin:0 0 2px 4px}
.switch.optrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;margin:0;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.8);
  border:1px solid #fff;box-shadow:0 2px 8px rgba(0,70,160,.08);transition:box-shadow .15s}
.switch.optrow:hover{box-shadow:0 4px 14px rgba(0,70,160,.16)}
.opt-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 8px rgba(0,60,140,.2)}
.opt-ic svg{width:23px;height:23px;fill:currentColor}
.opt-ic.royal{background:linear-gradient(160deg,#ffe066,#f0a800 55%,#9a4dff)}
.opt-ic.fam{background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3))}
.optrow .opt-txt b{display:block;font:800 14.5px var(--font-display)}
.optrow .opt-txt small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-soft)}
.optsub{display:grid;gap:6px;padding:4px 6px 4px 58px}
.rulepills{display:flex}

.facts .imf dd svg{width:18px;height:18px;fill:currentColor;flex:none}
:root:is([data-skin="dark"],[data-skin="goth"]) .pickrow{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.14)}
.si-dark{background:radial-gradient(circle at 35% 30%,#ff8a95 0 8%,#b3001b 45%,#140205)}
.si-xp{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#4a95ee 50%,#0a3fa8)}
.si-orange{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ff9a2e 55%,#e25b00)}
.shopit b{display:block;font:800 15px var(--font-display)}
.shopit small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-soft)}
.shopit em{display:block;margin-top:3px;font:700 11.5px var(--font-display);font-style:normal;color:var(--magenta-deep)}
.shopit .gel{white-space:nowrap}
@media (max-width:520px){ .shopit{grid-template-columns:40px 1fr} .shopit .gel{grid-column:1/-1} }
.gel.armed{--c1:#ffd0d0;--c2:#ff4d4d;--c3:#d10000;--edge:#a00000}
.pills{display:flex;padding:3px;gap:3px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid #fff;box-shadow:inset 0 1px 3px rgba(0,60,140,.2)}
.pills button{min-width:40px;min-height:34px;padding:0 8px;border:0;border-radius:999px;background:transparent;cursor:pointer;font:800 14px var(--font-display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pills button[aria-pressed="true"]{color:#fff;text-shadow:0 1px 2px rgba(0,40,110,.5);background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 49%,var(--g3) 51%,var(--g2) 100%);box-shadow:0 2px 6px rgba(0,80,190,.35),inset 0 1px 0 rgba(255,255,255,.8)}

/* ---------- Écran de départ ---------- */
.setup{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup-inner{width:100%;max-width:580px;display:flex;flex-direction:column;gap:18px}
.setup-top{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.logo{margin:0;font:800 clamp(56px,13vw,96px)/.95 var(--font-display);letter-spacing:-.035em;text-align:center;
  background:linear-gradient(180deg,#ffffff 0%,#e3f8ff 40%,#5fd0ff 62%,#0090f0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,70,170,.55)) drop-shadow(0 10px 18px rgba(0,60,160,.35))}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}

.brand .logo{font-size:clamp(38px,9.5vw,72px);line-height:1.2;padding-bottom:.06em}
.logo span{background:linear-gradient(180deg,#f8ffe0 0%,#d4ff70 40%,#6fd400 60%,#2f9a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand.small{justify-content:flex-start;gap:8px}
.brand.small .emblem{width:38px;animation:none}
.brand.small .logo{font-size:30px;line-height:1.25}
.tag{margin:6px auto 0;max-width:34ch;text-align:center;color:#fff;font:500 17px/1.4 var(--font-display);text-wrap:balance;text-shadow:0 1px 3px rgba(0,50,140,.5)}
.card{padding:20px}
.form{display:flex;flex-direction:column;gap:16px}
.form h2{margin:0;font:800 21px/1.2 var(--font-display)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font:700 12px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.inp{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid #9fcdf0;background:linear-gradient(180deg,#f3fbff,#fff);
  box-shadow:inset 0 2px 4px rgba(0,80,160,.14);font:700 16px var(--font-body);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--aqua);box-shadow:inset 0 2px 4px rgba(0,80,160,.14),0 0 0 3px rgba(0,180,255,.35)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segs input{position:absolute;opacity:0;pointer-events:none}
.segs label{display:block;cursor:pointer}
.segs .seg{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:16px;border:1px solid #a9d3f2;
  background:linear-gradient(180deg,#fff,#e6f5ff);font:700 16px var(--font-display);color:var(--ink-soft);transition:all .15s}
.segs input:focus-visible+.seg{outline:3px solid var(--sun);outline-offset:2px}
.segs input:checked+.seg.f{color:#fff;border-color:var(--female-2);background:linear-gradient(180deg,#ffc6e6 0%,#ff4aac 49%,#d6007a 51%,#ff4aac 100%);text-shadow:0 1px 2px rgba(110,0,50,.5)}
.segs input:checked+.seg.m{color:#fff;border-color:var(--male-2);background:linear-gradient(180deg,#b6f2ff 0%,#14b4ff 49%,#0072dc 51%,#14b4ff 100%);text-shadow:0 1px 2px rgba(0,40,110,.5)}
.dob{display:grid;grid-template-columns:80px 1fr 100px;gap:10px}
.agebox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:linear-gradient(180deg,rgba(0,170,255,.12),rgba(0,170,255,.04));border:1px solid rgba(0,150,255,.25)}
.agebox .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.agebox b{font:800 26px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--aqua)}
.err{margin:0;padding:10px 14px;border-radius:12px;background:#ffe3ef;color:#a3004f;font-weight:700}
.form-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.form-actions .gel.big{flex:1 1 220px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.resume p{margin:0;min-width:0}
.resume b{font-family:var(--font-display)}
.hint{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.45}

/* ---------- Jeu ---------- */
.game{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:14px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* En-tête : volet de boutons tout en haut, puis logo + date en dessous */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 16px;padding:8px 14px 10px;border-radius:24px}
.topbar .ctrls{grid-row:1;grid-column:1/-1;justify-self:stretch;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;min-width:0;
  padding:0 2px 8px;border-bottom:1px solid rgba(255,255,255,.8);scrollbar-width:none}
.topbar .ctrls::-webkit-scrollbar{display:none}
.topbar .ctrls>*{flex:none}
.topbar .brand{grid-row:2;grid-column:1;justify-self:start}
.topbar .clock{grid-row:2;grid-column:2}
.ctrl-sep{width:1px;align-self:stretch;margin:4px 2px;background:rgba(0,90,200,.18)}
.restartb{margin-left:auto}
.topbar .logo{font-size:38px;text-align:left;filter:drop-shadow(0 2px 0 rgba(0,70,170,.5))}
.clock{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.lcd{position:relative;overflow:hidden;min-width:300px;padding:7px 26px;border-radius:999px;text-align:center;border:1px solid var(--lcd-edge);
  background:linear-gradient(180deg,var(--lcd-a) 0%,var(--lcd-b) 49%,var(--lcd-c) 51%,var(--lcd-d) 100%);
  box-shadow:0 6px 16px rgba(0,50,150,.4),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(0,220,255,.35)}
.lcd::before{content:"";position:absolute;left:5%;right:5%;top:1px;height:46%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.lcd span{position:relative;font:800 25px/1.15 var(--font-display);color:#fff;letter-spacing:.01em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px var(--lcd-glow),0 1px 2px rgba(0,30,90,.6);white-space:nowrap}
.lcd.flash{animation:flash .6s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(160,255,60,.9),0 6px 16px rgba(0,50,150,.4)}100%{box-shadow:0 0 0 14px rgba(160,255,60,0),0 6px 16px rgba(0,50,150,.4)}}
.clock-sub{display:flex;align-items:center;gap:10px;width:100%;max-width:300px}
.yearbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 3px rgba(0,60,140,.25);overflow:hidden}
.yearbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#e6ff9a,#7be000 50%,#3eaa00 51%,#7be000)}
.rate{font:700 12px var(--font-display);color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.rate.paused{color:var(--magenta-deep)}
.decade{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:3px 14px 3px 3px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid #fff;
  box-shadow:0 3px 8px rgba(0,70,160,.15);font:700 12.5px/1.2 var(--font-display);color:var(--ink)}
.decade .di{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#fff 0 8%,#ff6cc0 40%,#c4006b);box-shadow:inset 0 -2px 4px rgba(0,0,0,.2)}
.decade .di svg{width:14px;height:14px;fill:#fff}
.decade span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.decade b{color:var(--magenta-deep)}
.decade.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.era{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.warb{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 8px;border-radius:99px;font:800 12px/1.2 var(--font-display);color:#fff;
  background:linear-gradient(180deg,#ff8f97 0%,#ff2d3d 49%,#c80018 51%,#ff2d3d 100%);border:1px solid #9a0012;text-shadow:0 1px 1px rgba(90,0,10,.5);
  box-shadow:0 3px 10px rgba(200,0,20,.35);animation:warpulse 1.6s ease-in-out infinite}
.warb svg{width:13px;height:13px;fill:#fff}
@keyframes warpulse{50%{box-shadow:0 0 0 4px rgba(255,45,61,.25),0 3px 10px rgba(200,0,20,.35)}}
.autob.on{--c1:#eaff9c;--c2:#78e400;--c3:#3aa600;--edge:#2b8700;--txt:#fff;--ts:rgba(20,70,0,.55);animation:autoglow 1.8s ease-in-out infinite}
@keyframes autoglow{50%{box-shadow:0 0 0 4px rgba(140,255,30,.35),0 5px 14px rgba(0,80,190,.32)}}
/* Thèmes de couleur (Paramètres) */
:root[data-skin="orange"]{--sky-top:#ff5a00;--sky-mid:#ff9a2e;--sky-low:#ffd27a;--sky-haze:#fff3d9;--aqua:#ff8a00;--aqua-deep:#c04800;
  --g1:#ffe2a8;--g2:#ff9a1f;--g3:#e25b00;--gedge:#b34700;--lcd-a:#ffb050;--lcd-b:#e86400;--lcd-c:#b84500;--lcd-d:#ff8a1f;--lcd-edge:#8a3300;--lcd-glow:rgba(255,230,150,.95);
  --shadow:0 14px 34px rgba(170,70,0,.28)}
:root[data-skin="kid"]{--sky-top:#4fc2ff;--sky-mid:#93dcff;--sky-low:#d6f5ff;--sky-haze:#fff6c4;--aqua:#ff6fae;--aqua-deep:#e0407f;
  --g1:#ffd9ec;--g2:#ff8cc4;--g3:#ff4f98;--gedge:#d83a7c;--lcd-a:#ffc04d;--lcd-b:#ff8f1f;--lcd-c:#e85d00;--lcd-d:#ffab3a;--lcd-edge:#b84a00;--lcd-glow:rgba(255,240,170,.95);
  --hill-a1:#a6f760;--hill-a2:#58d63a;--hill-a3:#23a82e;--hill-b1:#ffe066;--hill-b2:#ffad1f;--shadow:0 14px 34px rgba(255,80,150,.24);
  --font-display:"Fredoka","M PLUS Rounded 1c","Segoe UI",system-ui,sans-serif}
.kidfx{position:absolute;inset:0;display:none;overflow:hidden}
:root[data-skin="kid"] .kidfx{display:block}
body.no-deco .kidfx b,body.no-deco .kidfx .cloud{display:none}
.kidfx .rainbow{position:absolute;left:50%;top:12vh;width:min(1200px,150vw);aspect-ratio:2/1;transform:translateX(-50%);opacity:.5;
  background:radial-gradient(circle at 50% 100%,rgba(0,0,0,0) 0 50%,#8f6bff 50% 53.4%,#3fa9ff 53.4% 56.8%,#3fd46b 56.8% 60.2%,#ffe14d 60.2% 63.6%,#ff9a2e 63.6% 67%,#ff4f6d 67% 70.4%,rgba(0,0,0,0) 70.4%)}
.kidfx .cloud{position:absolute;left:0;top:var(--y);width:var(--w);height:calc(var(--w)*.34);border-radius:999px;background:#fff;opacity:.92;
  box-shadow:0 6px 14px rgba(80,160,220,.18);animation:kidcloud var(--d) linear infinite;animation-delay:var(--dl)}
.kidfx .cloud::before,.kidfx .cloud::after{content:"";position:absolute;bottom:40%;border-radius:50%;background:#fff}
.kidfx .cloud::before{left:16%;width:38%;aspect-ratio:1}
.kidfx .cloud::after{left:44%;width:44%;aspect-ratio:1}
.kidfx b{position:absolute;width:var(--s);height:var(--s);background:var(--c);animation:kidbob var(--d) ease-in-out infinite;animation-delay:var(--dl);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.kidfx b.h{clip-path:path('M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z');width:24px;height:24px;transform-origin:center}
@keyframes kidcloud{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
@keyframes kidbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(14deg)}}
:root[data-skin="kid"] .logo{background:linear-gradient(90deg,#3fd46b,#3fa9ff 50%,#8f6bff);-webkit-background-clip:text;background-clip:text}
:root[data-skin="kid"] .logo span{background:linear-gradient(90deg,#ff4f6d,#ff9a2e 50%,#ffc21f);-webkit-background-clip:text;background-clip:text}
:root[data-skin="kid"] .glass{border-color:#fff;border-radius:26px}
:root[data-skin="vapor"]{--sky-top:#00c8ff;--sky-mid:#4fe3ff;--sky-low:#ff8be4;--sky-haze:#ffd9f6;--aqua:#00c8ff;--aqua-deep:#b0008a;
  --g1:#b8fbff;--g2:#00d4ff;--g3:#00a0c8;--gedge:#0089a8;--lcd-a:#ff7ad8;--lcd-b:#d4009e;--lcd-c:#9e0077;--lcd-d:#ff2fc0;--lcd-edge:#7a005c;--lcd-glow:rgba(255,180,245,.95);
  --hill-a1:#ffa3f0;--hill-a2:#c43cff;--hill-a3:#6a00b8;--hill-b1:#e070ff;--hill-b2:#5a00a0;--shadow:0 14px 34px rgba(120,0,140,.28)}
/* Carte de France */
.mapview{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;border-top:1px solid rgba(255,255,255,.8)}
.mapwrap{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:8px}
.francemap{display:block;flex:1;min-height:0;width:100%;height:100%;border-radius:24px;background:var(--sky-mid);box-shadow:0 10px 26px rgba(0,60,150,.25),inset 0 1px 0 #fff;cursor:zoom-in}
.francemap{touch-action:pan-y}
.francemap.zoomed{cursor:grab;touch-action:none}
.tree-scroll{touch-action:pan-x pan-y}
.maplegend.hl{color:var(--aqua-deep)}
.francemap.grabbing{cursor:grabbing}
.mapctl{position:absolute;top:10px;right:10px}
.mapctl button{min-width:36px;min-height:32px;font-size:16px}
.francemap .unklab{font-size:12px;fill:var(--ink-soft)}
.francemap text{font-family:var(--font-display);font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.francemap .mn{font-size:12px;fill:#003a8c;stroke-width:2.5px}
.francemap .mlab{font-size:11px;fill:var(--ink)}
.mdot-in{transform-box:fill-box;transform-origin:center;transition:opacity .6s,transform .6s}
.mdot-in.pop{animation:dotin .6s cubic-bezier(.2,1.6,.4,1)}
.mdot-in.gone{opacity:0;transform:scale(.2)}
.mdot-in .mring{fill:none;stroke:var(--lime);stroke-width:3;animation:ringpulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dotin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ringpulse{50%{transform:scale(1.25);opacity:.4}}
.maplegend{margin:0;text-align:center;font:700 13px var(--font-display);color:var(--ink-soft)}
.tree-head #viewSw{margin-left:auto}
.tree-head #viewSw:not([hidden])~.zoomer{margin-left:0}
/* Couteau du meurtre */
.astfx{position:fixed;left:0;top:0;z-index:76;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none}
.astfx .rock{position:absolute;inset:0;border-radius:46% 54% 50% 50%;background:radial-gradient(circle at 35% 30%,#b8a594 0 14%,#6a5442 55%,#2a1e16);
  box-shadow:0 0 14px 5px rgba(255,150,0,.9),0 0 34px 12px rgba(255,70,0,.5)}
.astfx .trail{position:absolute;left:50%;top:50%;width:170px;height:14px;margin-top:-7px;border-radius:99px;transform-origin:0 50%;transform:rotate(var(--a));
  background:linear-gradient(90deg,rgba(255,230,140,.95),rgba(255,120,0,.65) 35%,rgba(255,60,0,0));filter:blur(1.5px)}
.astboom{position:fixed;z-index:76;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;
  border:4px solid rgba(255,190,60,.95);box-shadow:0 0 30px 10px rgba(255,120,0,.6);animation:astboom .75s ease-out forwards}
@keyframes astboom{from{transform:scale(.4);opacity:1}to{transform:scale(6);opacity:0}}
.knifefx{position:fixed;z-index:75;width:0;height:0;pointer-events:none}
.knifefx .knife{position:absolute;left:-30px;top:-30px;width:60px;height:60px;animation:stab .9s cubic-bezier(.3,1.4,.5,1) forwards}
.knifefx .knife svg{width:100%;height:100%;fill:#e9eef5;filter:drop-shadow(0 0 2px #000) drop-shadow(0 3px 6px rgba(0,0,0,.5))}
@keyframes stab{0%{transform:translate(70px,-80px) rotate(40deg) scale(.6);opacity:0}35%{transform:translate(0,0) rotate(-8deg) scale(1.1);opacity:1}
  45%{transform:translate(-4px,4px) rotate(-12deg) scale(1.05)}55%{transform:translate(3px,-3px) rotate(-6deg)}80%{opacity:1}100%{transform:translate(0,0) rotate(-8deg);opacity:0}}
.knifefx .slash{position:absolute;left:-55px;top:-3px;width:110px;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(200,0,20,0),#ff1a2e,rgba(200,0,20,0));

#treeCanvas .node.zombie{border:2px solid #4e6b2f;color:#1f2e0c;background:radial-gradient(circle at 20% 80%,rgba(90,60,20,.25) 0 10%,transparent 12%),radial-gradient(circle at 85% 30%,rgba(90,60,20,.22) 0 8%,transparent 10%),linear-gradient(170deg,#d8e8b8 0%,#a9c47e 50%,#6f8f43 100%);
  box-shadow:0 0 0 2px rgba(80,120,30,.45),0 0 18px 3px rgba(110,170,40,.35),0 8px 16px rgba(40,60,10,.3);filter:saturate(.85)}
#treeCanvas .node.zombie .n-band{background:linear-gradient(180deg,#6aa82e,#2f5410);color:#e6ffc8;border:1px solid #2f5410}
#treeCanvas .node.zombie .nt span,#treeCanvas .node.zombie .n-city{color:#3d5a14}
#treeCanvas .node.zombie .orb{filter:hue-rotate(60deg) saturate(.6) brightness(.9)}
#treeCanvas .node.zombie::after{content:"";position:absolute;left:18%;right:18%;bottom:-7px;height:9px;pointer-events:none;
  background:radial-gradient(circle at 15% 0,#6f8f43 0 3px,transparent 4px),radial-gradient(circle at 55% 0,#6f8f43 0 4px,transparent 5px),radial-gradient(circle at 85% 0,#6f8f43 0 2.5px,transparent 3.5px)}
.facts .zf{background:linear-gradient(180deg,#eef8df,#d0e8ad);border-color:#a9c47e}
.facts .zf dd{color:#3d5a14}
.opt-ic.zomb{background:linear-gradient(160deg,#c8f08a,#6aa82e 55%,#2f5410)}
/* Thème Windows XP */
:root[data-skin="xp"]{--sky-top:#1d5fd1;--sky-mid:#4a95ee;--sky-low:#9cccff;--sky-haze:#e9f5ff;--aqua:#2a7ae2;--aqua-deep:#0a3fa8;
  --g1:#cfe3ff;--g2:#3b8af0;--g3:#1458c8;--gedge:#0a3fa8;--hill-a1:#9be05a;--hill-a2:#55b02a;--hill-a3:#2f7d16;--hill-b1:#b4e870;--hill-b2:#5aa82c;
  --glass-hi:#f4f2e8;--glass-lo:#ece9d8;--glass-edge:#0a3fa8;--ink:#101010;--ink-soft:#404040;--ink-faint:#707070;
  --font-display:"Trebuchet MS",Tahoma,Verdana,sans-serif;--font-body:Tahoma,Verdana,"Segoe UI",sans-serif;--shadow:2px 4px 12px rgba(0,20,80,.38)}
:root[data-skin="xp"] .glass{border:1px solid #0a3fa8;border-radius:9px 9px 4px 4px;-webkit-backdrop-filter:none;backdrop-filter:none;
  background:linear-gradient(180deg,#0a4fd0 0,#3a8cf4 4px,#2569e0 7px,#ece9d8 7px,#f4f2e8 100%);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.5)}
:root[data-skin="xp"] .gel{border-radius:4px;letter-spacing:0;box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
:root[data-skin="xp"] .gel::before{border-radius:3px;opacity:.5}
:root[data-skin="xp"] .gel.ghost{--c1:#ffffff;--c2:#f4f3ee;--c3:#e3e0d0;--edge:#003c74;--txt:#101010;--ts:rgba(255,255,255,0)}
:root[data-skin="xp"] .gel.lime{--c1:#9be09b;--c2:#3ca63c;--c3:#2a8a2a;--edge:#1d5e1d;font-style:italic}
:root[data-skin="xp"] .logo{background:none;color:#0a3fa8;-webkit-text-fill-color:#0a3fa8;font-style:italic;filter:none;text-shadow:1px 1px 0 #fff}
:root[data-skin="xp"] .logo span{background:none;color:#f07800;-webkit-text-fill-color:#f07800}
:root[data-skin="xp"] .setup .logo,:root[data-skin="xp"] .brand:not(.small) .logo{color:#fff;-webkit-text-fill-color:#fff;text-shadow:2px 2px 0 #0a3fa8,0 0 16px rgba(0,40,140,.5)}
:root[data-skin="xp"] .bubble,:root[data-skin="xp"] .flare,:root[data-skin="xp"] .swoosh{display:none}
:root[data-skin="xp"] .sky-sun{opacity:.55}
:root[data-skin="xp"] .sky::after{content:"";position:absolute;inset:0 0 35% 0;pointer-events:none;
  background:radial-gradient(ellipse 16% 6% at 20% 20%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%),radial-gradient(ellipse 22% 7% at 72% 13%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 12% 4.5% at 50% 33%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),radial-gradient(ellipse 18% 5% at 88% 38%,rgba(255,255,255,.7),rgba(255,255,255,0) 70%)}
/* Ambiance zombie */
.zfx{position:fixed;inset:0;z-index:45;pointer-events:none;display:none}
body.zmode .zfx{display:block}
.zfx .ztint{position:absolute;inset:0;background:#3f7a12;mix-blend-mode:multiply;opacity:calc(.06 + var(--zp,0) * .32);transition:opacity 3s}
.zfx .zvig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(10,30,0,.55) 100%);opacity:calc(.35 + var(--zp,0) * .65);animation:zbreath 6s ease-in-out infinite}
@keyframes zbreath{50%{filter:brightness(.8)}}
body.zmode .sky{filter:hue-rotate(calc(var(--zp,0) * -70deg)) saturate(calc(1 - var(--zp,0) * .35)) brightness(calc(1 - var(--zp,0) * .3));transition:filter 3s}
body.zmode .bubble{opacity:calc(.6 - var(--zp,0) * .5)}
.zcracks{position:absolute;inset:0;pointer-events:none;display:none}
body.zmode .zcracks{display:block}
.zcracks.deco{z-index:1}
body.zmode .treebox{position:relative}
#zTreeCracks{z-index:4}
.zcracks svg{width:100%;height:100%;display:block}
.zcracks .ck{opacity:0;transition:opacity 2.5s}
.zcracks .ck.on{opacity:1}
.zcracks .ck-l{fill:none;stroke:rgba(230,255,200,.35);stroke-width:3.2;stroke-linejoin:round;transform:translate(1.5px,1.5px)}
.zcracks .ck-d{fill:none;stroke:rgba(20,35,8,.75);stroke-width:2;stroke-linejoin:round}
#zTreeCracks .ck-d{stroke:rgba(20,35,8,.55)}
.regnal.royalrec{order:-1;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,#fff9e0,#ffe9a6);border:1px solid #ffd24a;box-shadow:0 0 0 2px rgba(122,43,214,.25)}
.node.crim{border-color:#7a0012;color:#ffe6e8;background:linear-gradient(160deg,#3a0008 0%,#12000a 46%,#5c0012 100%);
  box-shadow:0 0 0 2px #b0001a,0 0 18px 4px rgba(200,0,30,.45),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,80,90,.35);animation:dark 3.2s ease-in-out var(--t,0s) infinite}
.node.crim::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(0,0,0,0) 35%,rgba(255,30,50,.35) 48%,rgba(0,0,0,0) 60%);background-size:260% 100%;animation:shine 3.8s linear var(--t,0s) infinite}
@keyframes dark{50%{box-shadow:0 0 0 2px #ff1a3a,0 0 30px 8px rgba(255,0,40,.35),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,80,90,.35)}}
.node.crim .nt span,.node.crim .n-city{color:#ff9aa5}
.node.crim .n-life{color:#ffd0d4}
/* Criminel en prison : barreaux par-dessus la bulle, jusqu'à sa mort */
.node .bars{position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 15px,#3a3d44 15px,#c9ced8 17px,#5b606b 19px,rgba(0,0,0,0) 20px 34px);
  box-shadow:inset 0 0 0 3px #4a4e57,inset 0 10px 0 -6px #8d929c,inset 0 -10px 0 -6px #8d929c}
.node.jailed .n-top,.node.jailed .n-life,.node.jailed .n-city,.node.jailed .n-band{opacity:.7}
.rib.cr.jail{color:#fff;background:linear-gradient(180deg,#7d828d,#3a3d44);border:1px solid #c9ced8;text-shadow:0 1px 1px #000}
/* Politique : bulle bleu-blanc-rouge avec un reflet ; le ou la Président(e) brille davantage */
.node.pol,.node.partner.pol{border-color:#fff;background:linear-gradient(160deg,#eef3ff 0%,#dbe6ff 38%,#ffffff 58%,#ffe1e5 100%);
  box-shadow:0 0 0 2px #2b4fd8,0 0 0 4px #fff,0 0 0 6px #e8203a,0 8px 18px rgba(0,40,140,.25)}
.node.pol::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 36%,rgba(70,110,255,.35) 44%,rgba(255,255,255,.95) 48%,rgba(255,40,60,.35) 52%,rgba(255,255,255,0) 60%);background-size:260% 100%;animation:shine 3.4s linear var(--t,0s) infinite}
.node.pol .nt b,.node.pol .nt span,.node.pol .n-life,.node.pol .n-city{color:#13246b}
.node.pol .n-band{background:linear-gradient(90deg,#2b4fd8,#5574ff 50%,#e8203a);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.node.pres{animation:pres 2.6s ease-in-out var(--t,0s) infinite}
@keyframes pres{0%,100%{box-shadow:0 0 0 2px #1f3fbf,0 0 0 4px #fff,0 0 0 6px #e8203a,0 0 24px 8px rgba(255,205,0,.6),0 8px 18px rgba(0,40,140,.3)}
  50%{box-shadow:0 0 0 2px #1f3fbf,0 0 0 4px #fff,0 0 0 6px #e8203a,0 0 40px 14px rgba(80,120,255,.55),0 8px 18px rgba(0,40,140,.3)}}
.rib.pr{right:8px;color:#fff;background:linear-gradient(180deg,#5574ff,#1f3fbf);border:1px solid #fff;box-shadow:inset 0 -3px 0 #e8203a,0 0 10px rgba(255,205,0,.7)}
.facts .atf{background:linear-gradient(180deg,#fffaf0,#ffeec4);border-color:#ffd98a;color:#7a4a00}
.facts .atf dd{display:flex;gap:8px;align-items:flex-start;color:#7a4a00}
.facts .atf dd svg{flex:none;width:20px;height:20px;fill:#e08a00;margin-top:1px}
.facts .atf small{display:block;font-weight:600;opacity:.85}
:root:is([data-skin="dark"],[data-skin="goth"]) .facts .atf{background:rgba(255,190,60,.12);border-color:rgba(255,190,60,.35)}
:root:is([data-skin="dark"],[data-skin="goth"]) .facts .atf dd{color:#ffd28a}
.setnote{margin:2px 2px 0;font-size:12.5px;opacity:.85;min-height:1em}
@media (max-width:520px){ .cands.six{grid-template-columns:1fr 1fr} }
.node.crim .n-band{background:linear-gradient(180deg,#4a0008,#1a0003);color:#ff6b78;border:1px solid #7a0012}
.flames{position:absolute;width:196px;height:80px;pointer-events:none;
  background:radial-gradient(ellipse 13% 85% at 12% 100%,#ffb000 0,#ff3b1f 35%,rgba(255,0,0,0) 75%),radial-gradient(ellipse 15% 100% at 33% 100%,#ff7a00 0,#d4001e 45%,rgba(0,0,0,0) 78%),
    radial-gradient(ellipse 17% 115% at 52% 100%,#ffd000 0,#ff2a00 32%,#b3001b 58%,rgba(0,0,0,0) 80%),radial-gradient(ellipse 14% 95% at 72% 100%,#ff8a00 0,#c4001e 42%,rgba(0,0,0,0) 76%),
    radial-gradient(ellipse 12% 80% at 90% 100%,#ffb000 0,#ff3b1f 35%,rgba(255,0,0,0) 75%),radial-gradient(ellipse 55% 70% at 50% 100%,#1a0003 0,rgba(26,0,3,.6) 40%,rgba(0,0,0,0) 75%);
  filter:blur(1.5px) drop-shadow(0 0 8px rgba(255,60,0,.7));transform-origin:50% 100%;animation:flame .16s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.82) skewX(-4deg);opacity:.85}to{transform:scaleY(1.15) skewX(4deg);opacity:1}}
.node.crim.dead{filter:grayscale(.7);opacity:.75}
.rib.cr{right:8px;color:#ff8f99;background:linear-gradient(180deg,#3a0008,#12000a);border:1px solid #b0001a}
.rib.sk{right:8px;color:#a0005a;background:linear-gradient(180deg,#fff3fb,#ffd0ea 50%,#ffb3dc 51%,#ffe2f2);border:1px solid #ff8cc6}
.node.starkid{box-shadow:0 0 0 2px #ffb3dc,0 0 14px rgba(255,120,200,.45),0 7px 16px rgba(0,70,160,.24),inset 0 1px 0 #fff}
.facts .crf{background:linear-gradient(180deg,#3a0008,#12000a);border-color:#7a0012}
.facts .crf dt{color:#ff9aa5}.facts .crf dd{color:#fff}
.facts .skf{background:linear-gradient(180deg,#fff3fb,#ffd9ee);border-color:#ffc4e3}.facts .skf dd{color:#a0005a}
.k-crime{--dot:#b0001a} .k-ach{--dot:#ffb300}
/* Succès */
.achcat{margin-top:4px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 4px 10px rgba(0,70,160,.12)}
.ach.locked{opacity:.5;filter:grayscale(.95)}
.ach b{font:800 13.5px/1.2 var(--font-display)}
.albtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px;margin:6px 0 12px;padding:4px;border-radius:18px}
.albtabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:44px;padding:5px 6px;border-radius:14px;
  font-size:13px;line-height:1.15;text-align:center;white-space:normal;overflow-wrap:anywhere}
.albtabs button small{font-size:11px;opacity:.75}
@media (max-width:520px){ .albtabs{grid-template-columns:repeat(3,minmax(0,1fr))} .albtabs button{font-size:12px} }
.albsort{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:-4px 0 10px}
.albsort label{font:700 12.5px var(--font-display);color:var(--ink-soft)}
.albsort select{width:auto;min-height:36px;padding:5px 12px;font-size:13.5px}
.albgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.albc{display:grid;grid-template-columns:32px 1fr;gap:9px;align-items:center;padding:9px 11px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid #fff;box-shadow:0 3px 8px rgba(0,70,160,.1)}
.albc>i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--aqua) 70%);color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.12)}
.albc>i svg{width:17px;height:17px;fill:currentColor}
.albc b{display:block;font:700 13px/1.2 var(--font-display)}
.albc small{display:block;margin-top:2px;font-size:11.5px;line-height:1.3;color:var(--ink-soft)}
.albc.unk{background:rgba(255,255,255,.42)}
.albc.unk>i{background:radial-gradient(circle at 35% 30%,#fff 0 12%,#a3b6c8 70%)}
.albc.unk b{color:var(--ink-faint);letter-spacing:.1em}
:root:is([data-skin="dark"],[data-skin="goth"]) .albc{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.14)}
:root:is([data-skin="dark"],[data-skin="goth"]) .albc.unk{background:rgba(255,255,255,.04)}
@media (max-width:520px){ .albgrid{grid-template-columns:1fr 1fr} .albc{grid-template-columns:1fr;justify-items:center;text-align:center;padding:9px 7px} }
.ach small{font-size:12px;line-height:1.35;color:var(--ink-soft)}
.ach em{font-style:normal;font:700 11px var(--font-display);color:var(--lime-deep)}
.ach.locked em{color:var(--ink-faint)}
.medal{--m1:#e7a35c;--m2:#8a4b14;--m3:#f3c48f;position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,#fff 0 8%,var(--m1) 42%,var(--m2));border:2px solid var(--m3);box-shadow:inset 0 -4px 8px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.2)}
.medal svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.medal::after{content:"";position:absolute;left:12%;right:12%;top:4%;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.t-silver{--m1:#e9eef3;--m2:#7d8a98;--m3:#fff}
.t-gold{--m1:#ffe066;--m2:#c98a00;--m3:#fff3a8}
.t-platinum{--m1:#e6fbff;--m2:#4fb0d0;--m3:#fff}
.t-special{--m1:#c3a2ff;--m2:#5a2ee0;--m3:#ece2ff}
.t-legend{--m1:#fff;--m2:#c9b6ff;--m3:#fff}
.medal.t-legend::before{content:"";position:absolute;inset:-30%;background:conic-gradient(#ff4f6d,#ff9a2e,#ffe14d,#3fd46b,#3fa9ff,#8f6bff,#ff4f9c,#ff4f6d);animation:legspin 4s linear infinite}
.medal.t-legend svg{position:relative;z-index:1}
.medal.t-legend::after{z-index:2}
@keyframes legspin{to{transform:rotate(360deg)}}
.ach.leg:not(.locked){background:linear-gradient(135deg,#ffe3ec,#fff6d6 25%,#e2ffe9 50%,#e0f0ff 75%,#efe4ff);border-color:#fff;box-shadow:0 0 0 2px #ffd0ea,0 4px 16px rgba(150,110,255,.3)}
.achpop.t-legend{box-shadow:0 0 0 3px #fff,0 0 0 6px #ff9ad5,0 0 50px rgba(160,120,255,.75),var(--shadow)}
.achpop{position:fixed;left:50%;top:30%;z-index:80;transform:translate(-50%,-50%);display:flex;align-items:center;gap:16px;width:min(420px,calc(100% - 32px));
  padding:16px 22px;border-radius:26px;pointer-events:none;animation:achin .55s cubic-bezier(.2,1.4,.4,1)}
.achpop .medal{width:70px;height:70px;animation:medalin .9s ease}
.achpop .multi{display:flex;flex:none}
.achpop .multi .orb{width:48px;height:48px;margin-left:-14px;animation:hop 1s ease-in-out infinite}
.achpop .multi .orb:first-child{margin-left:0}
.achpop .multi .orb:nth-child(2){animation-delay:.15s}.achpop .multi .orb:nth-child(3){animation-delay:.3s}.achpop .multi .orb:nth-child(4){animation-delay:.45s}
.achpop .medal svg{width:34px;height:34px}
.achpop b{display:block;font:800 21px/1.15 var(--font-display)}
.achpop small{display:block;margin-top:2px;color:var(--ink-soft);font-size:13.5px}
.achpop.t-platinum{box-shadow:0 0 0 3px #bdf2ff,0 0 40px rgba(120,220,255,.7),var(--shadow)}
.achpop.t-gold{box-shadow:0 0 0 3px #ffe680,0 0 40px rgba(255,200,0,.6),var(--shadow)}
.achpop.out{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-62%) scale(.92)}
@keyframes achin{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes medalin{0%{transform:rotateY(180deg) scale(.4)}70%{transform:rotateY(-15deg) scale(1.12)}100%{transform:none}}
/* Particularités : petites pastilles violettes sur l'avatar */
.orbw{position:relative;flex:none;display:inline-flex}
.cbadges{position:absolute;right:-7px;bottom:-5px;display:flex;gap:1px;z-index:1}
.cb{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #fff;
  background:radial-gradient(circle at 35% 30%,#fff 0 10%,#a77bff 45%,#5a2ee0);box-shadow:0 2px 5px rgba(70,20,180,.4)}
.cb svg{width:11px;height:11px;fill:#fff}
.cb.int{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#3ee6c8 45%,#00927a);box-shadow:0 2px 5px rgba(0,120,100,.45)}
.facts .intf,.ccond.cint{background:linear-gradient(180deg,#ecfffa,#c8f7ec);border-color:#b4efe0;color:#006b58}
.facts .intf dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#006b58}
.intf .cbadges,.cint .cbadges{position:static;display:inline-flex}
.k-interest{--dot:#14c4a6}
.cb.add{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffa54d 45%,#d65a00);box-shadow:0 2px 5px rgba(180,80,0,.45)}
.k-addict{--dot:#ff8a00}
.facts .condf,.ccond,.condnote{background:linear-gradient(180deg,#f6f0ff,#e6dbff);border-color:#e0d2ff;color:#4a1fb8}
.facts .condf dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#4a1fb8}
.condf .cbadges,.ccond .cbadges,.condnote .cbadges{position:static;display:inline-flex}
.ccond{margin:0;padding:3px 10px;border-radius:99px;font:700 12px var(--font-display);display:inline-flex;align-items:center;gap:5px;border:1px solid #e0d2ff}
.condnote{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:16px;font:700 14px var(--font-display);border:1px solid #e0d2ff}
/* Interrupteur « Famille autonome » */
.switch{display:flex;align-items:flex-start;gap:12px;margin-top:14px;cursor:pointer;text-align:left}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{flex:none;position:relative;width:46px;height:26px;border-radius:99px;border:1px solid #9cc8ec;
  background:linear-gradient(180deg,#dfeefa,#f6fbff);box-shadow:inset 0 2px 4px rgba(0,60,140,.2);transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 30%,#d8ecfb);box-shadow:0 2px 5px rgba(0,60,140,.35);transition:transform .2s}
.switch input:checked+.sw{background:linear-gradient(180deg,#eaff9c,#78e400 50%,#3aa600 51%,#78e400);border-color:#2b8700}
.switch input:checked+.sw::after{transform:translateX(20px)}
.switch input:focus-visible+.sw{outline:3px solid var(--sun);outline-offset:2px}
.switch b{display:block;font:800 14px var(--font-display)}
.switch small{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-soft)}
.switch.is-off{opacity:.6;cursor:default}
.cradle .multi{display:flex;flex:none}
.cradle .multi .orb{margin-left:-16px;animation:hop 1s ease-in-out infinite}
.cradle .multi .orb:first-child{margin-left:0}
.cradle .multi .orb:nth-child(2){animation-delay:.15s}.cradle .multi .orb:nth-child(3){animation-delay:.3s}.cradle .multi .orb:nth-child(4){animation-delay:.45s}
.cradle .multi .orb.cur{box-shadow:0 0 0 3px var(--lime),0 0 16px rgba(140,255,30,.7);z-index:1}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cradle.is-multi h2{background:linear-gradient(90deg,var(--magenta),var(--sun-deep),var(--lime-deep),var(--aqua-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.ctrls{display:flex;align-items:center;gap:8px;justify-self:end;flex-wrap:wrap;justify-content:flex-end}

.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.treebox{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tree-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.tree-head h2{margin:0;font:800 20px/1.1 var(--font-display);text-wrap:balance}
.cyn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:999px;background:linear-gradient(180deg,#fff,#e2fbf3);border:1px solid #fff;
  box-shadow:0 2px 8px rgba(0,110,90,.2),inset 0 -2px 4px rgba(0,140,110,.1);font:800 15px var(--font-display);color:#00876a;font-variant-numeric:tabular-nums}
.cyn svg{width:24px;height:24px;padding:3px;border-radius:50%;fill:#fff;background:radial-gradient(circle at 35% 30%,#c4fff0 0 10%,#14c9a0 55%,#00806a);box-shadow:inset 0 -2px 4px rgba(0,0,0,.15)}
.cyn.bump{animation:cynbump .5s cubic-bezier(.2,1.6,.4,1)}
.cyn.bump svg{animation:cynspin .7s ease}
.cynfx{position:fixed;z-index:44;display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 9px;border-radius:999px;background:rgba(255,255,255,.94);
  box-shadow:0 2px 10px rgba(0,110,90,.3);font:800 13px var(--font-display);color:#00876a;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);animation:cynfx 1.45s ease-out forwards}
.cynfx svg{width:15px;height:15px;fill:#00a37f}
@keyframes cynfx{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.06)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
.cynplus{position:absolute;left:100%;top:50%;margin:-9px 0 0 6px;font:800 13px var(--font-display);font-style:normal;color:#00a37f;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 #fff;animation:cynup 1.3s ease-out forwards}
@keyframes cynbump{35%{transform:scale(1.15)}}
@keyframes cynspin{to{transform:rotate(360deg)}}
@keyframes cynup{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
:root:is([data-skin="dark"],[data-skin="goth"]) .cyn,:root:is([data-skin="dark"],[data-skin="goth"]) .shopit,:root:is([data-skin="dark"],[data-skin="goth"]) .shopbal{background:linear-gradient(180deg,#26262b,#16161a);border-color:rgba(255,255,255,.14);color:#7ef0d0}
.tree-head .stats{color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
.tree-head .gel{min-height:34px;padding:6px 14px;font-size:13px}
.tree-head .zoomer{margin-left:auto}
.zoomer button{min-width:36px;min-height:32px;font-size:15px}
.zoomer #zoomPct{min-width:56px;font-size:13px}
.tree-scroll{flex:1;min-height:0;overflow:auto;cursor:grab;border-top:1px solid rgba(255,255,255,.8);
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%)}
.tree-scroll.grabbing{cursor:grabbing}
.tree-sizer{position:relative}
.tree-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.tree-canvas>svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.ln-wire-under{fill:none;stroke:rgba(0,90,200,.28);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.ln-wire{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ln-u{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ln-u.married{stroke:var(--sun-deep)}
.ln-u.dating{stroke:var(--magenta);stroke-dasharray:6 6}
.ln-u.ended{stroke:#9db7cf;stroke-dasharray:3 6}

/* Bulles de l'arbre */
.node{position:absolute;width:172px;height:140px;display:flex;flex-direction:column;gap:3px;padding:10px 10px 8px;border-radius:22px;text-align:center;cursor:pointer;
  border:1px solid #fff;background:linear-gradient(180deg,#ffffff 0%,#f2fbff 50%,#e2f4ff 100%);
  box-shadow:0 7px 16px rgba(0,70,160,.24),inset 0 1px 0 #fff,inset 0 -4px 10px rgba(0,150,255,.10);transition:transform .15s}
.node:hover{transform:translateY(-2px) scale(1.03)}
.node.partner{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(235,248,255,.78))}
.n-top{display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;min-width:0;max-width:100%}
.n-top .orb{width:40px;height:40px}
.nt{display:flex;flex-direction:column;min-width:0;line-height:1.15;overflow:hidden}
.nt b{font:800 14px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt span{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-life{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:12px;font-variant-numeric:tabular-nums}
.n-life b{font:800 12.5px var(--font-display)}
.n-city{display:flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-soft);min-width:0}
.n-city svg{flex:none;width:11px;height:11px;fill:currentColor}
.n-city span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-band{margin-top:auto;padding:3px 8px;border-radius:99px;font:700 11.5px/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(0,150,255,.13);color:var(--aqua-deep)}
.rib{position:absolute;top:-11px;padding:2px 8px;border-radius:99px;font:800 9.5px/1.4 var(--font-display);font-style:normal;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;z-index:6}
.rib.you{left:8px;color:#fff;background:linear-gradient(180deg,#eaff9c,#78e400 50%,#3aa600 51%,#78e400);border:1px solid #2b8700;text-shadow:0 1px 1px rgba(20,70,0,.5)}
.rib.st{right:8px;color:var(--gold-ink);background:linear-gradient(180deg,#fffbe0,#ffd84a 50%,#ffb300 51%,#ffe066);border:1px solid #d99a00}
.badge{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;
  background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff7ac8 40%,#d0006f);box-shadow:0 2px 6px rgba(160,0,80,.4)}
.badge svg{width:13px;height:13px;fill:#fff}
.node.dead{filter:grayscale(1);opacity:.62}
.node.active{box-shadow:0 0 0 3px var(--lime),0 0 24px 6px rgba(150,255,30,.7),0 7px 16px rgba(0,70,160,.24);animation:glow 2.4s ease-in-out var(--t,0s) infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--lime),0 0 34px 10px rgba(150,255,30,.45),0 7px 16px rgba(0,70,160,.24)}}
/* Star : bulle dorée, reflet qui balaie, petites étoiles qui scintillent */
.node.star{border-color:#fff6c8;background:linear-gradient(160deg,#fffbe6 0%,#ffe680 36%,#ffc61f 64%,#fff0a8 100%);
  box-shadow:0 0 0 2px #ffcf3a,0 0 20px 4px rgba(255,200,0,.5),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff}
.node.star::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.85) 48%,rgba(255,255,255,0) 60%);background-size:260% 100%;animation:shine 2.8s linear var(--t,0s) infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.node.star .nt span,.node.star .n-city{color:var(--gold-ink)}
.node.star .n-band{background:linear-gradient(180deg,#fff7c2,#ffcc1a);color:var(--gold-ink);box-shadow:inset 0 1px 0 #fff}
.tw{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 3px #ffd000);animation:twinkle 1.8s ease-in-out var(--t,0s) infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.node.famous{box-shadow:0 0 0 3px #ffcf3a,0 0 30px 10px rgba(255,195,0,.65),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff;animation:fame 2.2s ease-in-out var(--t,0s) infinite}
@keyframes fame{50%{box-shadow:0 0 0 3px #ffe680,0 0 44px 16px rgba(255,215,0,.5),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff}}
.node.fresh{animation:fresh .7s ease-in-out infinite}
@keyframes fresh{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-2deg)}}
.node.dead.star{filter:grayscale(.55);opacity:.8}
/* Maladie mortelle : bulle rouge qui pulse */
.node.ill{border-color:#ffd6d6;background:linear-gradient(180deg,#fff3f3 0%,#ffc4c4 55%,#ff9696 100%);
  box-shadow:0 0 0 2px var(--red),0 0 18px 4px rgba(255,40,50,.45),0 7px 16px rgba(150,0,20,.25);animation:sick 1.8s ease-in-out var(--t,0s) infinite}
@keyframes sick{50%{box-shadow:0 0 0 2px var(--red),0 0 28px 8px rgba(255,40,50,.3),0 7px 16px rgba(150,0,20,.25)}}
.node.ill .n-band{background:linear-gradient(180deg,#ff6b78,#d4001e);color:#fff;text-shadow:0 1px 1px rgba(90,0,10,.5)}
.node.ill .nt span,.node.ill .n-city{color:#8a1020}
/* criminel gravement malade : on garde le fond sombre pour que tout reste lisible */
.node.crim.ill{background:linear-gradient(160deg,#5a0010 0%,#24000a 46%,#7a0018 100%);color:#ffe6e8}
.node.crim.ill .nt span,.node.crim.ill .n-city{color:#ffb3bb}
.node.crim.ill .n-life{color:#ffd0d4}
/* Maladie bénigne : bulle rouge pâle, sans danger immédiat */
.node.mild{border-color:#ffd3d8;box-shadow:0 0 0 1.5px rgba(255,130,145,.55),0 7px 16px rgba(0,60,140,.16)}
.rib.sick{top:auto;bottom:-10px;left:8px;color:#c0394a;background:linear-gradient(180deg,#fff6f7,#ffdfe3);border:1px solid #ffb3bd;font-size:9px}
.facts .pinkf{background:linear-gradient(180deg,#fff7f7,#ffe6e6);border-color:#ffd3d3}
.facts .pinkf dd{color:#b8323f}

.orb{--o1:var(--male-1);--o2:var(--male-2);position:relative;flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 36% 26%,#fff 0 6%,var(--o1) 42%,var(--o2) 100%);box-shadow:inset 0 -5px 9px rgba(0,0,0,.2),0 3px 7px rgba(0,40,120,.28)}
.orb.f{--o1:var(--female-1);--o2:var(--female-2)}
.orb.gold{--o1:#ffe04a;--o2:#d98a00}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb::after{content:"";position:absolute;left:14%;right:14%;top:3%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.orb.lg{width:64px;height:64px}
.orb.xl{width:78px;height:78px}

/* Panneau latéral */
.side{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0;overflow:auto;padding:2px 4px 4px 2px}
.eyebrow{font:800 11.5px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--aqua-deep)}
.me-head{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0 14px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.me-head h3{margin:0;font:800 22px/1.1 var(--font-display);text-wrap:balance}
.me-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.facts div{padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid #fff;box-shadow:inset 0 -2px 6px rgba(0,140,255,.08);min-width:0}
.facts dt{font:700 10.5px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.facts dd{margin:3px 0 0;font:800 15px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .span2{grid-column:1/-1}
.facts .red{background:linear-gradient(180deg,#fff0f0,#ffd2d2);border-color:#ffc0c0}
.facts .red dd{color:var(--red-deep)}
.facts .goldf{background:linear-gradient(180deg,#fffbe0,#ffe680);border-color:#ffe48a}
.facts .goldf dd{color:var(--gold-ink)}
.side .hint{margin-top:8px;text-align:center}
.pcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px;border-radius:18px;cursor:pointer;text-align:left;
  border:1px solid #fff;background:linear-gradient(180deg,#fff,#ffeef8);box-shadow:0 5px 14px rgba(200,0,110,.16),inset 0 1px 0 #fff;transition:transform .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard b{display:block;font:800 16px var(--font-display)}
.pcard span{display:block;font-size:13px;color:var(--ink-soft)}
.pcard em{display:block;margin-top:3px;font-style:normal;font:700 12px var(--font-display);color:var(--magenta-deep)}
.preg{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.preg-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.preg-top b{font-family:var(--font-display);color:var(--magenta-deep)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid #fff;box-shadow:inset 0 1px 3px rgba(150,0,80,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#ffd0ea,#ff3aa2 50%,#d4006f 51%,#ff3aa2)}
.journal{display:flex;flex-direction:column;min-height:240px;flex:1}
.journal ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1}
.journal li{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;font-size:13.5px;line-height:1.4}
.journal li i,.toast i{width:10px;height:10px;margin-top:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,var(--dot) 55%);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.journal time,.toast time{display:block;font:700 11px var(--font-display);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.journal p,.toast p{margin:0;min-width:0}
.k-birth{--dot:var(--lime)} .k-death{--dot:#5f7890} .k-love{--dot:var(--magenta)} .k-wed{--dot:var(--sun-deep)}
.k-break{--dot:var(--violet)} .k-sad{--dot:#4a6cff} .k-world{--dot:var(--aqua)} .k-info{--dot:#9ab}
.k-ill{--dot:var(--red)} .k-cure{--dot:#00d6a0} .k-star{--dot:#ffc400} .k-work{--dot:#62a8d8} .k-move{--dot:#7b9e3a}

/* Modales */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,70,170,.28);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.modal{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;outline:none;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
/* La croix reste en haut de la fenêtre quand on fait défiler */
.modal>.x{position:sticky;top:0;float:right;z-index:6;width:46px;min-height:46px;margin:-8px -8px 4px 10px;
  box-shadow:0 4px 12px rgba(0,60,150,.3),inset 0 1px 0 #fff}
.couple-acts{grid-template-columns:1fr 1fr}
.couple-acts .full{grid-column:1/-1}
.relocate summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;min-height:28px}
.relocate summary::-webkit-details-marker{display:none}
.relocate summary::before{content:'▸';font-size:13px;color:var(--aqua-deep)}
.relocate[open] summary::before{content:'▾'}
.relocate[open] summary{margin-bottom:8px}
.relocate[open]{display:flex;flex-direction:column;gap:6px}
.ver{margin:6px 0 0;text-align:center;font:700 10.5px var(--font-display);letter-spacing:.05em;color:var(--ink-faint)}
.verlink{display:block;width:100%;border:0;background:none;padding:4px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.verlink:hover{color:var(--aqua-deep)}
.pn{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid #fff}
.pn+.pn{margin-top:10px}
.pn h3{margin:0 0 6px;font:800 17px var(--font-display);color:var(--aqua-deep)}
.pn h3 small{font-weight:700;font-size:12px;color:var(--ink-faint)}
.pn ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.m-head{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;padding-right:44px}
.m-head h2{margin:0;font:800 26px/1.15 var(--font-display);text-wrap:balance}
.m-head p{margin:2px 0 0;color:var(--ink-soft)}
.who{display:flex;gap:16px;align-items:center;margin-bottom:16px;padding-right:44px}
.who h2{margin:0;font:800 24px/1.1 var(--font-display);text-wrap:balance}
.who h2 .pen{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:8px;padding:0;vertical-align:3px;border:1px solid rgba(255,255,255,.9);border-radius:50%;background:linear-gradient(180deg,#fff,#e4f3ff);box-shadow:0 2px 6px rgba(20,70,140,.18);color:var(--ink-soft,#3a5a80);cursor:pointer;transition:transform .15s}
.who h2 .pen:hover{transform:scale(1.12)}
.who h2 .pen svg{width:14px;height:14px;fill:currentColor}
.who .rename{display:flex;gap:6px;align-items:center}
.who .rename .inp{flex:1;min-width:0;font-size:16px}
.who .rename .gel{flex:none;min-height:38px}
.who p{margin:4px 0 0;color:var(--ink-soft)}
.seekrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seekrow .pills button{padding:0 14px}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.cand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:16px 12px 14px;border-radius:20px;border:1px solid #fff;
  background:linear-gradient(180deg,#fff 0%,#f0faff 55%,#dff2ff 100%);box-shadow:0 8px 18px rgba(0,70,160,.2),inset 0 1px 0 #fff;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.cand:nth-child(2){animation-delay:.05s}.cand:nth-child(3){animation-delay:.1s}
.cand.f{background:linear-gradient(180deg,#fff 0%,#fff0f8 55%,#ffe0f1 100%)}
.cand h3{margin:6px 0 0;font:800 18px/1.15 var(--font-display)}
.cand h3 span{font-weight:500;font-size:15px;color:var(--ink-soft)}
.cand .cage{margin:0;font:800 22px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
.cand.f .cage{color:var(--magenta-deep)}
.cand .cjob{margin:0;font-weight:700}
.cand .cborn{margin:0 0 6px;font-size:12.5px;color:var(--ink-soft)}
.cand .gel{margin-top:auto;width:100%}
.m-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.acts{display:grid;gap:10px;margin-top:4px}
.act{display:flex;flex-direction:column;gap:5px}
.note{margin:0;font-size:12.5px;color:var(--ink-soft);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;border:1px solid #fff;background:rgba(255,255,255,.75);cursor:pointer;font:700 13px var(--font-display);box-shadow:0 2px 6px rgba(0,70,160,.15)}
.chip .orb{width:22px;height:22px}
.chip.dead{filter:grayscale(1);opacity:.7}
.sect{margin:14px 0 8px}
.ulist{margin:0;padding-left:18px;color:var(--ink-soft);font-size:13.5px;line-height:1.5}
.heirs{display:grid;gap:8px;margin-top:12px}

.custom{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.toasts{position:fixed;z-index:45;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));display:flex;flex-direction:column-reverse;gap:8px;width:min(320px,calc(100% - 32px));pointer-events:none}

.toast.k-ill{background:linear-gradient(180deg,#fff3f3,#ffd0d0)}
.toast.out{transition:opacity .35s,transform .35s;opacity:0;transform:translateX(-30px)}

/* ---------- Thème Dark : gothique (débloqué après 10 meurtres) ---------- */
:root[data-skin="goth"]{color-scheme:dark;--sky-top:#030008;--sky-mid:#0e0316;--sky-low:#240a22;--sky-haze:#3a0c1c;
  --ink:#f1e8f5;--ink-soft:#bfa9c8;--ink-faint:#86718e;--aqua:#b14cff;--aqua-deep:#d690ff;--magenta-deep:#ff6b8a;
  --glass-hi:rgba(28,12,34,.92);--glass-lo:rgba(8,3,12,.9);--glass-edge:rgba(196,140,255,.2);
  --g1:#e0b0ff;--g2:#7d22c2;--g3:#3b0a62;--gedge:#1f0336;
  --lcd-a:#2b0f36;--lcd-b:#10031a;--lcd-c:#040007;--lcd-d:#1e0829;--lcd-edge:#000;--lcd-glow:rgba(200,110,255,.9);
  --hill-a1:#1e0a24;--hill-a2:#0b030f;--hill-a3:#000;--hill-b1:#16061a;--hill-b2:#000;--shadow:0 14px 36px rgba(0,0,0,.8);
  --font-display:"Cinzel","M PLUS Rounded 1c",Georgia,serif}
:root[data-skin="goth"] .glass{background:linear-gradient(180deg,rgba(30,12,36,.93) 0%,rgba(14,5,18,.92) 55%,rgba(6,2,9,.9) 100%);border-color:rgba(196,140,255,.24);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,220,255,.12),inset 0 0 0 3px rgba(0,0,0,.35),inset 0 0 0 4px rgba(150,40,90,.25),inset 0 -14px 30px rgba(140,0,50,.16)}
:root[data-skin="goth"] .sky-sun{top:30px;right:70px;width:170px;height:170px;
  background:radial-gradient(circle at 42% 40%,#fbf3ff 0 30%,#dacbe8 40%,rgba(190,150,230,.28) 52%,rgba(0,0,0,0) 68%);filter:drop-shadow(0 0 30px rgba(200,170,255,.45))}
:root[data-skin="goth"] .logo{font-family:"UnifrakturMaguntia","Cinzel",serif;font-weight:400;letter-spacing:0;
  background:linear-gradient(180deg,#ffffff 0%,#d8c8e6 45%,#c0203f 55%,#5a0018 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.85)) drop-shadow(0 0 16px rgba(190,40,90,.45))}
:root[data-skin="goth"] .logo span{background:linear-gradient(180deg,#f7eaff 0%,#c8a8e6 45%,#8a2be2 55%,#3b0a62 100%);-webkit-background-clip:text;background-clip:text}
:root[data-skin="goth"] .node{border-color:rgba(196,140,255,.28)}
.gothfx{position:absolute;inset:0;display:none;overflow:hidden}
:root[data-skin="goth"] .gothfx{display:block}
body.no-deco .gothfx .bat{display:none}
.gothfx .fog{position:absolute;left:-30%;right:-30%;bottom:-5%;height:55vh;opacity:.9;
  background:radial-gradient(ellipse 40% 50% at 25% 85%,rgba(130,90,160,.28),rgba(0,0,0,0) 70%),radial-gradient(ellipse 45% 45% at 70% 90%,rgba(110,40,90,.25),rgba(0,0,0,0) 70%);
  animation:fogdrift 38s ease-in-out infinite alternate}
.gothfx .fog.f2{bottom:10%;opacity:.55;animation-duration:52s;animation-direction:alternate-reverse}
@keyframes fogdrift{to{transform:translateX(14%)}}
.gothfx .bat{position:absolute;left:-12vw;top:var(--y);width:var(--w);animation:batfly var(--d) linear infinite;animation-delay:var(--dl)}
.gothfx .bat svg{display:block;width:100%;fill:#05000a;filter:drop-shadow(0 0 3px rgba(190,120,255,.5));animation:flap .28s ease-in-out infinite alternate}
@keyframes batfly{0%{transform:translate(0,0)}25%{transform:translate(32vw,-5vh)}50%{transform:translate(62vw,3vh)}75%{transform:translate(92vw,-4vh)}100%{transform:translate(126vw,0)}}
@keyframes flap{to{transform:scaleY(.35)}}
.skin.sk-goth i{background:radial-gradient(circle at 72% 30%,#f7efff 0 11%,rgba(0,0,0,0) 14%),linear-gradient(180deg,#030008,#1a0626 55%,#5a0f2e)}
</style>
