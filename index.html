<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cyngenetic : fondez une lignée en 1780 et suivez-la sur des siècles.">
<meta name="theme-color" content="#14a6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyngenetic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Cyngenetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout : ciel saturé + collines vertes en fond ; barre de verre en haut avec l'horloge « LCD » et la décennie ;
   arbre à gauche, panneau latéral de verre à droite (empilés sur téléphone). Un seul look lumineux, assumé. */
:root{
  --sky-top:#0062ec; --sky-mid:#14a6ff; --sky-low:#7fe3ff; --sky-haze:#e4fff4;
  --aqua:#00b4ff; --aqua-deep:#0059c9;
  --lime:#74e600; --lime-deep:#2c9200;
  --magenta:#ff2f9c; --magenta-deep:#c10067;
  --sun:#ffcc00; --sun-deep:#ff8a00; --gold-ink:#7a4600;
  --red:#ff2d3d; --red-deep:#b5001a;
  --violet:#8a5cff;
  --ink:#05305a; --ink-soft:#3d6c96; --ink-faint:#7f9fbd;
  --glass-hi:rgba(255,255,255,.86); --glass-lo:rgba(236,250,255,.56); --glass-edge:rgba(255,255,255,.96);
  --male-1:#3fd0ff; --male-2:#0070e0;
  --female-1:#ff6cc0; --female-2:#cc0070;
  --shadow:0 14px 34px rgba(0,64,160,.28);
  --g1:#9af4ff; --g2:#00b8ff; --g3:#0074dc; --gedge:#005bbd;
  --lcd-a:#3ea0ff; --lcd-b:#0058d0; --lcd-c:#00399a; --lcd-d:#0b6be8; --lcd-edge:#00307e; --lcd-glow:rgba(120,235,255,.95);
  --hill-a1:#b4ff40; --hill-a2:#5ed400; --hill-a3:#1f8a00; --hill-b1:#8af01e; --hill-b2:#1d7a00;
  --font-display:"M PLUS Rounded 1c","Segoe UI","Frutiger","Myriad Pro",system-ui,sans-serif;
  --font-body:"Istok Web","Segoe UI","Frutiger","Myriad Pro",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-body); font-size:15px; color:var(--ink);
  background:var(--sky-mid) linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 30%,var(--sky-low) 58%,var(--sky-haze) 82%) fixed;
  overflow-x:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- Décor ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky-sun{position:absolute;top:-170px;right:-120px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1) 0 7%,rgba(255,252,200,.85) 13%,rgba(255,236,110,.32) 30%,rgba(255,255,255,0) 60%)}
.flare{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0) 55%,rgba(255,255,255,.35) 70%,rgba(255,255,255,0) 72%)}
.swoosh{position:absolute;left:-5%;width:110%;top:14%;height:48%}
.hills{position:absolute;left:0;bottom:0;width:100%;height:36vh;min-height:190px}
.bubble{position:absolute;bottom:-90px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.28) 20%,rgba(140,230,255,.14) 58%,rgba(255,255,255,.6) 100%);
  box-shadow:inset 0 0 12px rgba(255,255,255,.55);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(34px,-58vh)}100%{transform:translate(-12px,-118vh)}}

/* ---------- Verre & gel ---------- */
.glass{position:relative;background:linear-gradient(180deg,var(--glass-hi) 0%,rgba(255,255,255,.62) 46%,var(--glass-lo) 100%);
  border:1px solid var(--glass-edge);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 #fff,inset 0 -10px 24px rgba(0,170,255,.10);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
.gel{--c1:var(--g1);--c2:var(--g2);--c3:var(--g3);--edge:var(--gedge);--txt:#fff;--ts:rgba(0,40,110,.55);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 20px;
  border-radius:999px;border:1px solid var(--edge);color:var(--txt);cursor:pointer;overflow:hidden;
  font:700 15px/1.1 var(--font-display);letter-spacing:.01em;text-shadow:0 1px 2px var(--ts);
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 49%,var(--c3) 51%,var(--c2) 100%);
  box-shadow:0 5px 14px rgba(0,80,190,.32),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.14);
  transition:transform .12s ease,filter .15s ease;user-select:none}
.gel::before{content:"";position:absolute;left:7%;right:7%;top:2px;height:46%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.12));pointer-events:none}
.gel>*{position:relative;z-index:1}
.gel svg{width:18px;height:18px;fill:currentColor;filter:drop-shadow(0 1px 1px var(--ts))}
.gel:hover:not(:disabled){filter:brightness(1.08) saturate(1.2);transform:translateY(-1px)}
.gel:active:not(:disabled){transform:translateY(1px) scale(.98)}
.gel:disabled{filter:grayscale(.9) opacity(.55);cursor:not-allowed}
.gel.lime{--c1:#eaff9c;--c2:#78e400;--c3:#3aa600;--edge:#2b8700;--ts:rgba(20,70,0,.55)}
.gel.pink{--c1:#ffc0e2;--c2:#ff3aa2;--c3:#d4006f;--edge:#a80058;--ts:rgba(110,0,50,.5)}
.gel.gold{--c1:#fff6a8;--c2:#ffc800;--c3:#ff9500;--edge:#d97300;--ts:rgba(120,60,0,.5)}
.gel.ghost{--c1:#ffffff;--c2:#eef9ff;--c3:#d4ecff;--edge:#9cc8ec;--txt:var(--ink);--ts:rgba(255,255,255,.9)}
.gel.round{width:42px;min-height:42px;padding:0}
.gel.wide{width:100%}
.gel.big{min-height:50px;font-size:17px;padding:12px 28px}
.gel.armed{--c1:#ffd0d0;--c2:#ff4d4d;--c3:#d10000;--edge:#a00000}
.pills{display:flex;padding:3px;gap:3px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid #fff;box-shadow:inset 0 1px 3px rgba(0,60,140,.2)}
.pills button{min-width:40px;min-height:34px;padding:0 8px;border:0;border-radius:999px;background:transparent;cursor:pointer;font:800 14px var(--font-display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pills button[aria-pressed="true"]{color:#fff;text-shadow:0 1px 2px rgba(0,40,110,.5);background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 49%,var(--g3) 51%,var(--g2) 100%);box-shadow:0 2px 6px rgba(0,80,190,.35),inset 0 1px 0 rgba(255,255,255,.8)}

/* ---------- Écran de départ ---------- */
.setup{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup-inner{width:100%;max-width:580px;display:flex;flex-direction:column;gap:18px}
.setup-top{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.logo{margin:0;font:800 clamp(56px,13vw,96px)/.95 var(--font-display);letter-spacing:-.02em;text-align:center;
  background:linear-gradient(180deg,#ffffff 0%,#e9fbff 46%,#7fdcff 52%,#00a2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,70,170,.55)) drop-shadow(0 10px 18px rgba(0,60,160,.35))}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand .emblem{flex:none;width:clamp(56px,13vw,84px);height:auto;filter:drop-shadow(0 6px 12px rgba(0,60,160,.35));animation:embfloat 5s ease-in-out infinite}
@keyframes embfloat{50%{transform:translateY(-4px) rotate(-3deg)}}
.brand .logo{font-size:clamp(38px,9.5vw,72px);line-height:1.2;padding-bottom:.06em}
.logo span{background:linear-gradient(180deg,#f6ffd8 0%,#dcff80 46%,#7be000 52%,#3aa600 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand.small{justify-content:flex-start;gap:8px}
.brand.small .emblem{width:38px;animation:none}
.brand.small .logo{font-size:30px;line-height:1.25}
.tag{margin:6px auto 0;max-width:34ch;text-align:center;color:#fff;font:500 17px/1.4 var(--font-display);text-wrap:balance;text-shadow:0 1px 3px rgba(0,50,140,.5)}
.card{padding:20px}
.form{display:flex;flex-direction:column;gap:16px}
.form h2{margin:0;font:800 21px/1.2 var(--font-display)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font:700 12px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.inp{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid #9fcdf0;background:linear-gradient(180deg,#f3fbff,#fff);
  box-shadow:inset 0 2px 4px rgba(0,80,160,.14);font:700 16px var(--font-body);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--aqua);box-shadow:inset 0 2px 4px rgba(0,80,160,.14),0 0 0 3px rgba(0,180,255,.35)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segs input{position:absolute;opacity:0;pointer-events:none}
.segs label{display:block;cursor:pointer}
.segs .seg{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:16px;border:1px solid #a9d3f2;
  background:linear-gradient(180deg,#fff,#e6f5ff);font:700 16px var(--font-display);color:var(--ink-soft);transition:all .15s}
.segs input:focus-visible+.seg{outline:3px solid var(--sun);outline-offset:2px}
.segs input:checked+.seg.f{color:#fff;border-color:var(--female-2);background:linear-gradient(180deg,#ffc6e6 0%,#ff4aac 49%,#d6007a 51%,#ff4aac 100%);text-shadow:0 1px 2px rgba(110,0,50,.5)}
.segs input:checked+.seg.m{color:#fff;border-color:var(--male-2);background:linear-gradient(180deg,#b6f2ff 0%,#14b4ff 49%,#0072dc 51%,#14b4ff 100%);text-shadow:0 1px 2px rgba(0,40,110,.5)}
.dob{display:grid;grid-template-columns:80px 1fr 100px;gap:10px}
.agebox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:linear-gradient(180deg,rgba(0,170,255,.12),rgba(0,170,255,.04));border:1px solid rgba(0,150,255,.25)}
.agebox .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.agebox b{font:800 26px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--aqua)}
.err{margin:0;padding:10px 14px;border-radius:12px;background:#ffe3ef;color:#a3004f;font-weight:700}
.form-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.form-actions .gel.big{flex:1 1 220px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.resume p{margin:0;min-width:0}
.resume b{font-family:var(--font-display)}
.hint{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.45}

/* ---------- Jeu ---------- */
.game{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:14px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:10px 14px;border-radius:24px}
.topbar .logo{font-size:38px;text-align:left;filter:drop-shadow(0 2px 0 rgba(0,70,170,.5))}
.clock{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.lcd{position:relative;overflow:hidden;min-width:300px;padding:7px 26px;border-radius:999px;text-align:center;border:1px solid var(--lcd-edge);
  background:linear-gradient(180deg,var(--lcd-a) 0%,var(--lcd-b) 49%,var(--lcd-c) 51%,var(--lcd-d) 100%);
  box-shadow:0 6px 16px rgba(0,50,150,.4),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(0,220,255,.35)}
.lcd::before{content:"";position:absolute;left:5%;right:5%;top:1px;height:46%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.lcd span{position:relative;font:800 25px/1.15 var(--font-display);color:#fff;letter-spacing:.01em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px var(--lcd-glow),0 1px 2px rgba(0,30,90,.6);white-space:nowrap}
.lcd.flash{animation:flash .6s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(160,255,60,.9),0 6px 16px rgba(0,50,150,.4)}100%{box-shadow:0 0 0 14px rgba(160,255,60,0),0 6px 16px rgba(0,50,150,.4)}}
.clock-sub{display:flex;align-items:center;gap:10px;width:100%;max-width:300px}
.yearbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 3px rgba(0,60,140,.25);overflow:hidden}
.yearbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#e6ff9a,#7be000 50%,#3eaa00 51%,#7be000)}
.rate{font:700 12px var(--font-display);color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.rate.paused{color:var(--magenta-deep)}
.decade{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:3px 14px 3px 3px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid #fff;
  box-shadow:0 3px 8px rgba(0,70,160,.15);font:700 12.5px/1.2 var(--font-display);color:var(--ink)}
.decade .di{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#fff 0 8%,#ff6cc0 40%,#c4006b);box-shadow:inset 0 -2px 4px rgba(0,0,0,.2)}
.decade .di svg{width:14px;height:14px;fill:#fff}
.decade span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.decade b{color:var(--magenta-deep)}
.decade.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.era{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.warb{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 8px;border-radius:99px;font:800 12px/1.2 var(--font-display);color:#fff;
  background:linear-gradient(180deg,#ff8f97 0%,#ff2d3d 49%,#c80018 51%,#ff2d3d 100%);border:1px solid #9a0012;text-shadow:0 1px 1px rgba(90,0,10,.5);
  box-shadow:0 3px 10px rgba(200,0,20,.35);animation:warpulse 1.6s ease-in-out infinite}
.warb svg{width:13px;height:13px;fill:#fff}
@keyframes warpulse{50%{box-shadow:0 0 0 4px rgba(255,45,61,.25),0 3px 10px rgba(200,0,20,.35)}}
.autob.on{--c1:#eaff9c;--c2:#78e400;--c3:#3aa600;--edge:#2b8700;--txt:#fff;--ts:rgba(20,70,0,.55);animation:autoglow 1.8s ease-in-out infinite}
@keyframes autoglow{50%{box-shadow:0 0 0 4px rgba(140,255,30,.35),0 5px 14px rgba(0,80,190,.32)}}
/* Thèmes de couleur (Paramètres) */
:root[data-skin="orange"]{--sky-top:#ff5a00;--sky-mid:#ff9a2e;--sky-low:#ffd27a;--sky-haze:#fff3d9;--aqua:#ff8a00;--aqua-deep:#c04800;
  --g1:#ffe2a8;--g2:#ff9a1f;--g3:#e25b00;--gedge:#b34700;--lcd-a:#ffb050;--lcd-b:#e86400;--lcd-c:#b84500;--lcd-d:#ff8a1f;--lcd-edge:#8a3300;--lcd-glow:rgba(255,230,150,.95);
  --shadow:0 14px 34px rgba(170,70,0,.28)}
:root[data-skin="vapor"]{--sky-top:#00c8ff;--sky-mid:#4fe3ff;--sky-low:#ff8be4;--sky-haze:#ffd9f6;--aqua:#00c8ff;--aqua-deep:#b0008a;
  --g1:#b8fbff;--g2:#00d4ff;--g3:#00a0c8;--gedge:#0089a8;--lcd-a:#ff7ad8;--lcd-b:#d4009e;--lcd-c:#9e0077;--lcd-d:#ff2fc0;--lcd-edge:#7a005c;--lcd-glow:rgba(255,180,245,.95);
  --hill-a1:#ffa3f0;--hill-a2:#c43cff;--hill-a3:#6a00b8;--hill-b1:#e070ff;--hill-b2:#5a00a0;--shadow:0 14px 34px rgba(120,0,140,.28)}
/* Carte de France */
.mapview{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:12px;border-top:1px solid rgba(255,255,255,.8)}
.mapwrap{position:relative;width:min(100%,620px);display:flex;flex-direction:column;gap:8px}
.francemap{width:100%;height:auto;border-radius:24px;box-shadow:0 10px 26px rgba(0,60,150,.25),inset 0 1px 0 #fff;cursor:zoom-in}
.francemap{touch-action:pan-y}
.francemap.zoomed{cursor:grab;touch-action:none}
.tree-scroll{touch-action:pan-x pan-y}
.maplegend.hl{color:var(--aqua-deep)}
.francemap.grabbing{cursor:grabbing}
.mapctl{position:absolute;top:10px;right:10px}
.mapctl button{min-width:36px;min-height:32px;font-size:16px}
.francemap .unklab{font-size:12px;fill:var(--ink-soft)}
.francemap text{font-family:var(--font-display);font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.francemap .mn{font-size:12px;fill:#003a8c;stroke-width:2.5px}
.francemap .mlab{font-size:11px;fill:var(--ink)}
.mdot-in{transform-box:fill-box;transform-origin:center;transition:opacity .6s,transform .6s}
.mdot-in.pop{animation:dotin .6s cubic-bezier(.2,1.6,.4,1)}
.mdot-in.gone{opacity:0;transform:scale(.2)}
.mdot-in .mring{fill:none;stroke:var(--lime);stroke-width:3;animation:ringpulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dotin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ringpulse{50%{transform:scale(1.25);opacity:.4}}
.maplegend{margin:0;text-align:center;font:700 13px var(--font-display);color:var(--ink-soft)}
.tree-head #viewSw{margin-left:auto}
.tree-head #viewSw:not([hidden])~.zoomer{margin-left:0}
/* Couteau du meurtre */
.knifefx{position:fixed;z-index:75;width:0;height:0;pointer-events:none}
.knifefx .knife{position:absolute;left:-30px;top:-30px;width:60px;height:60px;animation:stab .9s cubic-bezier(.3,1.4,.5,1) forwards}
.knifefx .knife svg{width:100%;height:100%;fill:#e9eef5;filter:drop-shadow(0 0 2px #000) drop-shadow(0 3px 6px rgba(0,0,0,.5))}
@keyframes stab{0%{transform:translate(70px,-80px) rotate(40deg) scale(.6);opacity:0}35%{transform:translate(0,0) rotate(-8deg) scale(1.1);opacity:1}
  45%{transform:translate(-4px,4px) rotate(-12deg) scale(1.05)}55%{transform:translate(3px,-3px) rotate(-6deg)}80%{opacity:1}100%{transform:translate(0,0) rotate(-8deg);opacity:0}}
.knifefx .slash{position:absolute;left:-55px;top:-3px;width:110px;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(200,0,20,0),#ff1a2e,rgba(200,0,20,0));
  transform:rotate(-35deg) scaleX(0);animation:slash .5s .3s ease-out forwards;box-shadow:0 0 12px #ff0020}
.knifefx .slash.s2{transform:rotate(35deg) scaleX(0);animation-delay:.42s}
.knifefx .s2{--rot:35deg}
@keyframes slash{0%{transform:rotate(var(--rot,-35deg)) scaleX(0);opacity:1}60%{transform:rotate(var(--rot,-35deg)) scaleX(1);opacity:1}100%{transform:rotate(var(--rot,-35deg)) scaleX(1);opacity:0}}
.knifefx .drop{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50% 50% 50% 0;background:#c4001e;opacity:0;animation:drop .8s .35s ease-out forwards}
@keyframes drop{0%{transform:rotate(var(--a)) translateX(0) scale(.5);opacity:1}100%{transform:rotate(var(--a)) translateX(var(--r)) scale(1);opacity:0}}
.node.stabbed{animation:stabbed .5s .3s ease-in-out 2}
@keyframes stabbed{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
/* Âme sœur : âge souhaité · Déménager */
.seekage{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid #fff}
.seekage output{font:800 14px var(--font-display);color:var(--magenta-deep)}
.seekage-row{display:flex;align-items:center;gap:10px}
.seekage-row input{flex:1;min-width:0}
.seekage-row .gel{min-height:34px;padding:6px 14px;font-size:13px}
.relocate{padding:12px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid #fff}
.reloc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){ .reloc-row{grid-template-columns:1fr} }
/* Thème Nuit : ciel bleu nuit étoilé, lune, panneaux bleutés */
:root[data-skin="night"]{--sky-top:#030824;--sky-mid:#0c1d55;--sky-low:#22428f;--sky-haze:#4d6fb8;--aqua:#3ad1ff;--aqua-deep:#1a5fc9;
  --g1:#9fc2ff;--g2:#3d6cff;--g3:#2140c4;--gedge:#16309a;--lcd-a:#2b3f8f;--lcd-b:#0d1a52;--lcd-c:#060d36;--lcd-d:#1c2f78;--lcd-edge:#020722;--lcd-glow:rgba(110,220,255,.95);
  --hill-a1:#2f8a7a;--hill-a2:#145a5a;--hill-a3:#0a2c3a;--hill-b1:#1f5f6f;--hill-b2:#0a2232;
  --glass-hi:rgba(226,236,255,.86);--glass-lo:rgba(196,214,250,.66);--shadow:0 14px 34px rgba(0,0,40,.5)}
:root[data-skin="night"] .sky-sun{top:40px;right:60px;width:150px;height:150px;
  background:radial-gradient(circle at 40% 40%,#ffffff 0 30%,#e6efff 42%,rgba(200,220,255,.35) 55%,rgba(255,255,255,0) 70%);box-shadow:0 0 80px rgba(180,210,255,.4)}
:root[data-skin="night"] .flare,:root[data-skin="night"] .swoosh{opacity:.25}
:root[data-skin="night"] .bubble{opacity:.35}
.nightfx{position:absolute;inset:0;display:none}
:root[data-skin="night"] .nightfx{display:block}
.nightfx i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 6px #cfe3ff;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
:root[data-skin="night"] .logo{background:linear-gradient(180deg,#ffffff 0%,#e3f0ff 46%,#7fd0ff 52%,#3a7dff 100%);-webkit-background-clip:text;background-clip:text}
/* Thème Or (à débloquer) : tout brille, paillettes dorées */
:root[data-skin="gold"]{--sky-top:#9a6400;--sky-mid:#e6a400;--sky-low:#ffd75a;--sky-haze:#fff6d0;--aqua:#e0a000;--aqua-deep:#8a5a00;
  --g1:#fff6b0;--g2:#ffc800;--g3:#d48a00;--gedge:#9a6000;--lcd-a:#ffe680;--lcd-b:#d99a00;--lcd-c:#a06800;--lcd-d:#ffc21a;--lcd-edge:#6e4500;--lcd-glow:rgba(255,245,180,.95);
  --hill-a1:#fff0a0;--hill-a2:#e8b000;--hill-a3:#9a6a00;--hill-b1:#ffd84a;--hill-b2:#8a5a00;--shadow:0 14px 34px rgba(140,90,0,.32)}
:root[data-skin="gold"] .glass{border-color:#fff1b0;box-shadow:var(--shadow),inset 0 1px 0 #fff,0 0 22px rgba(255,200,0,.35),inset 0 -10px 24px rgba(255,190,0,.14)}
:root[data-skin="gold"] .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,245,200,.45) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;animation:shine 6s linear infinite}
:root[data-skin="gold"] .logo{background:linear-gradient(180deg,#fffef0 0%,#fff2b0 45%,#ffc61a 52%,#c88400 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 rgba(120,70,0,.55)) drop-shadow(0 0 16px rgba(255,210,60,.6))}
:root[data-skin="gold"] .logo span{background:linear-gradient(180deg,#ffffff 0%,#fff6c8 46%,#ffd84a 52%,#e09a00 100%);-webkit-background-clip:text;background-clip:text}
:root[data-skin="gold"] .bubble{background:radial-gradient(circle at 32% 28%,#fff 0 9%,rgba(255,236,150,.5) 22%,rgba(255,200,40,.2) 60%,rgba(255,240,180,.7) 100%)}
.goldfx{position:absolute;inset:0;display:none}
:root[data-skin="gold"] .goldfx{display:block}
.gp{position:absolute;width:var(--s);height:var(--s);background:#fff8d0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 4px #ffcc00);animation:gdrift var(--d) ease-in-out infinite,twinkle 1.8s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes gdrift{0%,100%{translate:0 0}50%{translate:20px -40px}}
body.no-deco .goldfx{display:none}
.skin.sk-gold i{display:grid;place-items:center;background:linear-gradient(180deg,#9a6400,#e6a400 45%,#ffd75a 70%,#fff0a0);box-shadow:inset 0 2px 6px rgba(255,255,255,.7),0 0 12px rgba(255,200,0,.6)}
.skin.locked{opacity:.6;cursor:not-allowed;filter:grayscale(.6)}
.skin.locked i{display:grid;place-items:center}
.tree-scroll,.mapview,.node,.topbar{-webkit-user-select:none;user-select:none}       /* pas de surlignage bleu en glissant */
.skin.locked i svg{width:18px;height:18px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.locknote{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-soft)}
body.no-deco .bubble{display:none}
/* Onglets Paramètres & Personnalisation */
.setlist,.custlist{display:flex;flex-direction:column;gap:6px}
.setlist .switch,.custlist .switch{margin-top:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(0,90,200,.1)}
.setrow.col{flex-direction:column;align-items:stretch;gap:8px}
.setrow b{font:800 14px var(--font-display)}
.setrow small{display:block;font-size:12.5px;color:var(--ink-soft)}
.setrow>span{min-width:0;flex:1 1 200px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowhead output{font:800 14px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
.skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.skin.sk-night i{background:radial-gradient(circle at 75% 30%,#f4f8ff 0 8%,rgba(255,255,255,0) 10%),linear-gradient(180deg,#050c2e,#13286b 50%,#2d4fa8 72%,#0f4a4a)}
@media (max-width:640px){ .skins{grid-template-columns:repeat(3,minmax(0,1fr))} }
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:16px;border:2px solid #fff;background:rgba(255,255,255,.7);cursor:pointer;font:700 12.5px var(--font-display);color:var(--ink)}
.skin i{width:100%;height:34px;border-radius:12px;box-shadow:inset 0 2px 6px rgba(255,255,255,.7)}
.skin.sk-aqua i{background:linear-gradient(180deg,#0062ec,#14a6ff 50%,#7fe3ff 70%,#5ed400)}
.skin.sk-orange i{background:linear-gradient(180deg,#ff5a00,#ff9a2e 50%,#ffd27a 70%,#5ed400)}
.skin.sk-vapor i{background:linear-gradient(180deg,#00c8ff,#4fe3ff 45%,#ff8be4 70%,#c43cff)}
.skin[aria-pressed="true"]{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(0,180,255,.3)}
@media (max-width:520px){ .skins{grid-template-columns:1fr 1fr} }
/* Criminels : bulle rouge et noire, lueur sombre ; une fois révélés, des flammes */
.node.crim{border-color:#7a0012;color:#ffe6e8;background:linear-gradient(160deg,#3a0008 0%,#12000a 46%,#5c0012 100%);
  box-shadow:0 0 0 2px #b0001a,0 0 18px 4px rgba(200,0,30,.45),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,80,90,.35);animation:dark 3.2s ease-in-out infinite}
.node.crim::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(0,0,0,0) 35%,rgba(255,30,50,.35) 48%,rgba(0,0,0,0) 60%);background-size:260% 100%;animation:shine 3.8s linear infinite}
@keyframes dark{50%{box-shadow:0 0 0 2px #ff1a3a,0 0 30px 8px rgba(255,0,40,.35),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,80,90,.35)}}
.node.crim .nt span,.node.crim .n-city{color:#ff9aa5}
.node.crim .n-life{color:#ffd0d4}
.node.crim .n-band{background:linear-gradient(180deg,#4a0008,#1a0003);color:#ff6b78;border:1px solid #7a0012}
.flames{position:absolute;width:196px;height:80px;pointer-events:none;
  background:radial-gradient(ellipse 13% 85% at 12% 100%,#ffb000 0,#ff3b1f 35%,rgba(255,0,0,0) 75%),radial-gradient(ellipse 15% 100% at 33% 100%,#ff7a00 0,#d4001e 45%,rgba(0,0,0,0) 78%),
    radial-gradient(ellipse 17% 115% at 52% 100%,#ffd000 0,#ff2a00 32%,#b3001b 58%,rgba(0,0,0,0) 80%),radial-gradient(ellipse 14% 95% at 72% 100%,#ff8a00 0,#c4001e 42%,rgba(0,0,0,0) 76%),
    radial-gradient(ellipse 12% 80% at 90% 100%,#ffb000 0,#ff3b1f 35%,rgba(255,0,0,0) 75%),radial-gradient(ellipse 55% 70% at 50% 100%,#1a0003 0,rgba(26,0,3,.6) 40%,rgba(0,0,0,0) 75%);
  filter:blur(1.5px) drop-shadow(0 0 8px rgba(255,60,0,.7));transform-origin:50% 100%;animation:flame .16s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.82) skewX(-4deg);opacity:.85}to{transform:scaleY(1.15) skewX(4deg);opacity:1}}
.node.crim.dead{filter:grayscale(.7);opacity:.75}
.rib.cr{right:8px;color:#ff8f99;background:linear-gradient(180deg,#3a0008,#12000a);border:1px solid #b0001a}
.rib.sk{right:8px;color:#a0005a;background:linear-gradient(180deg,#fff3fb,#ffd0ea 50%,#ffb3dc 51%,#ffe2f2);border:1px solid #ff8cc6}
.node.starkid{box-shadow:0 0 0 2px #ffb3dc,0 0 14px rgba(255,120,200,.45),0 7px 16px rgba(0,70,160,.24),inset 0 1px 0 #fff}
.facts .crf{background:linear-gradient(180deg,#3a0008,#12000a);border-color:#7a0012}
.facts .crf dt{color:#ff9aa5}.facts .crf dd{color:#fff}
.facts .skf{background:linear-gradient(180deg,#fff3fb,#ffd9ee);border-color:#ffc4e3}.facts .skf dd{color:#a0005a}
.k-crime{--dot:#b0001a} .k-ach{--dot:#ffb300}
/* Succès */
.achcat{margin-top:4px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 4px 10px rgba(0,70,160,.12)}
.ach.locked{opacity:.5;filter:grayscale(.95)}
.ach b{font:800 13.5px/1.2 var(--font-display)}
.ach small{font-size:12px;line-height:1.35;color:var(--ink-soft)}
.ach em{font-style:normal;font:700 11px var(--font-display);color:var(--lime-deep)}
.ach.locked em{color:var(--ink-faint)}
.medal{--m1:#e7a35c;--m2:#8a4b14;--m3:#f3c48f;position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,#fff 0 8%,var(--m1) 42%,var(--m2));border:2px solid var(--m3);box-shadow:inset 0 -4px 8px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.2)}
.medal svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.medal::after{content:"";position:absolute;left:12%;right:12%;top:4%;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.t-silver{--m1:#e9eef3;--m2:#7d8a98;--m3:#fff}
.t-gold{--m1:#ffe066;--m2:#c98a00;--m3:#fff3a8}
.t-platinum{--m1:#e6fbff;--m2:#4fb0d0;--m3:#fff}
.t-special{--m1:#c3a2ff;--m2:#5a2ee0;--m3:#ece2ff}
.achpop{position:fixed;left:50%;top:30%;z-index:80;transform:translate(-50%,-50%);display:flex;align-items:center;gap:16px;width:min(420px,calc(100% - 32px));
  padding:16px 22px;border-radius:26px;pointer-events:none;animation:achin .55s cubic-bezier(.2,1.4,.4,1)}
.achpop .medal{width:70px;height:70px;animation:medalin .9s ease}
.achpop .multi{display:flex;flex:none}
.achpop .multi .orb{width:48px;height:48px;margin-left:-14px;animation:hop 1s ease-in-out infinite}
.achpop .multi .orb:first-child{margin-left:0}
.achpop .multi .orb:nth-child(2){animation-delay:.15s}.achpop .multi .orb:nth-child(3){animation-delay:.3s}.achpop .multi .orb:nth-child(4){animation-delay:.45s}
.achpop .medal svg{width:34px;height:34px}
.achpop b{display:block;font:800 21px/1.15 var(--font-display)}
.achpop small{display:block;margin-top:2px;color:var(--ink-soft);font-size:13.5px}
.achpop.t-platinum{box-shadow:0 0 0 3px #bdf2ff,0 0 40px rgba(120,220,255,.7),var(--shadow)}
.achpop.t-gold{box-shadow:0 0 0 3px #ffe680,0 0 40px rgba(255,200,0,.6),var(--shadow)}
.achpop.out{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-62%) scale(.92)}
@keyframes achin{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes medalin{0%{transform:rotateY(180deg) scale(.4)}70%{transform:rotateY(-15deg) scale(1.12)}100%{transform:none}}
/* Particularités : petites pastilles violettes sur l'avatar */
.orbw{position:relative;flex:none;display:inline-flex}
.cbadges{position:absolute;right:-7px;bottom:-5px;display:flex;gap:1px;z-index:1}
.cb{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid #fff;
  background:radial-gradient(circle at 35% 30%,#fff 0 10%,#a77bff 45%,#5a2ee0);box-shadow:0 2px 5px rgba(70,20,180,.4)}
.cb svg{width:11px;height:11px;fill:#fff}
.cb.int{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#3ee6c8 45%,#00927a);box-shadow:0 2px 5px rgba(0,120,100,.45)}
.facts .intf,.ccond.cint{background:linear-gradient(180deg,#ecfffa,#c8f7ec);border-color:#b4efe0;color:#006b58}
.facts .intf dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#006b58}
.intf .cbadges,.cint .cbadges{position:static;display:inline-flex}
.k-interest{--dot:#14c4a6}
.cb.add{background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffa54d 45%,#d65a00);box-shadow:0 2px 5px rgba(180,80,0,.45)}
.k-addict{--dot:#ff8a00}
.facts .condf,.ccond,.condnote{background:linear-gradient(180deg,#f6f0ff,#e6dbff);border-color:#e0d2ff;color:#4a1fb8}
.facts .condf dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#4a1fb8}
.condf .cbadges,.ccond .cbadges,.condnote .cbadges{position:static;display:inline-flex}
.ccond{margin:0;padding:3px 10px;border-radius:99px;font:700 12px var(--font-display);display:inline-flex;align-items:center;gap:5px;border:1px solid #e0d2ff}
.condnote{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:16px;font:700 14px var(--font-display);border:1px solid #e0d2ff}
/* Interrupteur « Famille autonome » */
.switch{display:flex;align-items:flex-start;gap:12px;margin-top:14px;cursor:pointer;text-align:left}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{flex:none;position:relative;width:46px;height:26px;border-radius:99px;border:1px solid #9cc8ec;
  background:linear-gradient(180deg,#dfeefa,#f6fbff);box-shadow:inset 0 2px 4px rgba(0,60,140,.2);transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 30%,#d8ecfb);box-shadow:0 2px 5px rgba(0,60,140,.35);transition:transform .2s}
.switch input:checked+.sw{background:linear-gradient(180deg,#eaff9c,#78e400 50%,#3aa600 51%,#78e400);border-color:#2b8700}
.switch input:checked+.sw::after{transform:translateX(20px)}
.switch input:focus-visible+.sw{outline:3px solid var(--sun);outline-offset:2px}
.switch b{display:block;font:800 14px var(--font-display)}
.switch small{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-soft)}
.switch.is-off{opacity:.6;cursor:default}
.cradle .multi{display:flex;flex:none}
.cradle .multi .orb{margin-left:-16px;animation:hop 1s ease-in-out infinite}
.cradle .multi .orb:first-child{margin-left:0}
.cradle .multi .orb:nth-child(2){animation-delay:.15s}.cradle .multi .orb:nth-child(3){animation-delay:.3s}.cradle .multi .orb:nth-child(4){animation-delay:.45s}
.cradle .multi .orb.cur{box-shadow:0 0 0 3px var(--lime),0 0 16px rgba(140,255,30,.7);z-index:1}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cradle.is-multi h2{background:linear-gradient(90deg,var(--magenta),var(--sun-deep),var(--lime-deep),var(--aqua-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.ctrls{display:flex;align-items:center;gap:8px;justify-self:end;flex-wrap:wrap;justify-content:flex-end}

.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.treebox{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tree-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.tree-head h2{margin:0;font:800 20px/1.1 var(--font-display);text-wrap:balance}
.tree-head .stats{color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
.tree-head .gel{min-height:34px;padding:6px 14px;font-size:13px}
.tree-head .zoomer{margin-left:auto}
.zoomer button{min-width:36px;min-height:32px;font-size:15px}
.zoomer #zoomPct{min-width:56px;font-size:13px}
.tree-scroll{flex:1;min-height:0;overflow:auto;cursor:grab;border-top:1px solid rgba(255,255,255,.8);

.tree-scroll.grabbing{cursor:grabbing}
.tree-sizer{position:relative;margin:0 auto}
.tree-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.tree-canvas>svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.ln-wire-under{fill:none;stroke:rgba(0,90,200,.28);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.ln-wire{fill:none;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}

/* Bulles de l'arbre */
.node{position:absolute;width:172px;height:140px;display:flex;flex-direction:column;gap:3px;padding:10px 10px 8px;border-radius:22px;text-align:center;cursor:pointer;
  border:1px solid #fff;background:linear-gradient(180deg,#ffffff 0%,#f2fbff 50%,#e2f4ff 100%);
  box-shadow:0 7px 16px rgba(0,70,160,.24),inset 0 1px 0 #fff,inset 0 -4px 10px rgba(0,150,255,.10);transition:transform .15s}
.node:hover{transform:translateY(-2px) scale(1.03)}
.node.partner{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(235,248,255,.78))}
.n-top{display:flex;align-items:center;gap:8px;text-align:left;min-width:0}
.n-top .orb{width:40px;height:40px}
.nt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.nt b{font:800 14px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt span{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-life{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:12px;font-variant-numeric:tabular-nums}
.n-life b{font:800 12.5px var(--font-display)}
.n-city{display:flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-soft);min-width:0}
.n-city svg{flex:none;width:11px;height:11px;fill:currentColor}
.n-city span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-band{margin-top:auto;padding:3px 8px;border-radius:99px;font:700 11.5px/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(0,150,255,.13);color:var(--aqua-deep)}
.rib{position:absolute;top:-11px;padding:2px 8px;border-radius:99px;font:800 9.5px/1.4 var(--font-display);font-style:normal;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;z-index:2}
.rib.you{left:8px;color:#fff;background:linear-gradient(180deg,#eaff9c,#78e400 50%,#3aa600 51%,#78e400);border:1px solid #2b8700;text-shadow:0 1px 1px rgba(20,70,0,.5)}
.rib.st{right:8px;color:var(--gold-ink);background:linear-gradient(180deg,#fffbe0,#ffd84a 50%,#ffb300 51%,#ffe066);border:1px solid #d99a00}
.badge{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;
  background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff7ac8 40%,#d0006f);box-shadow:0 2px 6px rgba(160,0,80,.4)}
.badge svg{width:13px;height:13px;fill:#fff}
.node.dead{filter:grayscale(1);opacity:.62}
.node.active{box-shadow:0 0 0 3px var(--lime),0 0 24px 6px rgba(150,255,30,.7),0 7px 16px rgba(0,70,160,.24);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--lime),0 0 34px 10px rgba(150,255,30,.45),0 7px 16px rgba(0,70,160,.24)}}
/* Star : bulle dorée, reflet qui balaie, petites étoiles qui scintillent */
.node.star{border-color:#fff6c8;background:linear-gradient(160deg,#fffbe6 0%,#ffe680 36%,#ffc61f 64%,#fff0a8 100%);
  box-shadow:0 0 0 2px #ffcf3a,0 0 20px 4px rgba(255,200,0,.5),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff}
.node.star::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.85) 48%,rgba(255,255,255,0) 60%);background-size:260% 100%;animation:shine 2.8s linear infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.node.star .nt span,.node.star .n-city{color:var(--gold-ink)}
.node.star .n-band{background:linear-gradient(180deg,#fff7c2,#ffcc1a);color:var(--gold-ink);box-shadow:inset 0 1px 0 #fff}
.tw{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 3px #ffd000);animation:twinkle 1.8s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.node.famous{box-shadow:0 0 0 3px #ffcf3a,0 0 30px 10px rgba(255,195,0,.65),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff;animation:fame 2.2s ease-in-out infinite}
@keyframes fame{50%{box-shadow:0 0 0 3px #ffe680,0 0 44px 16px rgba(255,215,0,.5),0 8px 18px rgba(160,100,0,.3),inset 0 1px 0 #fff}}
.node.fresh{animation:fresh .7s ease-in-out infinite}
@keyframes fresh{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-2deg)}}
.node.dead.star{filter:grayscale(.55);opacity:.8}
/* Maladie mortelle : bulle rouge qui pulse */
.node.ill{border-color:#ffd6d6;background:linear-gradient(180deg,#fff3f3 0%,#ffc4c4 55%,#ff9696 100%);
  box-shadow:0 0 0 2px var(--red),0 0 18px 4px rgba(255,40,50,.45),0 7px 16px rgba(150,0,20,.25);animation:sick 1.8s ease-in-out infinite}
@keyframes sick{50%{box-shadow:0 0 0 2px var(--red),0 0 28px 8px rgba(255,40,50,.3),0 7px 16px rgba(150,0,20,.25)}}
.node.ill .n-band{background:linear-gradient(180deg,#ff6b78,#d4001e);color:#fff;text-shadow:0 1px 1px rgba(90,0,10,.5)}
.node.ill .nt span,.node.ill .n-city{color:#8a1020}

.orb{--o1:var(--male-1);--o2:var(--male-2);position:relative;flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 36% 26%,#fff 0 6%,var(--o1) 42%,var(--o2) 100%);box-shadow:inset 0 -5px 9px rgba(0,0,0,.2),0 3px 7px rgba(0,40,120,.28)}
.orb.f{--o1:var(--female-1);--o2:var(--female-2)}
.orb.gold{--o1:#ffe04a;--o2:#d98a00}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb::after{content:"";position:absolute;left:14%;right:14%;top:3%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.orb.lg{width:64px;height:64px}
.orb.xl{width:78px;height:78px}

/* Panneau latéral */
.side{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0;overflow:auto;padding:2px 4px 4px 2px}
.eyebrow{font:800 11.5px var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--aqua-deep)}
.me-head{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0 14px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.me-head h3{margin:0;font:800 22px/1.1 var(--font-display);text-wrap:balance}
.me-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.facts div{padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.62);border:1px solid #fff;box-shadow:inset 0 -2px 6px rgba(0,140,255,.08);min-width:0}
.facts dt{font:700 10.5px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.facts dd{margin:3px 0 0;font:800 15px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .span2{grid-column:1/-1}
.facts .red{background:linear-gradient(180deg,#fff0f0,#ffd2d2);border-color:#ffc0c0}
.facts .red dd{color:var(--red-deep)}
.facts .goldf{background:linear-gradient(180deg,#fffbe0,#ffe680);border-color:#ffe48a}
.facts .goldf dd{color:var(--gold-ink)}
.side .hint{margin-top:8px;text-align:center}
.pcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px;border-radius:18px;cursor:pointer;text-align:left;
  border:1px solid #fff;background:linear-gradient(180deg,#fff,#ffeef8);box-shadow:0 5px 14px rgba(200,0,110,.16),inset 0 1px 0 #fff;transition:transform .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard b{display:block;font:800 16px var(--font-display)}
.pcard span{display:block;font-size:13px;color:var(--ink-soft)}
.pcard em{display:block;margin-top:3px;font-style:normal;font:700 12px var(--font-display);color:var(--magenta-deep)}
.preg{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.preg-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.preg-top b{font-family:var(--font-display);color:var(--magenta-deep)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid #fff;box-shadow:inset 0 1px 3px rgba(150,0,80,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,#ffd0ea,#ff3aa2 50%,#d4006f 51%,#ff3aa2)}
.journal{display:flex;flex-direction:column;min-height:240px;flex:1}
.journal ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1}
.journal li{display:grid;grid-template-columns:12px 1fr;gap:9px;align-items:start;font-size:13.5px;line-height:1.4}
.journal li i,.toast i{width:10px;height:10px;margin-top:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,var(--dot) 55%);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.journal time,.toast time{display:block;font:700 11px var(--font-display);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.journal p,.toast p{margin:0;min-width:0}
.k-birth{--dot:var(--lime)} .k-death{--dot:#5f7890} .k-love{--dot:var(--magenta)} .k-wed{--dot:var(--sun-deep)}
.k-break{--dot:var(--violet)} .k-sad{--dot:#4a6cff} .k-world{--dot:var(--aqua)} .k-info{--dot:#9ab}
.k-ill{--dot:var(--red)} .k-cure{--dot:#00d6a0} .k-star{--dot:#ffc400} .k-work{--dot:#62a8d8} .k-move{--dot:#7b9e3a}

/* Modales */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,70,170,.28);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.modal{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;outline:none;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:12px;right:12px}
.m-head{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;padding-right:44px}
.m-head h2{margin:0;font:800 26px/1.15 var(--font-display);text-wrap:balance}
.m-head p{margin:2px 0 0;color:var(--ink-soft)}
.who{display:flex;gap:16px;align-items:center;margin-bottom:16px;padding-right:44px}
.who h2{margin:0;font:800 24px/1.1 var(--font-display);text-wrap:balance}
.who p{margin:4px 0 0;color:var(--ink-soft)}
.seekrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seekrow .pills button{padding:0 14px}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.cand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:16px 12px 14px;border-radius:20px;border:1px solid #fff;
  background:linear-gradient(180deg,#fff 0%,#f0faff 55%,#dff2ff 100%);box-shadow:0 8px 18px rgba(0,70,160,.2),inset 0 1px 0 #fff;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.cand:nth-child(2){animation-delay:.05s}.cand:nth-child(3){animation-delay:.1s}
.cand.f{background:linear-gradient(180deg,#fff 0%,#fff0f8 55%,#ffe0f1 100%)}
.cand h3{margin:6px 0 0;font:800 18px/1.15 var(--font-display)}
.cand h3 span{font-weight:500;font-size:15px;color:var(--ink-soft)}
.cand .cage{margin:0;font:800 22px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
.cand.f .cage{color:var(--magenta-deep)}
.cand .cjob{margin:0;font-weight:700}
.cand .cborn{margin:0 0 6px;font-size:12.5px;color:var(--ink-soft)}
.cand .gel{margin-top:auto;width:100%}
.m-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.acts{display:grid;gap:10px;margin-top:4px}
.act{display:flex;flex-direction:column;gap:5px}
.note{margin:0;font-size:12.5px;color:var(--ink-soft);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;border:1px solid #fff;background:rgba(255,255,255,.75);cursor:pointer;font:700 13px var(--font-display);box-shadow:0 2px 6px rgba(0,70,160,.15)}
.chip .orb{width:22px;height:22px}
.chip.dead{filter:grayscale(1);opacity:.7}
.sect{margin:14px 0 8px}
.ulist{margin:0;padding-left:18px;color:var(--ink-soft);font-size:13.5px;line-height:1.5}
.heirs{display:grid;gap:8px;margin-top:12px}
.heir{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:1px solid #fff;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,#fff,#eaf7ff);box-shadow:0 5px 12px rgba(0,70,160,.18);transition:transform .15s}
.heir:hover{transform:translateX(4px)}
.heir b{display:block;font:800 16px var(--font-display)}
.heir small{color:var(--ink-soft);font-size:13px}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
.bigstats div{padding:12px;border-radius:16px;text-align:center;background:rgba(255,255,255,.7);border:1px solid #fff}
.bigstats b{display:block;font:800 28px var(--font-display);color:var(--aqua-deep);font-variant-numeric:tabular-nums}
.bigstats span{font-size:12px;color:var(--ink-soft)}
/* Naissance : choix du prénom */
.cradle{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.cradle h2{margin:0;font:800 28px/1.1 var(--font-display)}
.cradle p{margin:6px 0 0;color:var(--ink-soft)}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.names .gel{min-height:54px;font-size:18px}
.custom{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.custom .inp{flex:1 1 180px}
.starnote{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:16px;font:700 14px var(--font-display);color:var(--gold-ink);
  background:linear-gradient(180deg,#fffbe0,#ffe27a);border:1px solid #ffe48a;box-shadow:0 0 18px rgba(255,200,0,.45)}

.toasts{position:fixed;z-index:45;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:max(28px,calc(env(safe-area-inset-left,0px) + 16px));display:flex;flex-direction:column-reverse;gap:8px;width:min(320px,calc(100% - 32px));pointer-events:none}
.toast{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.35;animation:slidein .35s cubic-bezier(.2,1.3,.4,1)}
.toast.k-star{background:linear-gradient(180deg,#fffbe0,#ffe27a);border-color:#ffe48a}
.toast.k-ill{background:linear-gradient(180deg,#fff3f3,#ffd0d0)}
.toast.out{transition:opacity .35s,transform .35s;opacity:0;transform:translateX(-30px)}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.spark{position:fixed;z-index:70;pointer-events:none;border-radius:50%}

/* ---------- Téléphone : en-tête compact (logo + date sur une ligne, commandes qui défilent) ---------- */
@media (max-width:700px){
  .topbar{grid-template-columns:auto minmax(0,1fr) !important;gap:8px;padding:8px 10px;border-radius:20px}
  .topbar .brand{grid-row:1;grid-column:1}
  .topbar .brand.small .emblem{width:34px}
  .clock{grid-row:1 !important;grid-column:2 !important;gap:4px}
  .lcd{padding:5px 12px}
  .lcd span{font-size:17px}
  .decade{font-size:11px}
  .ctrls{grid-column:1/-1;justify-self:stretch;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
  .ctrls::-webkit-scrollbar{display:none}
  .ctrls>*{flex:none}
}
@media (max-width:520px){ .topbar .brand.small .logo{display:none} }
@media (max-width:1100px){ .topbar{grid-template-columns:auto minmax(0,1fr);gap:10px} .ctrls{min-width:0} .clock{grid-column:1/-1;grid-row:2;justify-self:stretch} .lcd{min-width:0;width:100%} .clock-sub{max-width:none} }
/* ---------- Téléphone : un écran à la fois, barre de navigation en bas ---------- */
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:4px;border-radius:22px 22px 0 0;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.mnav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;border-radius:16px;
  background:none;cursor:pointer;font:800 11.5px var(--font-display);color:var(--ink-soft)}
.mnav button svg{width:24px;height:24px;fill:currentColor}
.mnav button[aria-pressed="true"]{color:#fff;text-shadow:0 1px 2px rgba(0,40,110,.5);
  background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 49%,var(--g3) 51%,var(--g2) 100%);box-shadow:0 3px 8px rgba(0,80,190,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.mbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--magenta);color:#fff;
  font:800 10px/18px var(--font-display);text-align:center;box-shadow:0 0 0 2px #fff}
@media (max-width:900px){
  .game{gap:10px;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .mnav{display:flex}
  .board{display:flex;flex-direction:column;flex:1;min-height:0}
  .treebox,.side{flex:1;min-height:0}
  .side{overflow:auto}
  body[data-mtab="tree"] .side,body[data-mtab="map"] .side{display:none}
  body[data-mtab="me"] .treebox,body[data-mtab="journal"] .treebox{display:none}
  body[data-mtab="me"] .side .journal{display:none}
  body[data-mtab="journal"] .side>section:not(.journal){display:none}
  .tree-head #viewSw{display:none}
  .tree-head{padding:10px 12px 8px;gap:8px}
  .tree-head h2{font-size:17px}
  .toasts{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 24px))}
  .toasts .toast:nth-child(n+3){display:none}
  .pills button{min-height:38px}
  .gel{min-height:42px}
  .overlay{padding:8px}
  .modal{padding:18px}
  .achpop{top:38%}
}
@media (max-width:520px){
  .row2{grid-template-columns:1fr}
  .dob{grid-template-columns:70px 1fr 88px}
  .topbar .logo{font-size:30px}
  .lcd span{font-size:21px}
  .bigstats b{font-size:22px}
  .names,.cands{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .bubble{display:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sky-sun"></div>
  <div class="flare" style="top:150px;right:330px;width:90px;height:90px"></div>
  <div class="flare" style="top:290px;right:500px;width:40px;height:40px"></div>
  <svg class="swoosh" viewBox="0 0 1440 400" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sw1" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="sw2" x1="0" x2="1"><stop offset="0" stop-color="#b6ff3c" stop-opacity="0"/><stop offset=".55" stop-color="#d8ff7a" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M0 260 C 360 120 760 330 1440 110 L1440 140 C 780 350 380 160 0 290 Z" fill="url(#sw1)"/>

  </svg>
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hill-a1)"/><stop offset=".45" style="stop-color:var(--hill-a2)"/><stop offset="1" style="stop-color:var(--hill-a3)"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hill-b1)"/><stop offset="1" style="stop-color:var(--hill-b2)"/></linearGradient>
    </defs>
    <path d="M0 170 C 260 70 520 80 760 160 C 1000 240 1220 110 1440 140 L1440 320 L0 320 Z" fill="url(#h2)"/>
    <path d="M0 236 C 320 160 600 196 860 246 C 1080 290 1280 214 1440 222 L1440 320 L0 320 Z" fill="url(#h1)"/>

    <path d="M60 160 C 280 84 500 90 700 150" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div id="bubbles"></div>
  <div class="goldfx" id="goldfx"></div>
  <div class="nightfx" id="nightfx"></div>
</div>

<!-- ============ Écran de départ ============ -->
<section id="setup" class="setup">

  if(!out.length && Math.random() < R.conds/100) out.push(pick(CONDS)[0]);
  return out;
}

/* Probabilités de décès (sur toute la tranche d'âge), converties en risque annuel */
const BRACKETS = [[0,16,.004],[17,30,.015],[31,50,.043],[51,65,.071],[66,75,.18],[76,80,.29],
                  [81,85,.35],[86,90,.49],[91,96,.65],[97,104,.84],[105,120,.95]];
function yearlyRisk(a, p){
  if(a>=121) return 1;
  const b = BRACKETS.find(b => a>=b[0] && a<=b[1]);
  const r = 1 - Math.pow(1-b[2], 1/(b[1]-b[0]+1));
  return p && p.star ? r/2 : r;   // une star a une belle vie
}

const sfx = (() => {

    const delay = ctx.createDelay(), fb = ctx.createGain(), wet = ctx.createGain();
    delay.delayTime.value = .17; fb.gain.value = .3; wet.gain.value = .22;
    master.connect(ctx.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
    return ctx;

    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, tt + (o.glide || dur));

    gn.gain.setValueAtTime(.0001,tt); gn.gain.exponentialRampToValueAtTime(v, tt + (o.att || .008)); gn.gain.exponentialRampToValueAtTime(.0001, tt + dur);

    init, get muted(){ return muted; }, setMuted(m){ muted = m; }, setVolume(v){ vol = v; if(master) master.gain.value = .55 * v; },
    click(){ note(1046,0,.09,{to:1568,vol:.06}); note(2093,0,.05,{vol:.02,type:'triangle'}); },
    open(){ note(420,0,.2,{to:980,glide:.12,vol:.08}); note(1318,.06,.22,{vol:.035,type:'triangle'}); },

/* ================= Musique douce en boucle (devient tendue tant qu'un criminel est en vie) ================= */
const music = (() => {
  let ctx = null, out = null, lp = null, timer = null, step = 0, next = 0, mode = 'calm', vol = .35, on = true;
  const CALM = {bpm:66, chords:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]], mel:[72,74,76,79,81,84,86]};   // Do maj7 · La m7 · Fa maj7 · Sol
  const TENSE = {bpm:92, chords:[[45,52,60,64],[41,48,57,60],[38,45,53,57],[40,47,56,59]], mel:[69,71,72,75,76,80,81]};  // La m · Fa · Ré m · Mi
  const mtof = m => 440 * Math.pow(2, (m-69)/12);
  function tone(f, t, dur, type, v, att){
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.value = f;
    gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(v, t + att); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(lp); o.start(t); o.stop(t + dur + .1);
  }
  function play(s, t){
    const cfg = mode === 'tense' ? TENSE : CALM, beat = 60/cfg.bpm/2, ch = cfg.chords[Math.floor(s/8) % 4];
    if(s % 8 === 0) ch.forEach(m => { tone(mtof(m), t, beat*8.6, 'sine', .04, 1.2); tone(mtof(m)*1.004, t, beat*8.6, 'triangle', .016, 1.5); });
    if(mode === 'tense'){
      tone(mtof(ch[0]-12), t, beat*.9, 'triangle', .07, .01);                       // basse qui martèle
      if(s % 2) tone(mtof(ch[0]), t, beat*.45, 'square', .01, .005);
      if(Math.random() < .3) tone(mtof(pick(cfg.mel)), t, beat*2, 'sine', .03, .01);
    } else {
      if(s % 2 === 0 && Math.random() < .5) tone(mtof(pick(cfg.mel)), t, beat*5, 'sine', .032, .01);   // petites notes de carillon
      if(s % 8 === 4 && Math.random() < .5) tone(mtof(ch[1]+12), t, beat*4, 'triangle', .014, .3);
    }
  }
  function tick(){
    if(!ctx) return;
    while(next < ctx.currentTime + .4){ play(step, next); next += 60/(mode === 'tense' ? TENSE : CALM).bpm/2; step++; }
  }
  function stop(){ if(timer){ clearInterval(timer); timer = null; } }
  function ensure(){
    if(!on || vol <= 0 || document.hidden){ stop(); return; }
    if(timer) return;
    ctx = sfx.ctx(); if(!ctx) return;
    if(!out){ out = ctx.createGain(); lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(out); out.connect(ctx.destination); }
    out.gain.value = vol; next = ctx.currentTime + .15; timer = setInterval(tick, 120);
  }
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); else if(ctx) ensure(); });
  return {
    ensure, stop,
    setVolume(v){ vol = v; if(out) out.gain.value = v; if(ctx) ensure(); },
    setOn(b){ on = b; if(ctx) ensure(); },
    setMode(m){
      if(m === mode) return;
      mode = m; step = Math.ceil(step/8)*8;
      if(lp) lp.frequency.setTargetAtTime(m === 'tense' ? 1400 : 2200, ctx.currentTime, .5);
    }
  };
})();

function setupWork(p, day){             // pour un adulte qui arrive dans la partie (fondateur, conjoint)
  const A = ageAt(p, day), y = yearOf(day);
  if(A < 18) return;
  if(A >= p.retireAge){ p.work = {s:'retired'}; return; }

    p.work = {s:'odd', until: day + (p.firstJobAge - A)*365 + rnd(0,200)}; return;

  if(A >= p.retireAge){ const was = w.s; p.work = {s:'retired'}; if(was==='job' || was==='unemp') log('work','retired',[p.id],day); return; }

/* ================= Mécanique ================= */
function scheduleYear(p, A, day){
  if(A >= (R.oldAge ? 121 : 150)){ die(p, day, {old:true}); return; }      // sans mort de vieillesse : maximum 150 ans
  if(p.ill || p.onset!=null || p.deathAt!=null) return;
  const war = warAt(day), r = baseRisk(p, A) * (war ? 1.35 : 1);           // guerre : +35 % de mortalité
  if(Math.random() < r){
    const when = day + rnd(1,360);
    if(war && Math.random() < .65){ p.deathAt = Math.min(when, war.b); p.warDeath = true; return; }   // surtout des morts de guerre
    if(A > 80 && R.oldAge){ p.deathAt = when; return; }                   // au-delà de 80 ans : vieillesse
    if(R.diseases){ p.onset = when; return; }                             // sinon : maladie ou accident
  }
  if(A >= R.legal) for(const id of addictsOf(p)){                          // addictions : risque annuel en plus
    if(Math.random() < addRisk(id, A)){ p.onset = day + rnd(1,360); p.onsetAddict = id; return; }
  }
}
function baseRisk(p, A){
  if(A > 80 && R.oldAge) return yearlyRisk(A, p);
  if(!R.diseases) return 0;
  return yearlyRisk(A > 80 ? 78 : A, p) * R.illness/100 * (sporty(p) ? .5 : 1);   // curseur « maladies » ; sportifs : risque ÷ 2
}
const riskOf = p => { const A = age(p); return Math.min(1, baseRisk(p, A) + (A >= R.legal ? addictsOf(p).reduce((s,id) => s + addRisk(id, A), 0) : 0)); };
function contract(p, day){
  p.onset = null;
  const aid = p.onsetAddict === true ? addictsOf(p)[0] : p.onsetAddict;
  const own = aid ? DISEASES.filter(x => x[9] && x[9].addict === aid) : [];
  const d = own.length ? pick(own) : pickDisease(p, day);
  p.onsetAddict = false;
  p.ill = {dz:d[0], start:day, end: day + rnd(d[6], d[7]), cure: Math.random() < d[8]};
  log('ill','ill',[p.id, d[0]], day); sfx.ill();
}
function die(p, day, cause){
  if(p.death != null) return;
  const A = ageAt(p, day);
  p.death = day; p.deathAt = null; p.onset = null; p.warDeath = false; p.murderAt = null; p.deathCity = p.city;
  p.cause = Object.assign({}, cause);
  if(inFamily(p)){ if(A >= 121) unlock('maxage'); if(A < 10) unlock('young'); }
  if(cause.murder){
    const k = P(cause.murder); k.kills = (k.kills || 0) + 1; checkTiers('kill', k.kills, [2,4,6,8]); pendingFx.push(p.id); dirty = true;
    if(!UNL.night){ UNL.night = true; store.set(UNL_KEY, JSON.stringify(UNL)); setTimeout(() => { toast({d: today(), kind:'crime', k:'night', a:[]}); sfx.crime(); }, 1200); }   // thème Nuit débloqué
  }
  p.ill = null;
  for(const u of S.unions){
    if(u.a!==p.id && u.b!==p.id) continue;
    if(u.end == null && u.b === p.id) P(u.a).plan = {will: Math.random() < PAIR_P, at: day + rnd(1,8)*365};   // veuvage : peut retrouver quelqu'un
    if(u.preg){
      const pa = P(u.a), pb = P(u.b);
      if(!u.preg.adopt){
        const mother = [pa,pb].find(x => x.sex==='F');
        if(mother && mother.id===p.id){ u.preg = null; log('sad','lost_baby',[p.id], day); }
      } else if(pa.death!=null && pb.death!=null){ u.preg = null; }
    }
    if(u.end == null){ u.end = day; u.endReason = 'décès'; }
  }
  if(cause.old) log('death','death_old',[p.id, A], day);
  else if(cause.war) log('death','death_war',[p.id, cause.war, A], day);
  else if(cause.murder) log('death','death_murder',[p.id, cause.murder, A], day);
  else if(cause.vanished) log('crime','vanished',[p.id], day);
  else if(cause.suicide) log('death','death_suicide',[p.id, A], day);
  else if(cause.legend) log('death','death_legend',[p.id], day);
  else log('death','death_dz',[p.id, cause.dz, A], day);
  sfx.death();
}

/* ================= Mode auto ================= */
const PAIR_P = .72, LEAVE_P = .08, KIDS_P = [.80,.62,.30,.16,.05,.03,.01];   // 80 % ≥ 1 enfant, 62 % ≥ 2, …, 1 % = 7
function newUnionPlan(day){
  const r = Math.random(); let target = 0;
  for(const th of KIDS_P) if(r < th) target++;
  return {target, next: day + rnd(120, 3*365),
    leaveAt: Math.random() < LEAVE_P ? day + rnd(1,25)*365 + rnd(0,364) : null,
    marryAt: Math.random() < .6 ? day + rnd(1,6)*365 + rnd(0,364) : null};
}
function startPregnancy(u, day, toastIt){
  const pa = P(u.a), pb = P(u.b), hetero = pa.sex !== pb.sex;
  const x = toDate(day), due = fromYMD(x.getUTCFullYear(), x.getUTCMonth()+9, x.getUTCDate());
  const mother = hetero ? [pa,pb].find(q => q.sex==='F') : null;
  const miss = hetero && Math.random() < .05 ? day + rnd(30, Math.max(31, due-day-20)) : null;   // 5 % de fausse couche
  u.preg = {start:day, due, miss, adopt:!hetero};
  if(hetero) log('love','preg',[mother.id, due], day, toastIt); else log('love','adopt_start',[pa.id, pb.id, due], day, toastIt);
  return u.preg;
}
function endUnion(u, day, toastIt){
  u.end = day; u.endReason = u.married ? 'divorce' : 'rupture';
  log('break', u.married ? 'divorce' : 'leave', [u.a, u.b], day, toastIt);
  P(u.a).plan = {will: Math.random() < PAIR_P, at: day + rnd(1,8)*365};      // peut retrouver quelqu'un après une rupture
}
function autoPair(p, day){
  const sex = (!R.sameSex || Math.random() < .96) ? (p.sex==='M' ? 'F' : 'M') : p.sex;
  const c = genCandidate(p, sex, day);
  const q = addPerson(Object.assign({}, c, {blood:false, city:p.city}));
  q.lastAge = ageAt(q, day); scheduleYear(q, q.lastAge, day);
  S.unions.push({id:S.nextId++, a:p.id, b:q.id, start:day, married:false, marriedAt:null, end:null, endReason:null, preg:null, plan:newUnionPlan(day)});
  log('love','couple',[p.id, q.id], day, p.id===S.activeId);
  checkConq(p.id);
}
function autoDay(day){
  const crowd = living().length;                                  // plus de 20 vivants : les probabilités chutent
  const skip = S.auto ? null : S.activeId;                        // « famille autonome » : tout le monde sauf vous
  for(const p of living()){
    if(!p.blood || p.id === skip || ageAt(p, day) < R.legal || currentUnion(p.id) || (p.work && p.work.s === 'prison')) continue;
    if(!p.plan) p.plan = {will: Math.random() < PAIR_P, at: Math.max(day, p.birth + Math.round(rnd(18,35)*365.25) + rnd(0,364))};
    if(!p.plan.will || day < p.plan.at) continue;
    if(ageAt(p, day) > 75){ p.plan.will = false; continue; }
    if(crowd > 35 || (crowd > 20 && Math.random() > .2)){ p.plan.at = day + rnd(1,3)*365; continue; }
    autoPair(p, day);
  }
  for(const u of S.unions){

  sc.scrollTo({left: sz.offsetLeft + (p.x + NW/2)*zoom - sc.clientWidth/2, top: sz.offsetTop + (p.y + NH/2)*zoom - sc.clientHeight/2.4, behavior: smooth && !reduced ? 'smooth' : 'auto'});

/* Zoom de l'arbre : boutons, Ctrl + molette (ou pincement sur pavé tactile), touches + et − */
let zoom = 1, treeW = 0, treeH = 0;
function applyZoom(){
  $('#treeCanvas').style.transform = `scale(${zoom})`;
  const sz = $('#treeSizer'); sz.style.width = treeW*zoom + 'px'; sz.style.height = treeH*zoom + 'px';
  $('#zoomPct').textContent = Math.round(zoom*100) + '%';
}
function setZoom(z, cx, cy){
  const sc = $('#treeScroll'), sz = $('#treeSizer');
  z = Math.max(.06, Math.min(1.75, z));
  if(cx == null){ cx = sc.clientWidth/2; cy = sc.clientHeight/2; }
  const px = (sc.scrollLeft + cx - sz.offsetLeft)/zoom, py = (sc.scrollTop + cy - sz.offsetTop)/zoom;
  zoom = z; applyZoom();
  sc.scrollLeft = px*zoom + sz.offsetLeft - cx; sc.scrollTop = py*zoom + sz.offsetTop - cy;
}
function fitZoom(){
  const sc = $('#treeScroll');
  setZoom(Math.min(1, (sc.clientWidth - 16)/treeW, (sc.clientHeight - 16)/treeH));
  sc.scrollTo({left:0, top:0});
}

function statusOf(p){
  const u = currentUnion(p.id);
  if(u){ const q = P(u.b); return u.married ? t('st_married', p, q.first) : t('st_dating', q.first); }
  const ended = S.unions.filter(x => x.a===p.id && x.end!=null).sort((a,b) => b.end-a.end)[0];
  if(ended && ended.endReason==='décès') return ended.married ? t('st_widow', p) : t('st_mourning');
  if(ended && ended.endReason==='divorce') return t('st_divorced', p);
  return t('st_single');
}

/* Zoom de la carte : boutons, molette, glisser pour se déplacer */
let mz = {z:1, x:0, y:0};
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function applyMapZoom(){
  const svg = document.querySelector('.francemap'); if(!svg) return;
  const w = 540/mz.z, h = 530/mz.z;
  svg.setAttribute('viewBox', `${mz.x} ${mz.y} ${w} ${h}`);
  svg.classList.toggle('zoomed', mz.z > 1.01);
  svg.querySelectorAll('#mapDots .msc').forEach(g => g.setAttribute('transform', `scale(${1/mz.z})`));
  svg.querySelectorAll('#mapTowns circle').forEach(c => c.setAttribute('r', String(2/Math.sqrt(mz.z))));
}
function setMapZoom(z, sx, sy, fx, fy){
  z = clampN(z, 1, 6);
  if(sx == null){ fx = fy = .5; sx = mz.x + 270/mz.z; sy = mz.y + 265/mz.z; }
  const w = 540/z, h = 530/z;
  mz = {z, x: clampN(sx - fx*w, 0, 540 - w), y: clampN(sy - fy*h, 0, 530 - h)};
  applyMapZoom();
}
(() => {
  const mv = $('#mapView'); let drag = null, pinch = null;
  mv.addEventListener('touchstart', e => {          // pincer à deux doigts sur la carte
    if(e.touches.length !== 2 || !e.target.closest('.francemap')) return;
    const [a,b] = e.touches; pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: mz.z}; drag = null;
  }, {passive:true});
  mv.addEventListener('touchmove', e => {
    if(!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const svg = document.querySelector('.francemap'), r = svg.getBoundingClientRect(), [a,b] = e.touches;
    const fx = ((a.clientX+b.clientX)/2 - r.left)/r.width, fy = ((a.clientY+b.clientY)/2 - r.top)/r.height;
    setMapZoom(pinch.z * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / pinch.d, mz.x + fx*540/mz.z, mz.y + fy*530/mz.z, fx, fy);
  }, {passive:false});
  mv.addEventListener('touchend', e => { if(e.touches.length < 2) pinch = null; });
  mv.addEventListener('click', e => {               // toucher un point : la ville et ses habitants s'affichent
    const d = e.target.closest('[data-city]'); if(!d) return;
    const tt = d.querySelector('title'), lg = $('#mapLegend');
    if(tt && lg){ lg.textContent = tt.textContent; lg.classList.add('hl'); clearTimeout(lg._t); lg._t = setTimeout(() => { lg.classList.remove('hl'); renderMap(); }, 4000); }
  });
  mv.addEventListener('wheel', e => {
    const svg = e.target.closest('.francemap'); if(!svg) return;
    e.preventDefault();
    const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left)/r.width, fy = (e.clientY - r.top)/r.height;
    setMapZoom(mz.z * Math.exp(-e.deltaY * .0018), mz.x + fx*540/mz.z, mz.y + fy*530/mz.z, fx, fy);
  }, {passive:false});
  mv.addEventListener('pointerdown', e => {
    const svg = e.target.closest('.francemap'); if(!svg || mz.z <= 1.01) return;
    drag = {x:e.clientX, y:e.clientY, mx:mz.x, my:mz.y, r:svg.getBoundingClientRect()}; svg.setPointerCapture(e.pointerId); svg.classList.add('grabbing');
  });
  mv.addEventListener('pointermove', e => {
    if(!drag || pinch) return;
    const w = 540/mz.z, h = 530/mz.z;
    mz.x = clampN(drag.mx - (e.clientX - drag.x)/drag.r.width*w, 0, 540 - w);
    mz.y = clampN(drag.my - (e.clientY - drag.y)/drag.r.height*h, 0, 530 - h);
    applyMapZoom();
  });
  const end = () => { drag = null; const s = document.querySelector('.francemap'); if(s) s.classList.remove('grabbing'); };
  mv.addEventListener('pointerup', end); mv.addEventListener('pointercancel', end);
})();
function renderMap(){
  if(!S) return;
  if(!document.getElementById('mapDots')) buildMap();
  const counts = new Map();
  for(const p of living()){ if(!p.city) continue; if(!counts.has(p.city)) counts.set(p.city, []); counts.get(p.city).push(p); }
  const layer = $('#mapDots'), me = active();
  for(const [city, el] of dotEls){                           // les points s'effacent quand plus personne n'y vit
    if(!counts.has(city)){ const d = el.querySelector('.mdot-in'); if(d) d.classList.add('gone'); dotEls.delete(city); setTimeout(() => el.remove(), 700); }
  }
  for(const [city, ppl] of counts){
    const xy = cityXY(city); if(!xy) continue;
    const n = ppl.length, r = CITY_POS[city] ? 8 + Math.min(10, (n-1)*1.6) : 8, mine = me && me.death == null && me.city === city;
    const names = ppl.slice(0, 8).map(p => nm(p)).join(', ') + (n > 8 ? '…' : '');
    const inner = `<g class="mdot-in ${mine?'mine':''}">${mine ? `<circle r="${r+6}" class="mring"/>` : ''}<circle r="${r}" fill="url(#mDot)" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="${-r*.25}" cy="${-r*.4}" rx="${r*.5}" ry="${r*.28}" fill="#fff" opacity=".75"/>${n > 1 ? `<text class="mn" y="4">${n}</text>` : ''}
      <text class="mlab" y="${r + 14}">${esc(city)}</text><title>${esc(t('map_dot', city, n))} — ${esc(names)}</title></g>`;
    let el = dotEls.get(city);
    const wrapped = `<g class="msc" transform="scale(${1/mz.z})">${inner}</g>`;
    if(!el){ el = document.createElementNS('http://www.w3.org/2000/svg', 'g'); el.setAttribute('transform', `translate(${xy[0]} ${xy[1]})`); el.setAttribute('data-city', city); layer.appendChild(el); dotEls.set(city, el); el.innerHTML = wrapped; el.querySelector('.mdot-in').classList.add('pop'); }
    else if(el.dataset.sig !== n + '|' + mine + '|' + names) el.innerHTML = wrapped;
    el.dataset.sig = n + '|' + mine + '|' + names;
  }
  const total = [...counts.values()].reduce((s,a) => s + a.length, 0);
  const lg = $('#mapLegend'); if(!lg.classList.contains('hl')) lg.textContent = t('map_legend', counts.size, total);
}

    const id = pendingFx.shift();
    sfx.stab();
    const node = document.querySelector(`.node[data-id="${id}"]`);
    if(!node || curView !== 'tree') continue;
    const r = node.getBoundingClientRect();
    if(r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) continue;
    node.classList.add('stabbed');
    if(reduced || !SET.deco) continue;
    const fx = document.createElement('div');
    fx.className = 'knifefx';
    fx.style.left = (r.left + r.width/2) + 'px'; fx.style.top = (r.top + r.height/2) + 'px';
    fx.innerHTML = `<span class="slash"></span><span class="slash s2"></span><span class="knife">${icon('knife')}</span>` +
      Array.from({length:9}, (_,i) => `<i class="drop" style="--a:${i*40 + rnd(-12,12)}deg;--r:${rnd(30,70)}px"></i>`).join('');
    document.body.appendChild(fx);
    setTimeout(() => fx.remove(), 1500);
  }
}

function genCandidate(me, sex, day){
  me = me || active(); sex = sex || S.seek; day = day ?? today();
  const a = ageAt(me, day);
  const lo = Math.max(R.legal, a-10), hi = Math.max(lo, Math.min(100, a+10));
  const pref = me === active() && S.seekAge ? Math.max(R.legal, Math.min(115, S.seekAge + rnd(-3,3))) : null;   // âge préféré (± 3 ans)
  const target = pref ?? rnd(lo, hi), now = toDate(day), cy = now.getUTCFullYear();
  const m = rnd(0,11); let y = cy - target;
  const d = rnd(1, m===1 ? 28 : daysIn(y,m));
  if(m > now.getUTCMonth() || (m===now.getUTCMonth() && d > now.getUTCDate())) y--;
  let last; do { last = pickSurname(cy); } while(last === me.last);
  const c = Object.assign({first: wpick(namePool(y, sex)), last, sex, birth: fromYMD(y,m,d), city: me.city, birthCity: Math.random() < .6 ? me.city : pick(CITIES), conds: rollConds([])}, traits());
  rollAddictions(c, day);
  planInterests(c, day);
  setupWork(c, day);
  return c;
}

function causeText(p){
  const c = p.cause || {};
  if(c.old) return t('cause_old');
  if(c.war) return t('cause_war', c.war, p);
  if(c.murder) return t('cause_murder', p, c.murder);
  if(c.vanished) return t('cause_vanished', p);
  if(c.suicide) return t('cause_suicide');
  if(c.legend) return t('cause_legend', p);
  return t('cause_dz', c.dz);
}
function relation(x, d){
  if(x.parents && x.parents.includes(d.id)) return [0, t('rel_child', x)];
  const par = x.parents ? x.parents.map(P) : [];
  if(par.some(pp => pp.parents && pp.parents.includes(d.id))) return [1, t('rel_grand', x)];
  if(par.some(pp => pp.parents && pp.parents.some(gi => { const q = P(gi); return q.parents && q.parents.includes(d.id); }))) return [2, t('rel_ggrand', x)];
  if(d.parents && x.parents && x.parents.some(i => d.parents.includes(i))) return [3, t('rel_sib', x)];
  if(d.parents && d.parents.includes(x.id)) return [4, t('rel_parent', x)];
  return [5, t('rel_family')];
}

/* ================= Effets ================= */
function burst(colors, n=26){
  if(reduced || !SET.deco) return;
  for(let i=0;i<n;i++){
    const s = document.createElement('i'), size = rnd(8,22), c = pick(colors);
    s.className = 'spark';
    s.style.cssText = `left:50%;top:38%;width:${size}px;height:${size}px;background:radial-gradient(circle at 35% 30%,#fff 0 18%,${c} 60%);box-shadow:0 0 8px ${c}`;
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2, dist = rnd(120,340);
    s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist - 60}px)) scale(1)`,opacity:0}],
      {duration:rnd(800,1500),easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => s.remove();
  }
}
function toast(e){
  const txt = logText(e); if(!txt || !SET.toasts) return;
  const box = $('#toasts'), el = document.createElement('div');
  el.className = `toast glass k-${e.kind}`;
  el.innerHTML = `<i></i><div><time>${fmt(e.d)}</time><p>${esc(txt)}</p></div>`;
  box.prepend(el);
  while(box.children.length > 4) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 4500);
}
function arm(b, label){
  if(b.dataset.armed === '1') return true;
  b.dataset.armed = '1'; const sp = b.querySelector('span') || b, old = sp.textContent;
  sp.textContent = label; b.classList.add('armed');
  setTimeout(() => { if(b.isConnected){ b.dataset.armed = ''; sp.textContent = old; b.classList.remove('armed'); } }, 3000);
  return false;
}
